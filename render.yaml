# Render Blueprint — provisions the full Delegator backend in one shot:
#   - API web service       (FastAPI, runs migrations on boot)
#   - Worker background job (Redis queue consumer)
#   - Postgres database
#   - Key-Value service     (Redis-compatible, used as the run queue)
#
# Frontend (apps/web) is intentionally NOT in this blueprint — it deploys to
# Vercel as a separate concern (the existing ROADMAP convention).
#
# To deploy:
#   1. Commit this file and push.
#   2. dashboard.render.com -> New -> Blueprint -> connect your repo.
#   3. Render reads this file, asks for the secrets marked `sync: false`
#      (ANTHROPIC_API_KEY, ENCRYPTION_KEY, optional Slack/Resend/GitHub).
#   4. Apply. First deploy takes ~5 min; Postgres provisions in parallel.
#   5. Migrations run automatically on each deploy (the Dockerfile's prod
#      target does `alembic upgrade head && uvicorn ...`).
#
# To seed the test workspace after the first deploy:
#   Render dashboard -> delegator-api -> Shell -> `python seed_test_user.py`

databases:
  - name: delegator-db
    # Live DB is on basic_256mb; do NOT downgrade to `free` (Render
    # refuses the plan change on blueprint sync). Upgrade further from
    # the dashboard if the workload needs it.
    plan: basic_256mb
    postgresMajorVersion: 16
    # ipAllowList: []        # uncomment to make it internet-public (default is private)

services:
  # ── Redis (Render calls this "Key Value"; it speaks the Redis protocol) ──
  - type: keyvalue
    name: delegator-redis
    plan: starter            # $10/mo, 250MB
    ipAllowList: []          # private — only other Render services can connect
    maxmemoryPolicy: noeviction   # we lose queued runs otherwise

  # ── API ───────────────────────────────────────────────────────────────────
  - type: web
    name: delegator-api
    runtime: docker
    region: oregon           # pick whichever is closest to your customers
    plan: starter            # $7/mo; bump to standard ($25) once you have load
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    # No build target needed: the Dockerfile's `prod` stage is the last one,
    # so a plain `docker build` ends there. Local compose still asks for the
    # `dev` stage explicitly for hot-reload.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: delegator-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: delegator-redis
          property: connectionString
      - key: API_BASE_URL
        # Render injects RENDER_EXTERNAL_URL; we just alias it so the
        # approval-webhook callback in executor.py picks up the right host.
        fromService:
          type: web
          name: delegator-api
          envVarKey: RENDER_EXTERNAL_URL
      # ── Platform secrets (set in the Render UI on first apply) ────────────
      # These are Delegator-the-platform's own keys, not the customer's.
      # Per-workspace credentials (Slack, GitHub, Resend, DO, Linear, Vercel
      # webhook secret) are stored encrypted in the `integrations` table and
      # configured via Settings -> Integrations in the UI — bring your own.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true   # Render auto-generates a 32-char value
      # ── Optional Clerk auth (leave blank for single-tenant dev mode) ──────
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_FRONTEND_API
        sync: false
      # ── Optional Modal sandbox (leave blank to use local subprocess) ──────
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      # ── Feature flags (declared here so delegator-gateway can inherit via
      # ── fromService; blueprint sync refuses if any referenced key is
      # ── missing). Defaults are safe-off so the flip is opt-in. Change in
      # ── dashboard after the initial apply — the Blueprint won't push over
      # ── a manually-set value on subsequent syncs. ────────────────────────
      #
      # Gateway v2 execution (PR #2045 cond-* profiles).
      - key: GUARD_GATEWAY_PROFILE_V2
        value: "false"
      - key: GUARD_GATEWAY_PROFILE_V2_ROLLOUT_PCT
        value: "0"
      - key: GUARD_GATEWAY_PROFILE_V2_ALLOWLIST
        value: ""
      # Durable audit / Flight Recorder (#1959).
      - key: GUARD_USE_DURABLE_AUDIT
        value: "false"
      - key: GUARD_DURABLE_AUDIT_ROLLOUT_PCT
        value: "0"
      - key: GUARD_DURABLE_AUDIT_ALLOWLIST
        value: ""
      - key: GUARD_DURABLE_AUDIT_FAIL_CLOSED
        value: "false"
      # Admission caps (PRs #2063 / #2064 of #2057). Declared so
      # delegator-gateway inherits — delegator-api itself keeps
      # ADMISSION_ENABLED unset, so these values are dormant on api.
      - key: GATEWAY_ADMISSION_MAX_INFLIGHT
        value: "40"
      - key: GATEWAY_ADMISSION_WORKSPACE_MAX
        value: "10"
      - key: MCP_ADMISSION_MAX_INFLIGHT
        value: "40"
      - key: MCP_ADMISSION_WORKSPACE_MAX
        value: "10"

  # ── Gateway (isolated web service so LLM traffic can't stall dashboard) ──
  # PR 4 of parent epic #2057. Same image + env as `delegator-api`, own
  # worker pool + own health check. Traffic split at the DNS / reverse-
  # proxy layer (not Render — Render doesn't do path-based routing between
  # services). Options:
  #   1. Point a subdomain (e.g. `gateway.conductai.ai`) at this service.
  #   2. Put a proxy (Cloudflare Worker / Vercel Edge) in front of the main
  #      hostname that routes `/gateway/*` and `/mcp` to this service.
  # Either way, `delegator-api` no longer serves gateway traffic in the
  # steady state.
  #
  # DB pool budget: this service shares the same Postgres instance as the
  # other web service + worker. `POOL_SIZE` env var caps SQLAlchemy pool
  # per worker so the sum across services stays under Postgres
  # `max_connections`. Adjust when instance plans change.
  - type: web
    name: delegator-gateway
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: delegator-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: delegator-redis
          property: connectionString
      # This service exists to protect dashboard availability during
      # gateway overload. Keep admission enforcement ON here; the
      # threshold is tuned via `GATEWAY_ADMISSION_*` env vars.
      - key: ADMISSION_ENABLED
        value: "true"
      # Pool sizing note (see block comment above). SQLAlchemy defaults
      # are pool_size=5 + max_overflow=10 = 15 per worker. Two workers
      # per service = 30 per instance. Three web services on one
      # Postgres instance (starter, `max_connections=97`) means 3 * 30
      # = 90, headroom for migrations. Cap explicitly via env var so a
      # future scale-up on the API service doesn't oversubscribe the DB.
      - key: SQLALCHEMY_POOL_SIZE
        value: "5"
      - key: SQLALCHEMY_MAX_OVERFLOW
        value: "10"
      # ── Feature flags — hardcoded defaults, ops flips per-service ─────
      # Independent from delegator-api so the two services can be tuned
      # separately in the dashboard (v2 canary on api first, then flip
      # here once healthy). Same defaults as delegator-api so behavior
      # is identical on first apply.
      #
      # fromService inheritance was tried in the initial draft (#2066)
      # but chicken-and-egg'd with blueprint sync: Render resolves the
      # ref during service creation, before the paired "Create env var
      # on delegator-api" actions run, so gateway creation failed with
      # "environment variable used but not defined". Hardcoded values
      # eliminate the dependency and sync succeeds.
      - key: GUARD_GATEWAY_PROFILE_V2
        value: "false"
      - key: GUARD_GATEWAY_PROFILE_V2_ROLLOUT_PCT
        value: "0"
      - key: GUARD_GATEWAY_PROFILE_V2_ALLOWLIST
        value: ""
      - key: GUARD_USE_DURABLE_AUDIT
        value: "false"
      - key: GUARD_DURABLE_AUDIT_ROLLOUT_PCT
        value: "0"
      - key: GUARD_DURABLE_AUDIT_ALLOWLIST
        value: ""
      - key: GUARD_DURABLE_AUDIT_FAIL_CLOSED
        value: "false"
      # Admission caps — same defaults as delegator-api, tunable
      # per-service in the dashboard.
      - key: GATEWAY_ADMISSION_MAX_INFLIGHT
        value: "40"
      - key: GATEWAY_ADMISSION_WORKSPACE_MAX
        value: "10"
      - key: MCP_ADMISSION_MAX_INFLIGHT
        value: "40"
      - key: MCP_ADMISSION_WORKSPACE_MAX
        value: "10"
      # ── Rest of the shared env ────────────────────────────────────────
      - key: API_BASE_URL
        fromService:
          type: web
          name: delegator-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: delegator-api
          envVarKey: ENCRYPTION_KEY
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_FRONTEND_API
        sync: false
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false

  # ── Worker (same image, different command) ────────────────────────────────
  - type: worker
    name: delegator-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: python -m app.worker
    autoDeploy: true
    envVars:
      # Shared env with the API — every var has to be repeated here because
      # Render doesn't (yet) support shared env groups in Blueprints reliably.
      - key: DATABASE_URL
        fromDatabase:
          name: delegator-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: delegator-redis
          property: connectionString
      - key: API_BASE_URL
        fromService:
          type: web
          name: delegator-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: delegator-api
          envVarKey: ENCRYPTION_KEY
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
