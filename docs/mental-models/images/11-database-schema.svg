<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Database Schema</title>
  <desc id="desc">Workspace is the root. Workflows, runs, credentials, identities, guard policy, and memory hang from it.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  </style>
  <rect width="1600" height="1060" fill="#f8fafc"/>
  <text x="58" y="66" font-size="42" font-weight="800" fill="#111827">Database Schema</text>
  <text x="60" y="105" font-size="23" fill="#64748b">Workspace is the root. Workflows, runs, credentials, identities, guard policy, and memory hang from it.</text>
  <g>
    <path d="M 650 170 C 500 170, 500 425, 350 425" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 350 425 C 385 425, 385 435, 420 435" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 720 435 C 760 435, 760 445, 800 445" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 1085 445 C 1125 445, 1125 430, 1165 430" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 800 230 C 800 455, 257.5 455, 257.5 680" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 800 230 C 800 455, 630 455, 630 680" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 800 230 C 800 455, 1007.5 455, 1007.5 680" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 800 230 C 800 455, 1375 455, 1375 680" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  <g filter="url(#shadow)">
    
  <g id="workspace">
    <rect x="650" y="110" width="300" height="120" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="650" y="110" width="12" height="120" rx="6" fill="#2563eb"/>
    <text x="676" y="154" font-size="29" font-weight="700" fill="#111827">Workspace</text>
    <text x="676" y="192" font-size="23" font-weight="400" fill="#111827">Tenant boundary</text>
<text x="676" y="219.6" font-size="23" font-weight="400" fill="#111827">Common foreign key</text>
  </g>

  <g id="workflows">
    <rect x="80" y="330" width="270" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="80" y="330" width="12" height="190" rx="6" fill="#7c3aed"/>
    <text x="106" y="374" font-size="29" font-weight="700" fill="#111827">workflows</text>
    <text x="106" y="412" font-size="23" font-weight="400" fill="#111827">current_version_id</text>
<text x="106" y="439.6" font-size="23" font-weight="400" fill="#111827">playbook_slug</text>
<text x="106" y="467.2" font-size="23" font-weight="400" fill="#111827">guard_enabled</text>
<text x="106" y="494.8" font-size="23" font-weight="400" fill="#111827">archived_at</text>
  </g>

  <g id="versions">
    <rect x="420" y="330" width="300" height="210" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="420" y="330" width="12" height="210" rx="6" fill="#0f766e"/>
    <text x="446" y="374" font-size="29" font-weight="700" fill="#111827">workflow_versions</text>
    <text x="446" y="412" font-size="23" font-weight="400" fill="#111827">yaml_source</text>
<text x="446" y="439.6" font-size="23" font-weight="400" fill="#111827">graph JSONB</text>
<text x="446" y="467.2" font-size="23" font-weight="400" fill="#111827">compiled_artifacts</text>
<text x="446" y="494.8" font-size="23" font-weight="400" fill="#111827">published_at</text>
  </g>

  <g id="runs">
    <rect x="800" y="330" width="285" height="230" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="800" y="330" width="12" height="230" rx="6" fill="#ea580c"/>
    <text x="826" y="374" font-size="29" font-weight="700" fill="#111827">runs</text>
    <text x="826" y="412" font-size="23" font-weight="400" fill="#111827">status</text>
<text x="826" y="439.6" font-size="23" font-weight="400" fill="#111827">state JSONB</text>
<text x="826" y="467.2" font-size="23" font-weight="400" fill="#111827">outcome</text>
<text x="826" y="494.8" font-size="23" font-weight="400" fill="#111827">attempt_count</text>
<text x="826" y="522.4" font-size="23" font-weight="400" fill="#111827">locked_at/by</text>
  </g>

  <g id="events">
    <rect x="1165" y="330" width="300" height="200" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1165" y="330" width="12" height="200" rx="6" fill="#16a34a"/>
    <text x="1191" y="374" font-size="29" font-weight="700" fill="#111827">run_events</text>
    <text x="1191" y="412" font-size="23" font-weight="400" fill="#111827">run_id</text>
<text x="1191" y="439.6" font-size="23" font-weight="400" fill="#111827">block_id</text>
<text x="1191" y="467.2" font-size="23" font-weight="400" fill="#111827">kind</text>
<text x="1191" y="494.8" font-size="23" font-weight="400" fill="#111827">payload JSONB</text>
<text x="1191" y="522.4" font-size="23" font-weight="400" fill="#111827">created_at</text>
  </g>

  <g id="integrations">
    <rect x="115" y="680" width="285" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="115" y="680" width="12" height="190" rx="6" fill="#dc2626"/>
    <text x="141" y="724" font-size="29" font-weight="700" fill="#111827">integrations</text>
    <text x="141" y="762" font-size="23" font-weight="400" fill="#111827">handle</text>
<text x="141" y="789.6" font-size="23" font-weight="400" fill="#111827">service</text>
<text x="141" y="817.2" font-size="23" font-weight="400" fill="#111827">encrypted_credentials</text>
<text x="141" y="844.8" font-size="23" font-weight="400" fill="#111827">environment_id</text>
<text x="141" y="872.4" font-size="23" font-weight="400" fill="#111827">nullable</text>
  </g>

  <g id="identities">
    <rect x="480" y="680" width="300" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="480" y="680" width="12" height="190" rx="6" fill="#475569"/>
    <text x="506" y="724" font-size="29" font-weight="700" fill="#111827">agent identities</text>
    <text x="506" y="762" font-size="23" font-weight="400" fill="#111827">token_prefix</text>
<text x="506" y="789.6" font-size="23" font-weight="400" fill="#111827">token_encrypted</text>
<text x="506" y="817.2" font-size="23" font-weight="400" fill="#111827">run_tokens</text>
<text x="506" y="844.8" font-size="23" font-weight="400" fill="#111827">invalidated_at</text>
  </g>

  <g id="guard">
    <rect x="860" y="680" width="295" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="860" y="680" width="12" height="190" rx="6" fill="#2563eb"/>
    <text x="886" y="724" font-size="29" font-weight="700" fill="#111827">guard tables</text>
    <text x="886" y="762" font-size="23" font-weight="400" fill="#111827">GuardConfig</text>
<text x="886" y="789.6" font-size="23" font-weight="400" fill="#111827">SkillPack</text>
<text x="886" y="817.2" font-size="23" font-weight="400" fill="#111827">GuardAuditEvent</text>
<text x="886" y="844.8" font-size="23" font-weight="400" fill="#111827">GuardPolicyCache</text>
  </g>

  <g id="memory">
    <rect x="1230" y="680" width="290" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1230" y="680" width="12" height="190" rx="6" fill="#0f766e"/>
    <text x="1256" y="724" font-size="29" font-weight="700" fill="#111827">agent_memory</text>
    <text x="1256" y="762" font-size="23" font-weight="400" fill="#111827">scope + key</text>
<text x="1256" y="789.6" font-size="23" font-weight="400" fill="#111827">summary</text>
<text x="1256" y="817.2" font-size="23" font-weight="400" fill="#111827">embedding vector</text>
<text x="1256" y="844.8" font-size="23" font-weight="400" fill="#111827">run_id</text>
  </g>
  </g>
  
  <g>
    <rect x="80" y="920" width="1460" height="72" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
    <circle cx="118" cy="956" r="12" fill="#7c3aed"/>
    <text x="148" y="965" font-size="25" font-weight="650" fill="#111827">Non-obvious invariant: yaml_source is canonical; graph and compiled_artifacts are derived caches.</text>
  </g>
</svg>
