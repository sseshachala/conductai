<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Brain Block</title>
  <desc id="desc">A bounded LLM reasoning loop that can stay single-turn or run tools inside an isolated session.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="58" y="66" font-size="42" font-weight="800" fill="#111827">Brain Block</text>
  <text x="60" y="105" font-size="23" fill="#64748b">A bounded LLM reasoning loop that can stay single-turn or run tools inside an isolated session.</text>
  <g>
    <path d="M 320 247.5 C 352.5 247.5, 352.5 222.5, 385 222.5" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 320 247.5 C 352.5 247.5, 352.5 510, 385 510" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 695 222.5 C 735 222.5, 735 317.5, 775 317.5" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 695 510 C 735 510, 735 317.5, 775 317.5" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 1155 317.5 C 1195 317.5, 1195 237.5, 1235 237.5" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 1235 237.5 C 1195 237.5, 1195 317.5, 1155 317.5" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/><text x="1195" y="265.5" text-anchor="middle" font-size="20" font-weight="700" fill="#64748b">LLM response</text>
<path d="M 1155 317.5 C 1195 317.5, 1195 517.5, 1235 517.5" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  <g filter="url(#shadow)">
    
  <g id="block">
    <rect x="60" y="170" width="260" height="155" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="60" y="170" width="12" height="155" rx="6" fill="#2563eb"/>
    <text x="86" y="214" font-size="29" font-weight="700" fill="#111827">_execute_brain()</text>
    <text x="86" y="252" font-size="23" font-weight="400" fill="#111827">Block config</text>
<text x="86" y="279.6" font-size="23" font-weight="400" fill="#111827">State context</text>
<text x="86" y="307.2" font-size="23" font-weight="400" fill="#111827">Compiled prompt</text>
  </g>

  <g id="router">
    <rect x="385" y="115" width="310" height="215" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="385" y="115" width="12" height="215" rx="6" fill="#7c3aed"/>
    <text x="411" y="159" font-size="29" font-weight="700" fill="#111827">Model router</text>
    <text x="411" y="197" font-size="23" font-weight="400" fill="#111827">Explicit YAML model</text>
<text x="411" y="224.6" font-size="23" font-weight="400" fill="#111827">wins</text>
<text x="411" y="252.2" font-size="23" font-weight="400" fill="#111827">inputs.model override</text>
<text x="411" y="279.8" font-size="23" font-weight="400" fill="#111827">Playbook default</text>
<text x="411" y="307.4" font-size="23" font-weight="400" fill="#111827">Complexity -&gt; model</text>
  </g>

  <g id="session">
    <rect x="385" y="405" width="310" height="210" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="385" y="405" width="12" height="210" rx="6" fill="#0f766e"/>
    <text x="411" y="449" font-size="29" font-weight="700" fill="#111827">Execution session</text>
    <text x="411" y="487" font-size="23" font-weight="400" fill="#111827">managed: no</text>
<text x="411" y="514.6" font-size="23" font-weight="400" fill="#111827">shell/files</text>
<text x="411" y="542.2" font-size="23" font-weight="400" fill="#111827">e2b: ephemeral</text>
<text x="411" y="569.8" font-size="23" font-weight="400" fill="#111827">workspace</text>
<text x="411" y="597.4" font-size="23" font-weight="400" fill="#111827">modal: container</text>
<text x="411" y="625" font-size="23" font-weight="400" fill="#111827">ssh: persistent</text>
<text x="411" y="652.6" font-size="23" font-weight="400" fill="#111827">remote</text>
  </g>

  <g id="loop">
    <rect x="775" y="145" width="380" height="345" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="775" y="145" width="12" height="345" rx="6" fill="#ea580c"/>
    <text x="801" y="189" font-size="29" font-weight="700" fill="#111827">Agentic loop</text>
    <text x="801" y="227" font-size="23" font-weight="400" fill="#111827">Turn 1 sufficiency check</text>
<text x="801" y="254.6" font-size="23" font-weight="400" fill="#111827">POST via Guard proxy</text>
<text x="801" y="282.2" font-size="23" font-weight="400" fill="#111827">Parse stop_reason/tool</text>
<text x="801" y="309.8" font-size="23" font-weight="400" fill="#111827">calls</text>
<text x="801" y="337.4" font-size="23" font-weight="400" fill="#111827">Dispatch tools to session</text>
<text x="801" y="365" font-size="23" font-weight="400" fill="#111827">Accumulate turns + cost</text>
<text x="801" y="392.6" font-size="23" font-weight="400" fill="#111827">Stop on answer or budget</text>
  </g>

  <g id="guard">
    <rect x="1235" y="145" width="300" height="185" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1235" y="145" width="12" height="185" rx="6" fill="#dc2626"/>
    <text x="1261" y="189" font-size="29" font-weight="700" fill="#111827">Guard proxy</text>
    <text x="1261" y="227" font-size="23" font-weight="400" fill="#111827">Conduct URL only</text>
<text x="1261" y="254.6" font-size="23" font-weight="400" fill="#111827">Policy before vendor</text>
<text x="1261" y="282.2" font-size="23" font-weight="400" fill="#111827">Audit every call</text>
  </g>

  <g id="output">
    <rect x="1235" y="405" width="300" height="225" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1235" y="405" width="12" height="225" rx="6" fill="#16a34a"/>
    <text x="1261" y="449" font-size="29" font-weight="700" fill="#111827">Output shape</text>
    <text x="1261" y="487" font-size="23" font-weight="400" fill="#111827">output text</text>
<text x="1261" y="514.6" font-size="23" font-weight="400" fill="#111827">model + provider</text>
<text x="1261" y="542.2" font-size="23" font-weight="400" fill="#111827">turns + tokens</text>
<text x="1261" y="569.8" font-size="23" font-weight="400" fill="#111827">cost_usd</text>
<text x="1261" y="597.4" font-size="23" font-weight="400" fill="#111827">extracted PR/branch</text>
<text x="1261" y="625" font-size="23" font-weight="400" fill="#111827">JSON</text>
  </g>
  </g>
  
  <g>
    <rect x="70" y="760" width="1460" height="72" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
    <circle cx="108" cy="796" r="12" fill="#dc2626"/>
    <text x="138" y="805" font-size="25" font-weight="650" fill="#111827">Critical rule: agentic blocks need runs_on=e2b/modal/ssh for real file or shell access.</text>
  </g>
</svg>
