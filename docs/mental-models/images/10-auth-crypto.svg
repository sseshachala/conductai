<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Auth &amp; Crypto</title>
  <desc id="desc">Human authentication and secret-at-rest protection are independent systems that meet at request handlers.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="58" y="66" font-size="42" font-weight="800" fill="#111827">Auth &amp; Crypto</text>
  <text x="60" y="105" font-size="23" fill="#64748b">Human authentication and secret-at-rest protection are independent systems that meet at request handlers.</text>
  <g>
    <path d="M 305 405 C 347.5 405, 347.5 247.5, 390 247.5" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 305 405 C 347.5 405, 347.5 642.5, 390 642.5" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 740 247.5 C 992.5 247.5, 992.5 410, 1245 410" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 1150 232.5 C 1197.5 232.5, 1197.5 410, 1245 410" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 740 642.5 C 785 642.5, 785 630, 830 630" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 1150 630 C 1197.5 630, 1197.5 410, 1245 410" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  <g filter="url(#shadow)">
    
  <g id="request">
    <rect x="65" y="330" width="240" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="65" y="330" width="12" height="150" rx="6" fill="#2563eb"/>
    <text x="91" y="374" font-size="29" font-weight="700" fill="#111827">Endpoint request</text>
    <text x="91" y="412" font-size="23" font-weight="400" fill="#111827">User or API caller</text>
<text x="91" y="439.6" font-size="23" font-weight="400" fill="#111827">Router</text>
<text x="91" y="467.2" font-size="23" font-weight="400" fill="#111827">dependencies</text>
<text x="91" y="494.8" font-size="23" font-weight="400" fill="#111827">Workspace lookup</text>
  </g>

  <g id="clerk">
    <rect x="390" y="105" width="350" height="285" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="390" y="105" width="12" height="285" rx="6" fill="#7c3aed"/>
    <text x="416" y="149" font-size="29" font-weight="700" fill="#111827">Clerk JWT verification</text>
    <text x="416" y="187" font-size="23" font-weight="400" fill="#111827">Read KID</text>
<text x="416" y="214.6" font-size="23" font-weight="400" fill="#111827">Fetch/cache JWKS</text>
<text x="416" y="242.2" font-size="23" font-weight="400" fill="#111827">Verify RS256</text>
<text x="416" y="269.8" font-size="23" font-weight="400" fill="#111827">Validate issuer</text>
<text x="416" y="297.4" font-size="23" font-weight="400" fill="#111827">Optional audience</text>
<text x="416" y="325" font-size="23" font-weight="400" fill="#111827">Return sub + org_id</text>
  </g>

  <g id="crypto">
    <rect x="390" y="505" width="350" height="275" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="390" y="505" width="12" height="275" rx="6" fill="#0f766e"/>
    <text x="416" y="549" font-size="29" font-weight="700" fill="#111827">AES-256-GCM</text>
    <text x="416" y="587" font-size="23" font-weight="400" fill="#111827">96-bit random nonce</text>
<text x="416" y="614.6" font-size="23" font-weight="400" fill="#111827">nonce + ciphertext base64</text>
<text x="416" y="642.2" font-size="23" font-weight="400" fill="#111827">ENCRYPTION_KEY padded to</text>
<text x="416" y="669.8" font-size="23" font-weight="400" fill="#111827">32 bytes</text>
<text x="416" y="697.4" font-size="23" font-weight="400" fill="#111827">Prod fails on default key</text>
  </g>

  <g id="secrets">
    <rect x="830" y="505" width="320" height="250" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="830" y="505" width="12" height="250" rx="6" fill="#ea580c"/>
    <text x="856" y="549" font-size="29" font-weight="700" fill="#111827">Encrypted at rest</text>
    <text x="856" y="587" font-size="23" font-weight="400" fill="#111827">integration</text>
<text x="856" y="614.6" font-size="23" font-weight="400" fill="#111827">credentials</text>
<text x="856" y="642.2" font-size="23" font-weight="400" fill="#111827">agent identity token</text>
<text x="856" y="669.8" font-size="23" font-weight="400" fill="#111827">run token until first</text>
<text x="856" y="697.4" font-size="23" font-weight="400" fill="#111827">read</text>
<text x="856" y="725" font-size="23" font-weight="400" fill="#111827">CredentialStore</text>
<text x="856" y="752.6" font-size="23" font-weight="400" fill="#111827">prevents log leaks</text>
  </g>

  <g id="hash">
    <rect x="830" y="125" width="320" height="215" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="830" y="125" width="12" height="215" rx="6" fill="#dc2626"/>
    <text x="856" y="169" font-size="29" font-weight="700" fill="#111827">Hash-only secrets</text>
    <text x="856" y="207" font-size="23" font-weight="400" fill="#111827">cond_live_* API key</text>
<text x="856" y="234.6" font-size="23" font-weight="400" fill="#111827">run token hash</text>
<text x="856" y="262.2" font-size="23" font-weight="400" fill="#111827">SHA-256 lookup</text>
<text x="856" y="289.8" font-size="23" font-weight="400" fill="#111827">Plaintext never</text>
<text x="856" y="317.4" font-size="23" font-weight="400" fill="#111827">persisted</text>
  </g>

  <g id="rbac">
    <rect x="1245" y="300" width="300" height="220" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1245" y="300" width="12" height="220" rx="6" fill="#16a34a"/>
    <text x="1271" y="344" font-size="29" font-weight="700" fill="#111827">Endpoint guard</text>
    <text x="1271" y="382" font-size="23" font-weight="400" fill="#111827">get_workspace_id</text>
<text x="1271" y="409.6" font-size="23" font-weight="400" fill="#111827">get_current_user</text>
<text x="1271" y="437.2" font-size="23" font-weight="400" fill="#111827">require_permission</text>
<text x="1271" y="464.8" font-size="23" font-weight="400" fill="#111827">RBAC via</text>
<text x="1271" y="492.4" font-size="23" font-weight="400" fill="#111827">role_permissions</text>
  </g>
  </g>
  
  <g>
    <rect x="75" y="795" width="1460" height="72" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
    <circle cx="113" cy="831" r="12" fill="#16a34a"/>
    <text x="143" y="840" font-size="25" font-weight="650" fill="#111827">Rule of thumb: use require_permission() on new endpoints; require_workspace_role() is legacy.</text>
  </g>
</svg>
