<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Guard Proxy</title>
  <desc id="desc">A universal LLM gateway that authenticates, enforces policy, selects upstream, forwards, and audits.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="58" y="66" font-size="42" font-weight="800" fill="#111827">Guard Proxy</text>
  <text x="60" y="105" font-size="23" fill="#64748b">A universal LLM gateway that authenticates, enforces policy, selects upstream, forwards, and audits.</text>
  <g>
    <path d="M 290 277.5 C 317.5 277.5, 317.5 245, 345 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 615 245 C 647.5 245, 647.5 245, 680 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 965 245 C 997.5 245, 997.5 245, 1030 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 1290 245 C 1325 245, 1325 277.5, 1360 277.5" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 822.5 355 C 822.5 430, 830 430, 830 505" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/>
<path d="M 1360 277.5 C 1172.5 277.5, 1172.5 610, 985 610" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowhead)"/><text x="1172.5" y="431.75" text-anchor="middle" font-size="20" font-weight="700" fill="#64748b">after stream</text>
  </g>
  <g filter="url(#shadow)">
    
  <g id="incoming">
    <rect x="55" y="205" width="235" height="145" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="55" y="205" width="12" height="145" rx="6" fill="#2563eb"/>
    <text x="81" y="249" font-size="29" font-weight="700" fill="#111827">Incoming SDK call</text>
    <text x="81" y="287" font-size="23" font-weight="400" fill="#111827">Anthropic</text>
<text x="81" y="314.6" font-size="23" font-weight="400" fill="#111827">OpenAI</text>
<text x="81" y="342.2" font-size="23" font-weight="400" fill="#111827">Perplexity</text>
  </g>

  <g id="auth">
    <rect x="345" y="135" width="270" height="220" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="345" y="135" width="12" height="220" rx="6" fill="#7c3aed"/>
    <text x="371" y="179" font-size="29" font-weight="700" fill="#111827">1. AUTH</text>
    <text x="371" y="217" font-size="23" font-weight="400" fill="#111827">cond_run_* -&gt; run</text>
<text x="371" y="244.6" font-size="23" font-weight="400" fill="#111827">cond_agt_* -&gt;</text>
<text x="371" y="272.2" font-size="23" font-weight="400" fill="#111827">agent</text>
<text x="371" y="299.8" font-size="23" font-weight="400" fill="#111827">guard-mt-* -&gt;</text>
<text x="371" y="327.4" font-size="23" font-weight="400" fill="#111827">member</text>
<text x="371" y="355" font-size="23" font-weight="400" fill="#111827">cond_live_* -&gt; API</text>
<text x="371" y="382.6" font-size="23" font-weight="400" fill="#111827">key</text>
<text x="371" y="410.2" font-size="23" font-weight="400" fill="#111827">Unknown -&gt; 401</text>
  </g>

  <g id="policy">
    <rect x="680" y="135" width="285" height="220" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="680" y="135" width="12" height="220" rx="6" fill="#dc2626"/>
    <text x="706" y="179" font-size="29" font-weight="700" fill="#111827">2. POLICY</text>
    <text x="706" y="217" font-size="23" font-weight="400" fill="#111827">compute_policy(proxy)</text>
<text x="706" y="244.6" font-size="23" font-weight="400" fill="#111827">Match</text>
<text x="706" y="272.2" font-size="23" font-weight="400" fill="#111827">provider/model/prompt</text>
<text x="706" y="299.8" font-size="23" font-weight="400" fill="#111827">BLOCK -&gt; 403</text>
<text x="706" y="327.4" font-size="23" font-weight="400" fill="#111827">WARN or ALLOW -&gt;</text>
<text x="706" y="355" font-size="23" font-weight="400" fill="#111827">forward</text>
<text x="706" y="382.6" font-size="23" font-weight="400" fill="#111827">Error -&gt; 403</text>
<text x="706" y="410.2" font-size="23" font-weight="400" fill="#111827">fail-closed</text>
  </g>

  <g id="upstream">
    <rect x="1030" y="135" width="260" height="220" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1030" y="135" width="12" height="220" rx="6" fill="#0f766e"/>
    <text x="1056" y="179" font-size="29" font-weight="700" fill="#111827">3-4. UPSTREAM + KEY</text>
    <text x="1056" y="217" font-size="23" font-weight="400" fill="#111827">BYO gateway if</text>
<text x="1056" y="244.6" font-size="23" font-weight="400" fill="#111827">configured</text>
<text x="1056" y="272.2" font-size="23" font-weight="400" fill="#111827">Vendor direct</text>
<text x="1056" y="299.8" font-size="23" font-weight="400" fill="#111827">otherwise</text>
<text x="1056" y="327.4" font-size="23" font-weight="400" fill="#111827">Use proxy key or</text>
<text x="1056" y="355" font-size="23" font-weight="400" fill="#111827">vendor key</text>
<text x="1056" y="382.6" font-size="23" font-weight="400" fill="#111827">Missing key -&gt;</text>
<text x="1056" y="410.2" font-size="23" font-weight="400" fill="#111827">clear 400</text>
  </g>

  <g id="forward">
    <rect x="1360" y="205" width="190" height="145" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1360" y="205" width="12" height="145" rx="6" fill="#16a34a"/>
    <text x="1386" y="249" font-size="29" font-weight="700" fill="#111827">5. FORWARD</text>
    <text x="1386" y="287" font-size="23" font-weight="400" fill="#111827">SSE passthrough</text>
<text x="1386" y="314.6" font-size="23" font-weight="400" fill="#111827">Vendor format</text>
  </g>

  <g id="audit">
    <rect x="675" y="505" width="310" height="210" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="675" y="505" width="12" height="210" rx="6" fill="#ea580c"/>
    <text x="701" y="549" font-size="29" font-weight="700" fill="#111827">6. AUDIT</text>
    <text x="701" y="587" font-size="23" font-weight="400" fill="#111827">Background write</text>
<text x="701" y="614.6" font-size="23" font-weight="400" fill="#111827">workspace + user</text>
<text x="701" y="642.2" font-size="23" font-weight="400" fill="#111827">provider + model</text>
<text x="701" y="669.8" font-size="23" font-weight="400" fill="#111827">decision + rule_id</text>
<text x="701" y="697.4" font-size="23" font-weight="400" fill="#111827">tokens + cost</text>
  </g>
  </g>
  
  <g>
    <rect x="70" y="780" width="1460" height="72" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
    <circle cx="108" cy="816" r="12" fill="#dc2626"/>
    <text x="138" y="825" font-size="25" font-weight="650" fill="#111827">Fail-closed boundary: auth or policy uncertainty never reaches the upstream LLM.</text>
  </g>
</svg>
