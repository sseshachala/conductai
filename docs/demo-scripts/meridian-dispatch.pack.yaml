# Meridian Dispatch — E1 demo pack
#
# Entitlement-aware dispatch for the fictional Meridian Devices support org.
# Runs in the demo workspace. Referenced by docs/demo-scripts/E1-the-140-dollar-ticket.md.
#
# ponytail: YAML shape matches the bible spec, not the live JSON skill_pack format.
# Convert to skill_pack JSON when this graduates from demo-asset to real Guard rule.

pack:
  slug: meridian-dispatch
  name: PH Dispatch
  version: 0.1.0
  tier: demo
  description: >
    Entitlement-aware RMA dispatch for Meridian Devices. Blocks on-site truck
    rolls for depot-tier tenants and suggests mail-in RMA instead. Emits a
    cost-avoided receipt on every deny.

# Seed tenants — three shapes so the demo can show block, allow, and self-serve
tenants:
  - id: northwind
    name: Northwind Outfitters
    entitlement_tier: depot        # mail-in only
    device_count: 340
    contact_email: it@northwind.example.com
  - id: contoso
    name: Contoso Retail
    entitlement_tier: onsite       # dispatch allowed
    device_count: 12000
    contact_email: helpdesk@contoso.example.com
  - id: fabrikam
    name: Fabrikam Studios
    entitlement_tier: self_serve   # neither dispatch nor mail-in — remote only
    device_count: 45
    contact_email: ops@fabrikam.example.com

# Cost model — three-tier ceiling from the HP conversation
costs:
  dispatch.rma: 140.00       # on-site tech
  rma.mail_in: 4.50          # prepaid shipping label
  remote.session: 35.00      # tech does a screen-share
  ai.only: 0.02              # LLM tokens

rules:
  - id: meridian.dispatch.entitlement_check
    description: Block on-site dispatch for tenants not entitled to it. Suggest mail-in.
    when:
      intent: dispatch.rma
    require:
      tenant.entitlement_tier: onsite
    on_deny:
      action: block
      suggest: rma.mail_in
      reason: >
        {{tenant.name}} entitlement is {{tenant.entitlement_tier}} —
        dispatch requires onsite.
      receipt:
        # cost_avoided = dispatch cost - suggested action cost
        cost_avoided_usd: 135.50
        suggested_action: rma.mail_in
    severity: high
    frameworks:
      - SOC2:CC7.3

  - id: meridian.dispatch.selfserve_no_physical
    description: Self-serve tenants get remote-only. Block both dispatch and mail-in.
    when:
      intent: [dispatch.rma, rma.mail_in]
    require:
      tenant.entitlement_tier: [onsite, depot]
    on_deny:
      action: block
      suggest: remote.session
      reason: >
        {{tenant.name}} is self-serve tier — physical fulfillment not covered.
      receipt:
        cost_avoided_usd: 105.00   # dispatch $140 - remote $35, worst-case
        suggested_action: remote.session
    severity: medium
    frameworks:
      - SOC2:CC7.3

# Surfaces this pack enforces on. MCP is cooperative (Sierra opts in);
# proxy is the hard boundary if Sierra skips guard_check.
enforcement:
  mcp: cooperative       # sierra-ai calls guard_check(intent=...) before the tool
  proxy: hard            # dispatch.meridian.com API sits behind Conduct proxy
  hook: not_supported
  runtime: not_supported

# Demo-only: pre-seeded receipts so /theguard/reports has a rolling total.
# ponytail: static seed, replace with real activity once a live demo run exists.
seed_receipts:
  - ts: "2026-08-01T14:07:00Z"
    actor: sierra-ai
    tenant: northwind
    intent: dispatch.rma
    decision: block
    cost_avoided_usd: 135.50
  - ts: "2026-08-01T14:22:00Z"
    actor: sierra-ai
    tenant: fabrikam
    intent: dispatch.rma
    decision: block
    cost_avoided_usd: 105.00
