# Conduct detection content for Splunk.
#
# Install: copy these stanzas into the savedsearches.conf of an app on your search head
# (for example $SPLUNK_HOME/etc/apps/conduct_detections/local/savedsearches.conf), then
# adjust `index` / `sourcetype` if you ingest under different names. Searches assume the
# native JSON feed (`conduct audit feed`) under sourcetype conduct:guard:audit. See
# docs/siem/README.md for field names and tuning.
#
# The feed is at-least-once, so every search starts with `dedup id`.

[Conduct - Repeated Guard blocks from one agent or user]
description = An agent identity or user was blocked by Guard 5 or more times in 10 minutes: probing a policy boundary or stuck in a retry loop.
search = index=conduct sourcetype="conduct:guard:audit" decision=blocked \
| dedup id \
| eval actor=coalesce(agent_identity_id, clerk_user_id, user_email) \
| where isnotnull(actor) \
| bin _time span=10m \
| stats count AS blocks dc(tool_call) AS distinct_tools values(tool_call) AS tools values(rule_id) AS rules \
        earliest(_time) AS first_block latest(_time) AS last_block values(user_email) AS user_email \
        BY workspace_id actor _time \
| where blocks>=5
cron_schedule = */10 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
enableSched = 1
alert.track = 1
alert.severity = 3
counttype = number of events
relation = greater than
quantity = 0

[Conduct - Tool re-attempted after the approval was rejected]
description = A user's approval request was rejected, then within 15 minutes the same user ran the same tool and Guard allowed it with no approval in between. Heuristic: a generic tool name can be a legitimate retry.
search = index=conduct sourcetype="conduct:guard:audit" (decision=approval_pending OR decision=rejected OR decision=approved OR decision=allowed) \
| dedup id \
| eval kind=case(decision=="approval_pending","pending", decision=="rejected","rejected", decision=="approved","approved", true(),"allowed") \
| eval rej_t=if(kind=="rejected",_time,null()), app_t=if(kind=="approved",_time,null()), req=if(kind=="pending",user_email,null()) \
| sort 0 workspace_id tool_call _time id \
| streamstats current=f last(rej_t) AS rejected_at last(app_t) AS approved_at last(req) AS last_requester BY workspace_id tool_call \
| where kind=="allowed" AND isnotnull(rejected_at) AND _time-rejected_at<=900 AND user_email==last_requester \
        AND (isnull(approved_at) OR approved_at<rejected_at) \
| table _time workspace_id tool_call rule_id ai_tool user_email agent_identity_id rejected_at id
cron_schedule = */10 * * * *
dispatch.earliest_time = -2h@m
dispatch.latest_time = now
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0

[Conduct - New MCP server first seen]
description = A tool on an MCP server (tool_call mcp__<server>__<tool>) was called and no call to that server exists in the previous 14 days.
search = index=conduct sourcetype="conduct:guard:audit" tool_call="mcp__*" \
| dedup id \
| eval server=mvindex(split(tool_call,"__"),1) \
| where isnotnull(server) AND server!="" \
| stats earliest(_time) AS first_seen latest(_time) AS last_seen count AS calls values(tool_call) AS tools \
        values(user_email) AS users values(ai_tool) AS ai_tools BY workspace_id server \
| where first_seen>=relative_time(now(), "-1h")
cron_schedule = 5 * * * *
dispatch.earliest_time = -14d@d
dispatch.latest_time = now
enableSched = 1
alert.track = 1
alert.severity = 2
counttype = number of events
relation = greater than
quantity = 0

[Conduct - Agent identity kill switch activated]
description = The deactivate_agent_identity action (the security kill switch) was called. Treat as an incident signal.
search = index=conduct sourcetype="conduct:guard:audit" tool_call="*deactivate_agent_identity" \
| dedup id \
| table _time workspace_id tool_call decision ai_tool user_email clerk_user_id session_id rule_message id
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0

[Conduct - Audit hash chain linkage broken in the feed]
description = A feed event's previous_hash does not equal the preceding event's entry_hash (per workspace, ordered by time then id): a deleted, reordered or altered row. Linkage only; run `conduct audit verify` on an export to recompute hashes.
search = index=conduct sourcetype="conduct:guard:audit" entry_hash=* \
| dedup id \
| where _time<relative_time(now(), "-20m") \
| sort 0 workspace_id _time id \
| streamstats current=f window=1 last(entry_hash) AS expected_previous_hash last(workspace_id) AS prev_workspace last(id) AS prev_id \
| where workspace_id==prev_workspace AND previous_hash!=expected_previous_hash \
| table _time workspace_id id previous_hash expected_previous_hash prev_id
cron_schedule = */30 * * * *
dispatch.earliest_time = -3h@m
dispatch.latest_time = now
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0
