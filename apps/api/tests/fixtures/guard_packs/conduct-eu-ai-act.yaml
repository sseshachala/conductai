# Conduct EU AI Act pack — per-rule E2E validation.
#
# EU Regulation 2024/1689 — rule → article mapping:
#   Art 5(1)(c) — prohibited social scoring
#   Art 5(1)(f) — prohibited emotion recognition in workplace/schools
#   Art 5(1)(g) — prohibited biometric categorisation
#   Art 5(1)(h) — prohibited real-time biometric ID in public
#   Art 6+9    — high-risk system oversight
#   Art 5(1)(a) — prohibited manipulative techniques
#   Art 50     — transparency (disclose AI-generated content)
#   Art 10     — data governance for training
#   Art 12     — automatic audit logs

pack: conduct-eu-ai-act
source: apps/api/app/modules/guard/skill_packs/conduct-eu-ai-act.json

cases:
  - rule_id: eu-ai-no-social-scoring
    scenario: social_score field blocked
    tool_name: write
    tool_input:
      file_path: scoring.py
      content: "social_score = compute(citizen.behaviour)"
    expected: block

  - rule_id: eu-ai-no-social-scoring
    scenario: rank citizens blocked
    tool_name: write
    tool_input:
      file_path: scoring.py
      content: "def rank_citizens(): pass"
    expected: block

  - rule_id: eu-ai-no-emotion-recognition
    scenario: emotion detect on employees blocked
    tool_name: write
    tool_input:
      file_path: hr.py
      content: "emotion_detect(employee_video_stream)"
    expected: block

  - rule_id: eu-ai-no-emotion-recognition
    scenario: emotion recognition in classroom blocked
    tool_name: write
    tool_input:
      file_path: edtech.py
      content: "emotion_recognition_on_classroom(camera_feed)"
    expected: block

  - rule_id: eu-ai-no-biometric-categorization
    scenario: biometric race categorisation blocked
    tool_name: write
    tool_input:
      file_path: bio.py
      content: "biometric.classify_by_race(faces)"
    expected: block

  - rule_id: eu-ai-no-biometric-categorization
    scenario: voice_print religion inference blocked
    tool_name: write
    tool_input:
      file_path: bio.py
      content: "voice_print.infer_religion(sample)"
    expected: block

  - rule_id: eu-ai-no-mass-surveillance
    scenario: realtime facial recognition on public street blocked
    tool_name: write
    tool_input:
      file_path: surveillance.py
      content: "realtime facial_recognition on public street cctv"
    expected: block

  - rule_id: eu-ai-human-oversight-required
    scenario: bypass human oversight on hiring blocked
    tool_name: write
    tool_input:
      file_path: hire.py
      content: "auto_approve = True  # skip review for hire decisions"
    expected: block

  - rule_id: eu-ai-transparency-disclosure
    scenario: falsely labelling AI content as human-written blocked
    tool_name: write
    tool_input:
      file_path: content.py
      content: "label = 'human-written'  # actually generated by AI"
    expected: block

  - rule_id: eu-ai-pii-training-block
    scenario: training data with ssn blocked
    tool_name: write
    tool_input:
      file_path: train.py
      content: "training_data.include(customer.ssn)"
    expected: block

  - rule_id: eu-ai-pii-training-block
    scenario: fine-tune on credit-card data blocked
    tool_name: write
    tool_input:
      file_path: train.py
      content: "fine_tune(dataset=records_with_credit_card_numbers)"
    expected: block

  - rule_id: eu-ai-gpai-high-risk-use
    scenario: gpt for medical diagnosis flagged
    tool_name: write
    tool_input:
      file_path: med.py
      content: "gpt.classify(patient.symptoms, task='medical_diagnosis')"
    expected: warn

  - rule_id: eu-ai-gpai-high-risk-use
    scenario: claude for legal decision flagged
    tool_name: write
    tool_input:
      file_path: legal.py
      content: "claude.judge(case_file, task='legal_decision')"
    expected: warn

  - rule_id: eu-ai-audit-log-required
    scenario: disabling audit_log blocked
    tool_name: write
    tool_input:
      file_path: cfg.py
      content: "audit_log = disabled"
    expected: block

  - rule_id: eu-ai-audit-log-required
    scenario: LOG_LEVEL null blocked
    tool_name: write
    tool_input:
      file_path: cfg.py
      content: "event_log = false"
    expected: block

  - rule_id: eu-ai-no-manipulation
    scenario: subliminal influence blocked
    tool_name: write
    tool_input:
      file_path: ads.py
      content: "subliminal.influence(target=vulnerable_user)"
    expected: block

  - rule_id: eu-ai-no-social-scoring
    scenario: benign scoring function is allowed
    tool_name: write
    tool_input:
      file_path: game.py
      content: "player_score = calculate(match_outcome)"
    expected: allow

  # ── negative canaries (#1272 batch 5 — see docs/guard-fp-strategy.md) ──
  # [E] prose docs describing the regulation without triggering the regex.
  - rule_id: eu-ai-no-emotion-recognition
    scenario: "[E] EU AI Act reference prose"
    tool_name: write
    tool_input:
      file_path: docs/eu-ai.md
      content: "The EU AI Act restricts emotion recognition systems in high-risk workplace contexts."
    expected: allow
  - rule_id: eu-ai-no-biometric-categorization
    scenario: "[E] Article 5 reference prose"
    tool_name: write
    tool_input:
      file_path: docs/eu-ai.md
      content: "Biometric categorization based on protected characteristics is prohibited under Article 5."
    expected: allow
  - rule_id: eu-ai-no-mass-surveillance
    scenario: "[E] law enforcement carve-out reference"
    tool_name: write
    tool_input:
      file_path: docs/eu-ai.md
      content: "Public-space biometric identification is heavily restricted by law enforcement carve-outs."
    expected: allow
  - rule_id: eu-ai-human-oversight-required
    scenario: "[E] Article 14 reference"
    tool_name: write
    tool_input:
      file_path: docs/eu-ai.md
      content: "High-risk AI systems require meaningful human oversight documented under Article 14."
    expected: allow
  - rule_id: eu-ai-transparency-disclosure
    scenario: "[E] disclosure requirement prose"
    tool_name: write
    tool_input:
      file_path: docs/eu-ai.md
      content: "Providers must disclose that content interacts with an AI system when interaction begins."
    expected: allow
  - rule_id: eu-ai-pii-training-block
    scenario: "[E] training-data minimisation prose"
    tool_name: write
    tool_input:
      file_path: docs/eu-ai.md
      content: "Training-data minimisation is required for personal data used in model development."
    expected: allow
  - rule_id: eu-ai-gpai-high-risk-use
    scenario: "[E] downstream deployer prose"
    tool_name: write
    tool_input:
      file_path: docs/eu-ai.md
      content: "General-purpose AI providers document intended-use restrictions for downstream deployers."
    expected: allow
  - rule_id: eu-ai-audit-log-required
    scenario: "[E] Annex IV reference"
    tool_name: write
    tool_input:
      file_path: docs/eu-ai.md
      content: "Logging requirements for high-risk systems are set out in Annex IV of the regulation."
    expected: allow
  - rule_id: eu-ai-no-manipulation
    scenario: "[E] deceptive-design prohibition prose"
    tool_name: write
    tool_input:
      file_path: docs/eu-ai.md
      content: "Deceptive design that materially distorts behaviour to their detriment is prohibited."
    expected: allow
