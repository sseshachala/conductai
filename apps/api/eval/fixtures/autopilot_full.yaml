      action: opened
      issue:
        number: 400
        title: "Add caching (already done)"
        body: "This was resolved in #289."
        state: closed
        user:
          login: dev
        labels:
          - name: wontfix
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
