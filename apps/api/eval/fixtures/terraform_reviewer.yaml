slug: terraform_reviewer
description: >
  Terraform Plan Reviewer scenarios. Covers PRs with .tf file changes including
  destructive changes, security group misconfigurations, and cost-impacting
  resources (positive) as well as non-terraform PRs, no-op plans, and
  closed events (negative).
scenarios:
  - id: ec2_instance_added
    label: PR adds new EC2 instance with Terraform
    tags: [positive]
    expected_outcome_type: terraform_reviewed
    trigger_payload:
      action: opened
      number: 501
      pull_request:
        number: 501
        title: "infra: add production EC2 instance"
        body: "Adds a t3.large EC2 instance for the production API server."
        html_url: "https://github.com/eval-org/infra/pull/501"
        head: {ref: infra/prod-ec2, sha: "terraform001"}
        base: {ref: main}
        user: {login: devops-eng}
        draft: false
      repository:
        full_name: eval-org/infra
        name: infra
        clone_url: "https://github.com/eval-org/infra.git"
    extra_assertions:
      should_post_review: true

  - id: security_group_open_to_world
    label: Security group opens port 22 to 0.0.0.0/0
    tags: [positive, security]
    expected_outcome_type: terraform_reviewed
