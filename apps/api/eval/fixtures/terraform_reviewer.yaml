      action: opened
      number: 502
      pull_request:
        number: 502
        title: "infra: add SSH access to bastion"
        body: "Opens SSH access for debugging. cidr_blocks = [\"0.0.0.0/0\"]"
        html_url: "https://github.com/eval-org/infra/pull/502"
        head: {ref: infra/bastion-ssh, sha: "terraform002"}
        base: {ref: main}
        user: {login: junior-devops}
        draft: false
      repository:
        full_name: eval-org/infra
        name: infra
        clone_url: "https://github.com/eval-org/infra.git"
    extra_assertions:
      should_post_review: true
      expect_critical_findings: true

