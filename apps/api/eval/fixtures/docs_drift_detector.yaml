slug: docs_drift_detector
description: >
  Docs Drift Detector scenarios. Covers pushes that change implementation without
  updating corresponding docs (positive) as well as doc-only changes, non-main pushes,
  and already-filed issues (negative).
scenarios:
  - id: api_endpoint_added_no_docs
    label: New API endpoint added — no docs update in push
    tags: [positive]
    expected_outcome_type: docs_updated
    trigger_payload:
      ref: "refs/heads/main"
      after: "api001abc123"
      commits:
        - id: "api001"
          message: "feat: add GET /api/reports/summary endpoint"
          modified: ["apps/api/app/routers/reports.py", "apps/api/app/schemas/reports.py"]
          added: []
          author: {name: "Alice", email: "alice@example.com"}
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      should_file_issue: true

