        resolved_at: "2026-05-17T14:20:00Z"
        duration_minutes: 20
        affected_services: ["api"]
        impact: "All API endpoints returned 500 for 20 minutes after v2.5.0 deploy."
        root_cause: "Pydantic v2 migration broke schema validation — not caught in staging"
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
    extra_assertions:
      should_file_issue: true

  - id: scheduled_job_drift
    label: Cron job silently stopped running — undetected for 72 hours
    tags: [positive]
    expected_outcome_type: postmortem_drafted
    trigger_payload:
      action: resolved
      incident:
        id: "INC-2014"
