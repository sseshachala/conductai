        severity: P3
        is_maintenance: true
        started_at: "2026-05-29T02:00:00Z"
        resolved_at: "2026-05-29T03:30:00Z"
        duration_minutes: 90
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main

  - id: pr_event_wrong_trigger
    label: "(negative) PR merged event — not an incident resolution trigger"
    tags: [negative]
    expected_outcome_type: null
    trigger_payload:
      action: closed
      pull_request:
        number: 299
        title: "fix: resolve the latency issue"
        merged: true
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
