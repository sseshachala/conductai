        severity: P2
        started_at: "2026-05-14T09:00:00Z"
        resolved_at: "2026-05-17T09:00:00Z"
        duration_minutes: 4320
        affected_services: ["worker", "cron"]
        impact: "72 hours of scheduled scans skipped for all workspaces. 3 critical CVEs missed."
        root_cause: "Cron service crashed; no alerting on missed job executions"
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
    extra_assertions:
      should_file_issue: true

  - id: storage_quota_exceeded
    label: Object storage quota exceeded — artifact uploads failed silently
    tags: [positive]
    expected_outcome_type: postmortem_drafted
    trigger_payload:
      action: resolved
      incident:
        id: "INC-2015"
        title: "S3 bucket quota exceeded — run artifacts not saved for 6 hours"
        severity: P2
        started_at: "2026-05-16T06:00:00Z"
        resolved_at: "2026-05-16T12:30:00Z"
        duration_minutes: 390
        affected_services: ["api", "worker"]
        impact: "Run artifacts (logs, diffs) not persisted for 6 hours. Data permanently lost."
        root_cause: "No storage quota monitoring; 90-day log retention not enforced"
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
    extra_assertions:
      should_file_issue: true

