slug: pr_reviewer
description: >
  PR Reviewer scenarios. Covers code quality issues, security vulnerabilities,
  performance problems, missing tests, and well-written PRs (positive) as well
  as draft PRs, closed PRs, bot PRs, and non-PR events (negative).
scenarios:
  - id: clean_pr
    label: Clean PR — minor style suggestions expected
    tags: [positive]
    expected_outcome_type: review_completed
    trigger_payload:
      action: opened
      number: 42
      pull_request:
        number: 42
        title: "feat: add user authentication"
        body: "Adds JWT-based user authentication with bcrypt password hashing."
        html_url: "https://github.com/eval-org/eval-repo/pull/42"
        head:
          ref: feat/user-auth
          sha: "a1b2c3d4e5f6"
        base:
          ref: main
        user:
          login: dev-user
        diff_url: "https://github.com/eval-org/eval-repo/pull/42.diff"
        draft: false
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        owner:
          login: eval-org
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      should_post_review: true

  - id: hardcoded_secret_pr
    label: PR with hardcoded API key — expect critical finding
    tags: [positive, security]
    expected_outcome_type: review_completed
    trigger_payload:
