slug: copilot_reviewer
description: >
  Copilot AI PR Reviewer scenarios. Covers code correctness issues, performance
  anti-patterns, missing error handling, and security flaws (positive) as well
  as draft PRs, closed events, docs-only changes, and bot PRs (negative).
scenarios:
  - id: missing_error_handling
    label: PR missing error handling in async function
    tags: [positive]
    expected_outcome_type: review_completed
    trigger_payload:
      action: opened
      number: 301
      pull_request:
        number: 301
        title: "feat: add async file upload handler"
        body: "Adds a new async file upload handler. Uses aiofiles for non-blocking I/O."
        html_url: "https://github.com/eval-org/eval-repo/pull/301"
        head: {ref: feat/async-upload, sha: "aaa111bbb222"}
        base: {ref: main}
        user: {login: junior-dev}
        draft: false
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      should_post_review: true

