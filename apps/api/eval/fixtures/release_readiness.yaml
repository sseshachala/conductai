slug: release_readiness
description: >
  Release Readiness Reviewer scenarios. Covers PRs and release branches ready for
  shipping that need a readiness gate check (positive) as well as failing tests,
  missing migrations, incomplete changelogs, and wrong event types (negative).
scenarios:
  - id: clean_pr_ready_to_merge
    label: Clean PR with passing CI — ready to merge
    tags: [positive]
    expected_outcome_type: release_reviewed
    trigger_payload:
      action: review_requested
      number: 701
      pull_request:
        number: 701
        title: "feat: add rate limiting to API endpoints"
        body: |
          Implements per-IP and per-user rate limiting.

          ## Checklist
          - [x] Tests added and passing
          - [x] Migration included
          - [x] CHANGELOG updated
          - [x] Reviewed by 1 engineer
        html_url: "https://github.com/eval-org/eval-repo/pull/701"
        head:
          ref: feat/rate-limiting
          sha: "ready001abc"
        base:
          ref: main
        user:
          login: dev
        draft: false
        state: open
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      should_approve: true

