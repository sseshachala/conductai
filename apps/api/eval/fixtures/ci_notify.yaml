slug: ci_notify
description: >
  CI Failure Alert scenarios. Covers test failures, build errors, lint failures,
  deploy failures, and timeout events (positive) as well as successful runs,
  cancelled jobs, draft PRs, and non-main branch failures (negative).
scenarios:
  - id: test_suite_failure
    label: Unit test suite failure on main
    tags: [positive]
    expected_outcome_type: ci_alert_sent
    trigger_payload:
      action: completed
      workflow_run:
        id: 9001
        name: "CI / Test Suite"
        conclusion: failure
        status: completed
        head_branch: main
        head_sha: "abc123def456"
        html_url: "https://github.com/eval-org/eval-repo/actions/runs/9001"
        repository:
          full_name: eval-org/eval-repo
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
    extra_assertions:
      should_send_alert: true

