slug: security_patch_updater
description: >
  Security Patch Updater scenarios. Covers high/critical CVEs with available fixes,
  vulnerability alerts across languages, and dependency audit failures (positive) as
  well as low-severity advisories, already-patched packages, archived repos, and
  wrong event types (negative).
scenarios:
  - id: critical_cve_python
    label: Critical CVE in cryptography package — immediate patch needed
    tags: [positive, critical]
    expected_outcome_type: security_patch_applied
    trigger_payload:
      action: created
      alert:
        id: 3001
        affected_package_name: cryptography
        affected_range: "< 41.0.7"
        fixed_in: "41.0.7"
        severity: critical
        cvss_score: 9.1
        summary: "NULL pointer dereference in PKCS#12 key parsing"
        ghsa_id: "GHSA-jm77-qphf-c4w8"
        cve_id: "CVE-2023-49083"
      repository:
        full_name: eval-org/python-api
        name: python-api
        default_branch: main
        clone_url: "https://github.com/eval-org/python-api.git"
    extra_assertions:
      should_open_pr: true

  - id: high_cve_lodash
    label: High severity CVE in lodash — prototype pollution
    tags: [positive]
    expected_outcome_type: security_patch_applied
    trigger_payload:
      action: created
      alert:
        id: 3002
        affected_package_name: lodash
        affected_range: "< 4.17.21"
        fixed_in: "4.17.21"
        severity: high
        cvss_score: 7.4
        summary: "Prototype Pollution in lodash"
        ghsa_id: "GHSA-jf85-cpcp-j695"
        cve_id: "CVE-2021-23337"
      repository:
        full_name: eval-org/node-app
        name: node-app
        default_branch: main
        clone_url: "https://github.com/eval-org/node-app.git"
    extra_assertions:
      should_open_pr: true

  - id: critical_cve_openssl
