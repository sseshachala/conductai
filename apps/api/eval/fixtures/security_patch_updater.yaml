      action: created
      alert:
        id: 3010
        affected_package_name: "python"
        affected_range: "3.11 < 3.11.7"
        fixed_in: "3.11.7"
        severity: critical
        cvss_score: 9.8
        summary: "Python base image contains critical CVE in bundled OpenSSL"
        ghsa_id: "GHSA-base-image-cve"
        source: "container_scan"
      repository:
        full_name: eval-org/python-api
        name: python-api
        default_branch: main
        clone_url: "https://github.com/eval-org/python-api.git"
