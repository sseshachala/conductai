        full_name: eval-org/go-service
        name: go-service
        default_branch: main
        clone_url: "https://github.com/eval-org/go-service.git"
    extra_assertions:
      should_open_pr: true

  # ── Negative scenarios ────────────────────────────────────────────────────────

  - id: low_severity_advisory
    label: "(negative) Low severity advisory — no action required"
    tags: [negative]
    expected_outcome_type: null
    trigger_payload:
      action: created
      alert:
        id: 4001
        affected_package_name: some-util
        affected_range: "< 1.0.1"
        fixed_in: "1.0.1"
        severity: low
        cvss_score: 2.3
        summary: "Minor timing side-channel with no known exploit path"
        ghsa_id: "GHSA-low-sev-low"
      repository:
        full_name: eval-org/node-app
        name: node-app
        default_branch: main
        clone_url: "https://github.com/eval-org/node-app.git"

  - id: package_already_patched
    label: "(negative) Package already at patched version — no PR needed"
    tags: [negative]
    expected_outcome_type: null
    trigger_payload:
      action: created
      alert:
        id: 4002
        affected_package_name: requests
        affected_range: "< 2.31.0"
        fixed_in: "2.31.0"
        severity: high
        current_installed_version: "2.31.0"
        already_fixed: true
      repository:
        full_name: eval-org/python-api
        name: python-api
        default_branch: main
        clone_url: "https://github.com/eval-org/python-api.git"

  - id: archived_repository
    label: "(negative) Archived repository — no patches applied"
    tags: [negative]
    expected_outcome_type: null
    trigger_payload:
      action: created
      alert:
        id: 4003
        affected_package_name: lodash
        affected_range: "< 4.17.21"
        fixed_in: "4.17.21"
        severity: high
      repository:
        full_name: eval-org/legacy-archived-app
        name: legacy-archived-app
        archived: true
        default_branch: main
        clone_url: "https://github.com/eval-org/legacy-archived-app.git"

  - id: pr_already_open
    label: "(negative) Security patch PR already open — no duplicate"
    tags: [negative]
    expected_outcome_type: null
    trigger_payload:
      action: created
      alert:
        id: 4004
        affected_package_name: cryptography
        affected_range: "< 41.0.7"
        fixed_in: "41.0.7"
        severity: critical
      existing_prs:
        - title: "fix: bump cryptography to 41.0.7 (CVE-2023-49083)"
          state: open
      repository:
        full_name: eval-org/python-api
        name: python-api
        default_branch: main
        clone_url: "https://github.com/eval-org/python-api.git"

  - id: issue_event_wrong_trigger
    label: "(negative) Issue opened event — not a vulnerability alert"
    tags: [negative]
    expected_outcome_type: null
    trigger_payload:
      action: opened
      issue:
        number: 999
        title: "We should update our dependencies"
        body: "Probably some CVEs lurking in our packages."
        state: open
        labels: []
      repository:
        full_name: eval-org/node-app
        name: node-app
        default_branch: main
        clone_url: "https://github.com/eval-org/node-app.git"

  - id: informational_only_alert
    label: "(negative) Informational severity alert — observe, no patch"
    tags: [negative]
    expected_outcome_type: null
    trigger_payload:
      action: created
      alert:
        id: 4005
        affected_package_name: moment
        affected_range: "< 2.29.4"
        fixed_in: "2.29.4"
        severity: informational
        cvss_score: 0.0
        summary: "Path traversal in moment.js locale loading — no known exploit"
        ghsa_id: "GHSA-info-only"
      repository:
        full_name: eval-org/node-app
        name: node-app
        default_branch: main
        clone_url: "https://github.com/eval-org/node-app.git"

  - id: no_fix_available
    label: "(negative) CVE with no fix available yet — cannot patch"
    tags: [negative]
    expected_outcome_type: null
    trigger_payload:
      action: created
      alert:
        id: 4006
        affected_package_name: some-zero-day-package
        affected_range: ">= 0.0.1"
        fixed_in: null
        severity: critical
        summary: "Zero-day with no upstream fix available"
        ghsa_id: "GHSA-no-fix-yet"
      repository:
        full_name: eval-org/python-api
        name: python-api
        default_branch: main
        clone_url: "https://github.com/eval-org/python-api.git"
