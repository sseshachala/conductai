        name: node-app
        default_branch: main
        clone_url: "https://github.com/eval-org/node-app.git"
    extra_assertions:
      should_open_pr: true

  - id: go_module_cve_indirect
    label: Indirect Go module has high CVE — go.sum needs update
    tags: [positive]
    expected_outcome_type: security_patch_applied
    trigger_payload:
      action: created
      alert:
        id: 3012
        affected_package_name: "github.com/gorilla/websocket"
