        id: 3003
        affected_package_name: openssl
        affected_range: "< 3.1.2"
        fixed_in: "3.1.2"
        severity: critical
        cvss_score: 9.8
        summary: "OpenSSL buffer overflow in X.509 GeneralName processing"
        ghsa_id: "GHSA-xxxx-yyyy-zzzz"
        cve_id: "CVE-2023-0286"
      repository:
        full_name: eval-org/python-api
        name: python-api
        default_branch: main
        clone_url: "https://github.com/eval-org/python-api.git"
    extra_assertions:
      should_open_pr: true

  - id: high_cve_requests
