        cvss_score: 7.5
        summary: "Requests vulnerable to unintended proxy credential exposure"
        ghsa_id: "GHSA-652x-xj99-gmcc"
        cve_id: "CVE-2023-32681"
      repository:
        full_name: eval-org/python-api
