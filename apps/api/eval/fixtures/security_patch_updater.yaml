  - id: multiple_vulnerabilities_batch
    label: npm audit reports 4 high/critical vulnerabilities — batch patch
    tags: [positive]
    expected_outcome_type: security_patch_applied
    trigger_payload:
      action: completed
      workflow_run:
        id: 12001
        name: "CI / Dependency Audit"
        conclusion: failure
        head_branch: main
      audit_results:
        critical:
          - package: "semver"
            range: "< 6.3.1"
            fixed_in: "6.3.1"
            ghsa_id: "GHSA-c2qf-rxjj-qqgw"
          - package: "word-wrap"
            range: "< 1.2.4"
            fixed_in: "1.2.4"
            ghsa_id: "GHSA-j8xg-fqg3-53r7"
        high:
          - package: "tough-cookie"
            range: "< 4.1.3"
            fixed_in: "4.1.3"
            ghsa_id: "GHSA-72xf-g2v4-qvf3"
          - package: "xml2js"
            range: "< 0.5.0"
            fixed_in: "0.5.0"
            ghsa_id: "GHSA-776f-qx25-q3cc"
      repository:
        full_name: eval-org/node-app
        name: node-app
        default_branch: main
        clone_url: "https://github.com/eval-org/node-app.git"
    extra_assertions:
      should_open_pr: true

  - id: scheduled_security_scan_finds_cves
    label: Scheduled weekly security scan finds 3 high CVEs
    tags: [positive]
    expected_outcome_type: security_patch_applied
    trigger_payload:
      action: schedule
      ref: "refs/heads/main"
      repository:
        full_name: eval-org/python-api
        name: python-api
        default_branch: main
        clone_url: "https://github.com/eval-org/python-api.git"
      schedule: "0 9 * * 1"
      scan_results:
        high:
          - package: "pillow"
            range: "< 10.0.1"
            fixed_in: "10.0.1"
            ghsa_id: "GHSA-56pw-mpj4-fxww"
          - package: "werkzeug"
            range: "< 3.0.1"
            fixed_in: "3.0.1"
            ghsa_id: "GHSA-hrfv-mqp8-q5rw"
          - package: "pyjwt"
            range: "< 2.8.0"
            fixed_in: "2.8.0"
            ghsa_id: "GHSA-75c5-xw7c-p5pm"
    extra_assertions:
      should_open_pr: true

  - id: transitive_dependency_vuln
    label: Transitive dep has critical CVE — direct dep update needed
    tags: [positive, critical]
    expected_outcome_type: security_patch_applied
    trigger_payload:
      action: created
      alert:
        id: 3009
        affected_package_name: "vm2"
        affected_range: "< 3.9.19"
        fixed_in: "3.9.19"
        severity: critical
        cvss_score: 10.0
        summary: "Sandbox escape in vm2 — remote code execution"
        ghsa_id: "GHSA-cchq-frgv-rjh5"
        cve_id: "CVE-2023-37466"
        is_transitive: true
        transitive_path: ["jest", "jest-runtime", "vm2"]
      repository:
        full_name: eval-org/node-app
        name: node-app
        default_branch: main
        clone_url: "https://github.com/eval-org/node-app.git"
    extra_assertions:
      should_open_pr: true

  - id: push_updates_requirements_txt
    label: Push modifies requirements.txt — trigger security rescan
    tags: [positive]
    expected_outcome_type: security_patch_applied
    trigger_payload:
      ref: "refs/heads/main"
      after: "pushsec001abc"
      commits:
        - id: "pushsec001"
          message: "chore: add boto3 for S3 integration"
          modified: ["requirements.txt"]
          added: []
          author: {name: "Dev", email: "dev@example.com"}
      scan_results:
        high:
          - package: "boto3"
            range: "< 1.28.85"
            fixed_in: "1.28.85"
            ghsa_id: "GHSA-xxxxs3-high"
      repository:
        full_name: eval-org/python-api
        name: python-api
        default_branch: main
        clone_url: "https://github.com/eval-org/python-api.git"
    extra_assertions:
      should_open_pr: true

  - id: container_base_image_vuln
