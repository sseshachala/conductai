    tags: [negative]
    expected_outcome_type: null
    trigger_payload:
      ref: "refs/heads/feat/new-feature"
      before: "aaa000"
      after: "bbb111"
      commits:
        - {id: "x001", message: "feat: work in progress", author: {name: "Alice"}}
