        - {id: "c002", message: "feat: add export to CSV", author: {name: "Bob"}}
        - {id: "c003", message: "fix: fix date parsing bug", author: {name: "Carol"}}
        - {id: "c004", message: "fix: resolve memory leak in worker", author: {name: "Dave"}}
        - {id: "c005", message: "perf: add Redis caching for search", author: {name: "Alice"}}
        - {id: "c006", message: "docs: update API docs", author: {name: "Eve"}}
        - {id: "c007", message: "chore: upgrade dependencies", author: {name: "Bot"}}
        - {id: "c008", message: "test: add coverage for auth", author: {name: "Frank"}}
        - {id: "c009", message: "feat: add two-factor authentication", author: {name: "Grace"}}
        - {id: "c010", message: "fix: correct CORS headers", author: {name: "Henry"}}
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      should_draft_notes: true

