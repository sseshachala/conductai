slug: release_notes
description: >
  Release Notes Drafter scenarios. Covers release creation, tag pushes, and
  merge-to-main events (positive) as well as draft releases, empty commits,
  non-release branches, and delete events (negative).
scenarios:
  - id: release_created
    label: GitHub release created — draft release notes
    tags: [positive]
    expected_outcome_type: release_notes_drafted
    trigger_payload:
      action: created
      release:
        id: 5001
        tag_name: "v2.1.0"
        name: "v2.1.0"
        body: ""
        draft: false
        prerelease: false
        html_url: "https://github.com/eval-org/eval-repo/releases/tag/v2.1.0"
        target_commitish: main
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      should_draft_notes: true

  - id: tag_push_semver
    label: Semver tag pushed — generate release notes from commits
    tags: [positive]
    expected_outcome_type: release_notes_drafted
    trigger_payload:
      ref: "refs/tags/v1.5.2"
      before: "0000000000000000000000000000000000000000"
      after: "abc123def456789"
      commits:
        - id: "abc123"
          message: "feat: add OAuth2 login"
          author: {name: "Alice", email: "alice@example.com"}
        - id: "def456"
          message: "fix: correct token expiry calculation"
          author: {name: "Bob", email: "bob@example.com"}
        - id: "ghi789"
          message: "docs: update API reference"
          author: {name: "Carol", email: "carol@example.com"}
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      should_draft_notes: true

  - id: major_release
