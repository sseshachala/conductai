    expected_outcome_type: null
    trigger_payload:
      action: deleted
      release:
        id: 6001
        tag_name: "v2.0.0-bad"
        name: "v2.0.0-bad"
        body: "Accidentally published."
        draft: false
        prerelease: false
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
        clone_url: "https://github.com/eval-org/eval-repo.git"

  - id: push_to_feature_branch
