slug: security_scanner
description: >
  Security Scanner scenarios. Covers PRs with hardcoded secrets, SQL injection,
  insecure dependencies, authentication bypass patterns, command injection, XSS,
  and IDOR vulnerabilities (positive) as well as clean PRs, closed events, docs-only
  changes, and draft PRs (negative).
scenarios:
  - id: hardcoded_api_key
    label: PR with hardcoded Stripe API key in source
    tags: [positive, secrets]
    expected_outcome_type: security_findings_reported
    trigger_payload:
      action: opened
      number: 101
      pull_request:
        number: 101
        title: "feat: add Stripe billing"
        body: "Integrates Stripe for subscription billing."
        html_url: "https://github.com/eval-org/eval-repo/pull/101"
        head:
          ref: feat/stripe-billing
          sha: "aa1bb2cc3dd4"
        base:
          ref: main
        user:
          login: fullstack-dev
        diff_url: "https://github.com/eval-org/eval-repo/pull/101.diff"
        draft: false
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        owner:
          login: eval-org
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      expect_critical_count_gte: 1
      expect_secret_finding: true

