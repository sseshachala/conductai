slug: flaky_test_detective
description: >
  Flaky Test Detective scenarios. Covers repeated CI failures on the same test,
  intermittent failures on different runs, timeout patterns, and infrastructure
  flakiness (positive) as well as stable failures, cancelled runs, feature branches,
  and skipped tests (negative).
scenarios:
  - id: same_test_fails_three_times
    label: Same test failed 3 times this week — clear flaky pattern
    tags: [positive]
    expected_outcome_type: flaky_test_filed
    trigger_payload:
      action: completed
      workflow_run:
        id: 11001
        name: "CI / Test Suite"
        conclusion: failure
        status: completed
        head_branch: main
        head_sha: "flaky001abc"
        html_url: "https://github.com/eval-org/eval-repo/actions/runs/11001"
        repository:
          full_name: eval-org/eval-repo
      failed_tests:
        - name: "test_webhook_delivery_concurrent"
          file: "tests/test_webhooks.py"
          failure_count_last_7_days: 3
          failure_messages:
            - "AssertionError: expected 3 deliveries, got 2"
            - "AssertionError: expected 3 deliveries, got 2"
            - "AssertionError: expected 3 deliveries, got 1"
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
    extra_assertions:
      should_file_issue: true

