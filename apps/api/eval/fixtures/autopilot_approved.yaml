  - id: gdpr_data_deletion
    label: GDPR right-to-erasure — data deletion pipeline
    tags: [positive]
    expected_outcome_type: pr_opened
    trigger_payload:
      action: opened
      issue:
        number: 504
        title: "Implement GDPR data deletion (right to erasure)"
        body: |
          Legal requirement: users must be able to request deletion of all their data.

          - DELETE /api/account endpoint (soft-delete user)
          - Background job to hard-delete after 30-day grace period
          - Cascade delete: runs, artifacts, webhook logs, API keys
          - Email confirmation to user
          - Audit log entry that deletion was completed
          - DPA-compliant deletion certificate generation
        html_url: "https://github.com/eval-org/eval-repo/issues/504"
        state: open
        user:
          login: legal-counsel
        labels:
          - name: compliance
