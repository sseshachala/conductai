slug: autopilot_approved
description: >
  Autopilot + Approval scenarios. Issues trigger implementation but require a Slack
  approval before a PR is opened (positive) as well as rejected approvals, timed-out
  approvals, closed/wontfix issues, and wrong event types (negative).
scenarios:
  - id: add_sso_saml
    label: SSO/SAML integration — high-stakes, approval required before PR
    tags: [positive]
    expected_outcome_type: pr_opened
    trigger_payload:
      action: opened
      issue:
        number: 501
        title: "Add SAML SSO integration for enterprise customers"
        body: |
          Enterprise customers need SAML SSO for their identity providers (Okta, Azure AD).

          Requirements:
          - python3-saml library integration
          - SP-initiated SSO flow
          - IdP metadata upload endpoint
          - Just-in-time user provisioning on first SSO login
          - Workspace-level SAML configuration storage
        html_url: "https://github.com/eval-org/eval-repo/issues/501"
        state: open
        user:
          login: enterprise-sales
        labels:
          - name: enterprise
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      should_open_pr: true
      requires_approval: true

  - id: database_schema_overhaul
    label: Major schema overhaul — approval gate before implementation
    tags: [positive]
    expected_outcome_type: pr_opened
    trigger_payload:
      action: opened
      issue:
        number: 502
        title: "Normalize the runs table — split into runs + run_steps + run_artifacts"
        body: |
          The runs table has grown unwieldy with 40+ columns.

          Proposal:
          - runs: core metadata (id, workspace_id, playbook_slug, status, created_at)
          - run_steps: one row per brain block execution
          - run_artifacts: PR URLs, issue URLs, file paths from outputs
          - Migrate all existing data
          - Update all queries and API responses
        html_url: "https://github.com/eval-org/eval-repo/issues/502"
        state: open
        user:
          login: db-architect
        labels:
          - name: breaking-change
      repository:
        full_name: eval-org/eval-repo
        name: eval-repo
        default_branch: main
        clone_url: "https://github.com/eval-org/eval-repo.git"
    extra_assertions:
      should_open_pr: true
      requires_approval: true

