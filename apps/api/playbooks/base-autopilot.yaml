kind: base
name: base-autopilot
description: >
  Shared snippets and block templates for all autopilot-family playbooks.
  Resolved at compile time — the runtime never sees this file.

snippets:
  detect_mode: |
    ── DETECT EXECUTION MODE AND REPO TYPE (run this FIRST) ─────────────────
    if [ -d /workspace/.git ]; then echo "MODE=sandbox"; else echo "MODE=proxy"; fi
    MODE=sandbox → persistent /workspace, use multiple tool calls freely.
    MODE=proxy   → FRESH container per run_shell call — pack ALL git+fix+push into ONE call.

    ── DETECT REPO TYPE ─────────────────────────────────────────────────────
    if [ "{{fork_upstream.fork_full_name}}" = "{{inputs.upstream_owner}}/{{inputs.upstream_repo}}" ]; then
      echo "REPO_TYPE=same"   # authenticated user owns the upstream — push directly, no fork
    else
      echo "REPO_TYPE=fork"   # fork exists — use fork URL, head_ref = owner:branch
    fi
    REPO_TYPE=same → clone/push to upstream directly, head_ref = branch name only
    REPO_TYPE=fork → clone/push to fork, head_ref = fork_owner:branch

  lint: |
    ── AUTO-DETECT AND RUN REPO LINTER (before every commit) ───────────────
    if [ -f .pre-commit-config.yaml ]; then
      pre-commit run --all-files 2>/dev/null; pre-commit run --all-files 2>/dev/null || true
    elif [ -f pyproject.toml ] || [ -f ruff.toml ] || [ -f setup.py ]; then
      ruff check --fix . 2>/dev/null || true && ruff format . 2>/dev/null || true
    elif command -v black &>/dev/null; then
      black . 2>/dev/null || true
    elif [ -f package.json ]; then
      (npx eslint --fix . 2>/dev/null || true) && (npx prettier --write . 2>/dev/null || true)
    elif [ -f Cargo.toml ]; then
      cargo fmt 2>/dev/null || true && cargo clippy --fix --allow-dirty 2>/dev/null || true
    elif [ -f go.mod ]; then
      gofmt -w . 2>/dev/null || true
    elif [ -f Gemfile ]; then
      bundle exec rubocop -a 2>/dev/null || true
    fi

  pr_attribution: |
    ---
    This fix was implemented autonomously by **[Conduct AI](https://conductai.ai)** — an open-source platform that turns AI agents into reusable team automations via YAML playbooks.
    - 🔗 Platform: [conductai.ai](https://conductai.ai)
    - 📦 Source: [github.com/sseshachala/conductai](https://github.com/sseshachala/conductai)
    > Want Conduct AI to automate fixes in your repo too? [Get started free →](https://conductai.ai)

blocks:
  recall_context:
    type: memory
    label: Recall prior context
    action: read
    scope: repo
    limit: 5

  record_outcome:
    type: memory
    label: Record outcome
    action: write
    scope: repo

  route_by_complexity:
    type: logic
    label: Route by complexity
    condition: "{{plan_fix.complexity}} != 'small'"

  provision_sandbox:
    type: sandbox
    label: Provision sandbox
    description: "Clone the fork into /workspace so implement_fix runs in a persistent sandbox"
    config:
      provider: "{{inputs.sandbox_provider}}"
      setup:
        - "git config --global user.email 'bot@conductai.ai' && git config --global user.name 'Conduct AI'"
        - "git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /workspace"
        - "cd /workspace && git remote add upstream https://github.com/{{inputs.upstream_owner}}/{{inputs.upstream_repo}}.git && git fetch upstream --depth=50"
        - "cd /workspace && git checkout -b fix/issue-{{inputs.issue_number}} && git reset --hard upstream/{{fork_upstream.default_branch}}"

  plan_fix:
    type: brain
    mode: single
    label: Plan fix
    description: |
      You are a senior engineer planning a targeted code fix for an open-source issue.

      Repository: {{inputs.upstream_owner}}/{{inputs.upstream_repo}}
      Issue #{{inputs.issue_number}}: {{fetch_issue.title}}

      Issue body:
      {{fetch_issue.body}}

      Prior context from this repo:
      {{read_memory.entries}}

      Extract from the issue body:
      1. File paths mentioned (any .py / .go / .js / .ts / .java / .rb etc.)
      2. Function or class names mentioned
      3. Error messages or tracebacks — these always point to a file + line
      4. The subsystem described (e.g. "SSO login", "token refresh", "auth middleware")

      Classify complexity:
        small  — 1 file, ≤5 line change
        medium — 2–5 files, logic change
        large  — 5+ files, architectural change

      Your response must be ONLY a single line of compact JSON — no prose before or after, no markdown, no newlines inside the JSON:
      {"files":["relative/path/to/file.py"],"functions":["FunctionOrClassName"],"subsystem":"short description","approach":"one sentence: what to change and how","complexity":"small|medium|large","grep_pattern":"exact string to grep for when no file path is known"}
