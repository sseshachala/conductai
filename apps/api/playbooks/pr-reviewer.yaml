name: PR Reviewer
version: 1
description: >
  Triggered when a pull request is opened — by Autopilot or a human.
  Reviews the diff for bugs, security issues, and style, then posts a review comment on the PR.

  Setup: GitHub repo → Settings → Webhooks → Add webhook.
  Payload URL: https://<your-api>/webhooks/inbound/<this-workflow-id>
  Content type: application/json
  Event: Pull requests (pull_request.opened)

on:
  webhook:
    next: review_pr

blocks:
  review_pr:
    type: brain
    mode: agentic
    label: Review PR
    description: |
      You are an expert code reviewer. A GitHub pull request has been opened.

      PR details from webhook payload:
      - PR number: {{_trigger.number}}
      - Title: {{_trigger.pull_request.title}}
      - Author: {{_trigger.pull_request.user.login}}
      - Repo: {{_trigger.repository.full_name}}
      - Diff URL: {{_trigger.pull_request.diff_url}}
      - PR URL: {{_trigger.pull_request.html_url}}
      - Base branch: {{_trigger.pull_request.base.ref}}
      - Head branch: {{_trigger.pull_request.head.ref}}

      Steps:
      1. Fetch the diff:
         GET {{_trigger.pull_request.diff_url}}
         Use Authorization: token <github_token> header
      2. Review the diff for:
         - Bugs or logic errors
         - Security issues (hardcoded secrets, SQL injection, XSS, etc.)
         - Missing error handling
         - Style and naming inconsistencies
      3. Post a review comment via GitHub API:
         POST https://api.github.com/repos/{{_trigger.repository.full_name}}/pulls/{{_trigger.number}}/reviews
         {
           "body": "<your review summary>",
           "event": "COMMENT",
           "comments": []
         }
         Use Authorization: token <github_token> header

      Be concise. Group findings by severity (critical / warning / suggestion).
      If the PR looks clean, say so clearly.

      Output ONLY the following JSON on the last line:
        {"review_url": "<PR URL>", "findings": <number of issues found>, "critical": <number of critical issues>}
    next: has_critical

  has_critical:
    type: logic
    label: Critical issues found?
    condition: "{{review_pr.critical}} > 0"
    next:
      pass: create_fix_issue
      fail: notify_review

  create_fix_issue:
    type: brain
    mode: agentic
    label: Create fix issue
    description: |
      A PR review found critical issues that need to be fixed by an automated agent.

      PR: {{review_pr.review_url}}
      Repo: {{_trigger.repository.full_name}}
      Critical issues: {{review_pr.critical}}

      Steps:
      1. Create a GitHub issue via the API:
         POST https://api.github.com/repos/{{_trigger.repository.full_name}}/issues
         Headers: Authorization: token <github_token>, Content-Type: application/json
         Body:
         {
           "title": "fix: address critical review findings on PR #{{_trigger.number}}",
           "body": "## Context\nPR #{{_trigger.number}} was reviewed and {{review_pr.critical}} critical issue(s) were found.\n\nReview: {{review_pr.review_url}}\n\n## Task\nRead the review comment on the PR, identify all 🔴 Critical findings, and implement fixes.\n\nFiles changed in the PR are the ones to focus on.",
           "labels": ["autopilot ready"]
         }
         (retrieve the GitHub token from the Delegator credentials vault)

      Output ONLY the following JSON on the last line:
        {"issue_url": "<created issue URL>", "issue_number": <number>}
    next: notify_review

  notify_review:
    type: output
    label: Notify review posted
    description: "PR #{{_trigger.number}} reviewed: {{review_pr.findings}} findings ({{review_pr.critical}} critical). See {{review_pr.review_url}}"
    output:
      via: slack
      slack:
        channel: "#engineering"
