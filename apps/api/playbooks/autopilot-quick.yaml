name: Autopilot Quick — GitHub Issues
version: 1
description: >
  Watch for GitHub issues labeled `autopilot ready`, implement the fix, open a
  PR immediately. No test step — CI runs tests on the PR instead.

inputs:
  trigger_label:
    label: Trigger label
    default: autopilot ready
    type: select
    options:
      - autopilot ready
      - ai_pilot_ready
      - ai_ready
  model:
    label: AI Model
    default: claude-haiku-4-5-20251001
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7
  clone_depth:
    label: Clone depth
    default: "1"
    type: select
    options:
      - "1"
      - "0"
    hint: "1 = fast (recommended), 0 = full history"

on:
  github.issue_labeled:
    integration: github
    labels:
      - "{{inputs.trigger_label}}"
    label_mode: one_of
    next: recall_context

blocks:
  recall_context:
    type: memory
    label: Recall prior context
    action: read
    scope: repo
    key: "{{_trigger.repo_full_name}}"
    limit: 5
    next: fetch_issue

  fetch_issue:
    type: tool
    integration: github
    action: fetch_issue
    label: Fetch issue
    description: Get full issue title, body, and metadata
    params:
      owner: "{{_trigger.repo_owner}}"
      repo: "{{_trigger.repo_name}}"
      issue_number: "{{_trigger.issue_number}}"
    next: implement_fix

  implement_fix:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Implement fix
    description: |
      You are an expert software engineer.
      A GitHub issue has been labeled 'autopilot ready'.

      Issue title: {{fetch_issue.title}}
      Issue body: {{fetch_issue.body}}
      Repo: {{_trigger.repo_full_name}}
      Clone URL: {{_trigger.clone_url}}

      {% if recall_context.entries %}
      Prior runs on this repo (use this to avoid re-exploring known structure):
      {% for entry in recall_context.entries %}
      - {{entry.summary}}
      {% endfor %}
      {% endif %}

      CRITICAL: Each run_shell call gets a FRESH container — do ALL git work in a
      SINGLE run_shell call. Use read_file for exploration, then ONE run_shell for all git ops.

      Do ALL of the following in ONE run_shell call:
      - rm -rf /tmp/autopilot_repo
      - git clone --depth {{inputs.clone_depth}} https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git /tmp/autopilot_repo
      - cd /tmp/autopilot_repo && git config user.email "bot@conductai.ai" && git config user.name "Conduct AI"
      - git checkout -b autopilot/issue-{{fetch_issue.issue_number}}
      - Apply the fix with python3/sed inline in the script
      - git add -A && git commit -m "fix: <short description> (closes #{{fetch_issue.issue_number}})"
      - git push https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git autopilot/issue-{{fetch_issue.issue_number}}
      - Open the PR via curl:
        curl -s -X POST https://api.github.com/repos/{{_trigger.repo_full_name}}/pulls \
          -H "Authorization: token $GIT_TOKEN" -H "Content-Type: application/json" \
          -d '{"title":"fix: {{fetch_issue.title}} (closes #{{fetch_issue.issue_number}})","head":"autopilot/issue-{{fetch_issue.issue_number}}","base":"{{_trigger.default_branch}}","body":"Automated fix by Conduct AI.\n\nCloses #{{fetch_issue.issue_number}}"}' \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('html_url',''))"

      Output ONLY the following JSON on the last line of your response:
        {"pr_url": "<full PR URL>", "approach": "<one-line description of fix approach>", "files_changed": "<comma-separated list of files>"}
    next: record_outcome

  record_outcome:
    type: memory
    label: Record outcome
    action: write
    scope: repo
    key: "{{_trigger.repo_full_name}}"
    summary: |
      Issue #{{_trigger.issue_number}}: {{_trigger.title}}
      Fix: {{implement_fix.approach}}
      Files: {{implement_fix.files_changed}}
      PR: {{implement_fix.pr_url}}
    next: notify_success

  notify_success:
    type: output
    label: Notify PR ready
    description: "PR opened for issue #{{fetch_issue.issue_number}}: {{fetch_issue.title}}. Review at {{implement_fix.pr_url}}"
    output:
      via: slack
      slack:
        channel: "#general"
        approval: true

test_trigger:
  payload:
    action: labeled
    label:
      name: "[TEST] autopilot ready"
    issue:
      number: 16
      title: "[TEST] fix: address critical security findings on PR #12"
      body: |
        This is a test run — prefix the branch and PR with [TEST].
        Review the security scan findings on PR #12 and implement fixes for any critical issues found.
      html_url: "https://github.com/sseshachala/conductai-testbed-node/issues/16"
      user:
        login: conductai-test-bot
      labels:
        - name: "[TEST] autopilot ready"
    repository:
      full_name: sseshachala/conductai-testbed-node
      name: conductai-testbed-node
      owner:
        login: sseshachala
      default_branch: main
      clone_url: "https://github.com/sseshachala/conductai-testbed-node.git"
    sender:
      login: conductai-test-bot
