name: Dependency Updater
version: 1
description: >
  Triggered via inbound webhook (e.g. a weekly GitHub Actions cron job).
  Scans for outdated patch/minor dependencies, bumps versions, opens a PR.
  Only patch and minor bumps — never major. Safe to automate weekly.

  Setup — two options:
  Option A (GitHub Actions cron):
    Add a .github/workflows/dep-update-trigger.yml that runs on schedule:
      - cron: '0 9 * * 1'   # Every Monday 9am
    Step: curl -X POST https://<your-api>/webhooks/inbound/<this-workflow-id>
          -H "Content-Type: application/json"
          -d '{"repo":"owner/repo","clone_url":"https://github.com/owner/repo.git","default_branch":"main"}'

  Option B (any cron service — cron-job.org, EasyCron, etc.):
    Schedule a weekly POST to the webhook URL above with the same JSON body.

inputs:
  repo:
    label: GitHub repository (owner/repo)
    hint: "e.g. myorg/my-repo — used as the default target when testing via CLI"
    type: text
    default: ""
  model:
    label: AI Model
    default: claude-haiku-4-5-20251001
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7
  clone_depth:
    label: Clone depth
    default: "1"
    type: select
    options:
      - "1"
      - "0"
    hint: "1 = fast (recommended), 0 = full history"

on:
  webhook:
    next: scan_and_update

blocks:
  scan_and_update:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Scan and update dependencies
    description: |
      You are an expert software engineer updating outdated dependencies.

      Trigger payload: {{_trigger}}

      Extract from payload:
      - repo: {{_trigger.repo}} OR {{_trigger.repository.full_name}} OR {{inputs.repo}}
      - clone_url: {{_trigger.clone_url}} OR https://github.com/{{inputs.repo}}.git
      - default_branch: {{_trigger.default_branch}} OR {{_trigger.repository.default_branch}} (default "main" if missing)

      CRITICAL: Each run_shell call gets a FRESH container — do ALL git work in a
      SINGLE run_shell call. Do NOT split clone/update/push across multiple calls.

      Steps (all in ONE run_shell call):
      1. Clone the repo:
         rm -rf /tmp/dep_update_repo
         git clone --depth {{inputs.clone_depth}} https://$GIT_TOKEN@github.com/{{_trigger.repo}} /tmp/dep_update_repo
         cd /tmp/dep_update_repo && git config user.email "bot@conductai.ai" && git config user.name "Conduct AI"

      2. Detect package manager:
         - package.json present → Node.js/npm
         - requirements.txt or pyproject.toml present → Python/pip
         - go.mod present → Go

      3. Scan for outdated dependencies:
         Node.js: npm outdated --json
         Python:  pip list --outdated --format=json
         Go:      go list -m -u all

         Identify only patch/minor updates (x.y.Z or x.Y.z changes).
         SKIP any major version bumps (X.y.z where X changes).

      4. If no patch/minor updates found:
         Output: {"pr_url": null, "updated": 0, "message": "All dependencies up to date"}
         Stop here — do not open a PR.

      5. Create branch:
         git checkout -b deps/auto-update-<today's date YYYY-MM-DD>

      6. Apply updates (patch/minor only):
         Node.js: npm update && npm install
         Python:  pip install --upgrade <pkg>==<new_version> for each; pip freeze > requirements.txt
         Go:      go get -u=patch ./... && go mod tidy

      7. Sanity check (do not fail the run if these don't exist):
         Node.js: npm run build --if-present
         Python:  python -c "import sys; sys.exit(0)"
         Go:      go build ./...

      8. Commit:
         git add .
         git commit -m "chore: auto-update patch/minor dependencies"

      9. Push and open PR:
         git push https://$GIT_TOKEN@github.com/{{_trigger.repo}}.git deps/auto-update-<date>

         POST https://api.github.com/repos/{{_trigger.repo}}/pulls
         {
           "title": "chore: auto-update patch/minor dependencies",
           "head": "deps/auto-update-<date>",
           "base": "{{_trigger.default_branch}}",
           "body": "Automated dependency update by Conduct AI.\n\n**Patch and minor bumps only — no breaking changes.**\n\nMerge when CI passes."
         }
         Header: Authorization: token $GIT_TOKEN

      Output ONLY the following JSON on the last line:
        {"pr_url": "<full PR URL>", "updated": <number of packages bumped>, "message": null}

      On any failure output:
        {"pr_url": null, "updated": 0, "message": "<error description>"}
    next: notify_update

  notify_update:
    type: output
    label: Notify PR opened
    description: "{{scan_and_update.updated}} dependencies updated. PR: {{scan_and_update.pr_url}}"
    output:
      via: slack
      slack:
        channel: "#engineering"

test_trigger:
  payload:
    repository:
      full_name: sseshachala/conductai
      name: conductai
      owner:
        login: sseshachala
      default_branch: main
      clone_url: "https://github.com/sseshachala/conductai.git"
    trigger: "[TEST] manual dependency scan"
