extends: base-autopilot
name: Autopilot Approved — GitHub Issues
version: 2
description: >
  Label an issue `autopilot ready`. Claude implements the fix, runs tests, and
  waits for your approval before opening the PR.

inputs:
  repo:
    label: GitHub repository
    type: string
    required_at: run
    placeholder: owner/repo
    hint: Auto-detected from your GitHub access
  trigger_label:
    label: Trigger label
    default: autopilot ready
    type: select
    options:
      - autopilot ready
      - ai_pilot_ready
      - ai_ready
  model:
    label: AI Model
    default: claude-sonnet-4-6
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7
  clone_depth:
    label: Clone depth
    default: "1"
    type: select
    options:
      - "1"
      - "0"
    hint: "1 = fast (recommended), 0 = full history"
  min_turns:
    label: Minimum turn budget
    default: "35"
    type: select
    options:
      - "20"
      - "35"
      - "50"
      - "75"
    hint: "Floor for the AI turn budget — complex repos may need more"

on:
  github.issue_labeled:
    integration: github
    repo_allowlist: "{{inputs.repo}}"
    labels:
      - "{{inputs.trigger_label}}"
    label_mode: one_of
    next: read_memory

blocks:
  read_memory:
    $use: base-autopilot.recall_context
    key: "{{_trigger.repo_full_name}}"
    next: fetch_issue

  fetch_issue:
    type: mcp
    label: Fetch issue
    description: Get full issue title, body, and metadata
    config:
      server_name: github
      tool_name: get_issue
      inputs:
        owner: "{{_trigger.repo_owner}}"
        repo: "{{_trigger.repo_name}}"
        issue_number: "{{_trigger.issue_number}}"
    next: detect_fork

  detect_fork:
    type: mcp
    label: Detect fork / upstream
    description: Check if the triggered repo is a fork and resolve the upstream PR target
    config:
      server_name: github
      tool_name: get_repository
      inputs:
        owner: "{{_trigger.repo_owner}}"
        repo: "{{_trigger.repo_name}}"
    next: plan_fix

  plan_fix:
    $use: base-autopilot.plan_fix
    next: implement_fix

  implement_fix:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Implement fix
    description: |
      You are an expert software engineer.
      A GitHub issue has been labeled 'autopilot ready'.

      Issue title: {{fetch_issue.title}}
      Issue body: {{fetch_issue.body}}
      Repo: {{_trigger.repo_full_name}}
      Clone URL: {{_trigger.clone_url}}

      Plan (from plan_fix block):
      - Files: {{plan_fix.files}}
      - Approach: {{plan_fix.approach}}
      - Complexity: {{plan_fix.complexity}}
      - Base branch: {{plan_fix.base_branch}}

      {% if read_memory.entries %}
      Prior runs on THIS repo — read carefully and adjust your approach:
      {% for entry in read_memory.entries %}
      - {{entry.summary}}
      {% endfor %}
      Rules from prior context:
      1. If a prior entry shows OUTCOME: failed for this issue/area, do NOT repeat the same approach — try a different file or strategy.
      2. If a prior entry succeeded with a known pattern (test runner, file layout, lint setup), reuse it instead of re-discovering.
      3. If a prior entry mentions a specific gotcha (token scope, branch protection, flaky test), preempt it.
      {% endif %}

      CRITICAL: Each run_shell call gets a FRESH container — do ALL git work in a
      SINGLE run_shell call. Do NOT split across multiple calls — /tmp is gone after each call.
      You MUST push the branch to the remote before this block finishes.

      {{$snippet: token_check_trigger}}
      If git push returns 403 at any point, output the failure JSON immediately and stop — do NOT retry.

      Do ALL of the following in ONE run_shell call:
      - rm -rf /tmp/repo
      - git clone --depth {{inputs.clone_depth}} https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git /tmp/repo
      - cd /tmp/repo && git config user.email "bot@conductai.ai" && git config user.name "Conduct AI"
      - git checkout -b autopilot/issue-{{fetch_issue.issue_number}}
      - Read relevant files to understand the codebase (use read_file tool if needed, then come back to one final run_shell)
      - Apply the fix with python3/sed inline in the script
      {{$snippet: lint}}
      - git add -A && git commit -m "fix: <short description> (closes #{{fetch_issue.issue_number}})"
      - git push https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git autopilot/issue-{{fetch_issue.issue_number}}

      Output ONLY the following JSON on the last line of your response:
        {"branch_name": "autopilot/issue-{{fetch_issue.issue_number}}", "summary": "<brief description of changes>", "lesson": "<one line: what to know for future fixes in this repo — pitfalls, patterns that worked, anything surprising>"}
    next: run_tests

  run_tests:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Run tests & fix
    description: |
      IMPORTANT: This is a fresh sandbox — there is no pre-existing repo directory.
      You must clone the branch that was pushed by the previous step.

      Repo: {{_trigger.repo_full_name}}
      Branch to test: {{implement_fix.branch_name}}

      CRITICAL: Each run_shell call gets a FRESH container — do ALL of the following
      in a SINGLE run_shell call (clone → test → fix → push):

      - git clone --branch {{implement_fix.branch_name}} https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git /tmp/repo
      - cd /tmp/repo && git config user.email "bot@conductai.ai" && git config user.name "Conduct AI"
      - Detect test runner (check package.json / requirements.txt / go.mod)
      - Run tests; if they fail: patch code inline, re-run (up to 3 attempts total)
      - If any fixes were committed:
          git add -A && git commit -m "fix: address test failures"
          git push https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git {{implement_fix.branch_name}}
      - After up to 3 fix attempts, stop regardless of outcome

      Output as JSON on the final line:
        {"passed": true/false, "attempts": <number>, "output": "<brief summary>"}
    next: tests_pass

  tests_pass:
    type: logic
    label: Tests pass?
    condition: "{{run_tests.passed}} == true"
    next:
      pass: approve_pr
      fail: record_outcome_failure

  record_outcome_failure:
    $use: base-autopilot.record_outcome
    key: "{{_trigger.repo_full_name}}"
    summary: |
      Issue #{{_trigger.issue_number}}: {{_trigger.title}}
      OUTCOME: failed — tests did not pass after {{run_tests.attempts}} attempts
      Complexity: {{plan_fix.complexity}} | Approach: {{plan_fix.approach}} | Prior fixes on this repo: {{read_memory.count}}
      Files: {{plan_fix.files}}
      Lesson: {{implement_fix.lesson}}
      Test output: {{run_tests.output}}
    next: notify_failure

  approve_pr:
    type: approval
    label: Approve PR
    via: slack          # options: slack | email | both
    channel: "#engineering"
    # approval_email: "team@yourcompany.com"  # uncomment to also send email
    description: |
      Fix is ready for issue #{{fetch_issue.issue_number}}: {{fetch_issue.title}}

      Tests passed in {{run_tests.attempts}} attempt(s).
      Summary: {{run_tests.output}}

      Approve to push the branch and open a PR. Reject to discard.
    next:
      approved: push_pr
      rejected: notify_failure

  push_pr:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Push & open PR
    description: |
      IMPORTANT: This is a fresh sandbox. The branch is already pushed to the remote —
      do NOT clone the repo. Open the PR directly using the github::create_pull_request tool.

      Repo: {{_trigger.repo_full_name}}
      Branch: {{implement_fix.branch_name}}
      Base: {{_trigger.default_branch}}

      1. Use the github::create_pull_request tool:
         - owner: (extract from {{detect_fork.pr_target_full_name}})
         - repo: (extract from {{detect_fork.pr_target_full_name}})
         - title: "fix: {{fetch_issue.title}} (closes #{{fetch_issue.issue_number}})"
         - head: "{{detect_fork.pr_head_prefix}}{{implement_fix.branch_name}}"
         - base: "{{_trigger.default_branch}}"
         - body: "Automated fix by Conduct AI.\n\nCloses #{{fetch_issue.issue_number}}\n\n{{$snippet: pr_attribution}}"

      Output ONLY the following JSON on the last line:
        {"pr_url": "<full PR URL>"}
    next: record_outcome

  record_outcome:
    $use: base-autopilot.record_outcome
    key: "{{_trigger.repo_full_name}}"
    summary: |
      Issue #{{_trigger.issue_number}}: {{_trigger.title}}
      OUTCOME: success — PR opened after {{run_tests.attempts}} test attempt(s), approved by {{approve_pr.approver}}
      Complexity: {{plan_fix.complexity}} | Approach: {{plan_fix.approach}} | Prior fixes on this repo: {{read_memory.count}}
      Files: {{plan_fix.files}}
      Fix: {{implement_fix.summary}}
      Lesson: {{implement_fix.lesson}}
      PR: {{push_pr.pr_url}}
    next: notify_success

  notify_success:
    type: output
    label: Notify PR ready
    output:
      via: slack
      slack:
        channel: "#engineering"

  notify_failure:
    type: output
    label: Notify failure
    output:
      via: slack
      slack:
        channel: "#engineering"

test_trigger:
  payload:
    action: labeled
    label:
      name: "[TEST] autopilot ready"
    issue:
      number: 16
      title: "[TEST] fix: address critical security findings on PR #12"
      body: |
        This is a test run — prefix the branch and PR with [TEST].
        Review the security scan findings on PR #12 and implement fixes for any critical issues found.
      html_url: "https://github.com/sseshachala/conductai-testbed-node/issues/16"
      user:
        login: conductai-test-bot
      labels:
        - name: "[TEST] autopilot ready"
    repository:
      full_name: sseshachala/conductai-testbed-node
      name: conductai-testbed-node
      owner:
        login: sseshachala
      default_branch: main
      clone_url: "https://github.com/sseshachala/conductai-testbed-node.git"
    sender:
      login: conductai-test-bot
