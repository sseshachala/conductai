name: Copilot / AI PR Reviewer
version: 1
description: >
  Triggered when a pull request is opened by an AI author (GitHub Copilot,
  Cursor, Claude Code, or any bot). Reviews the diff for correctness, security,
  and test coverage, posts a structured review comment, then pauses for a human
  to approve before the PR can be merged.

  Setup: GitHub repo → Settings → Webhooks → Add webhook.
  Payload URL: https://<your-api>/webhooks/inbound/<this-workflow-id>
  Content type: application/json
  Event: Pull requests (pull_request.opened)

  The agent checks whether the PR author is a bot before running.
  Human-authored PRs are silently skipped.

inputs:
  model:
    label: AI Model
    default: claude-haiku-4-5-20251001
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  webhook:
    next: check_author

blocks:
  check_author:
    type: logic
    label: Is AI-authored PR?
    description: >
      Check whether the PR was opened by an AI/bot author.
      GitHub Copilot PRs have user.type == "Bot" or login contains
      "copilot", "cursor", "claude", or ends with "[bot]".
    condition: >
      {{_trigger.pull_request.user.type}} == "Bot"
      OR {{_trigger.pull_request.user.login}} contains "copilot"
      OR {{_trigger.pull_request.user.login}} contains "cursor"
      OR {{_trigger.pull_request.user.login}} contains "claude"
      OR {{_trigger.pull_request.user.login}} ends_with "[bot]"
    next:
      pass: review_pr
      fail: skip_human_pr

  skip_human_pr:
    type: output
    label: Skip — human PR
    description: "PR #{{_trigger.number}} is human-authored — skipping AI review gate."
    output:
      via: slack
      slack:
        channel: "#engineering"

  review_pr:
    type: brain
    mode: agentic
    label: Review AI-generated PR
    description: |
      You are a senior code reviewer auditing a pull request written by an AI coding assistant
      (GitHub Copilot, Cursor, or Claude Code).

      PR details:
      - PR number: {{_trigger.number}}
      - Title: {{_trigger.pull_request.title}}
      - Author: {{_trigger.pull_request.user.login}} (AI-generated)
      - Repo: {{_trigger.repository.full_name}}
      - Diff URL: {{_trigger.pull_request.diff_url}}
      - PR URL: {{_trigger.pull_request.html_url}}
      - Base branch: {{_trigger.pull_request.base.ref}}

      Steps:
      1. Fetch the diff:
         GET {{_trigger.pull_request.diff_url}}
         Use Authorization: token <github_token> header
      2. Review with extra scrutiny for AI-generated code:
         - Correctness: does the change actually solve the stated problem?
         - Security: hardcoded secrets, injection risks, insecure defaults
         - Test coverage: are new code paths tested? Did the AI skip tests?
         - Hallucinated APIs: calls to methods/packages that don't exist
         - Over-engineering: unnecessary abstractions or complexity
         - Breaking changes: interface changes that affect callers
      3. Post a review comment via GitHub API:
         POST https://api.github.com/repos/{{_trigger.repository.full_name}}/pulls/{{_trigger.number}}/reviews
         {
           "body": "<your structured review>",
           "event": "COMMENT"
         }
         Use Authorization: token <github_token> header

      Format your review with three sections:
      🔴 Critical (must fix before merge)
      🟡 Warning (should address)
      🟢 Looks good (what the AI got right)

      If there are no critical issues, say so clearly.

      Output ONLY the following JSON on the last line:
        {"review_url": "<PR URL>", "critical": <count>, "warnings": <count>, "findings": <total count>}
    next: gate_merge

  has_critical:
    type: logic
    label: Critical issues found?
    condition: "{{review_pr.critical}} > 0"
    next:
      pass: check_existing_issue
      fail: gate_merge

  check_existing_issue:
    type: brain
    mode: agentic
    label: Check for existing fix issue
    description: |
      Check if a fix issue already exists for this PR.

      Repo: {{_trigger.repository.full_name}}
      PR number: {{_trigger.number}}

      Steps:
      1. Retrieve the GitHub token from the Delegator credentials vault.
      2. Search GitHub for existing open issues:
         GET https://api.github.com/search/issues?q=repo:{{_trigger.repository.full_name}}+is:issue+is:open+"PR+%23{{_trigger.number}}"+in:title
         Headers: Authorization: token <github_token>
      3. If any issue has a title containing "PR #{{_trigger.number}}", return its number and URL.

      Output ONLY the following JSON on the last line:
        {"exists": true, "issue_url": "<url>", "issue_number": <number>} if found
        {"exists": false} if not found
    next: issue_exists_gate

  issue_exists_gate:
    type: logic
    label: Issue already exists?
    condition: "{{check_existing_issue.exists}} == true"
    next:
      pass: append_fix_issue
      fail: create_fix_issue

  append_fix_issue:
    type: brain
    mode: agentic
    label: Append findings to existing issue
    description: |
      A follow-up review found more critical issues on the same PR.
      Append the new findings to the existing issue and re-trigger Autopilot.

      Existing issue: {{check_existing_issue.issue_url}}
      Issue number: {{check_existing_issue.issue_number}}
      Repo: {{_trigger.repository.full_name}}
      Review: {{review_pr.review_url}}
      Critical issues: {{review_pr.critical}}

      Steps:
      1. Retrieve the GitHub token from the Delegator credentials vault.
      2. Append a comment to the existing issue:
         POST https://api.github.com/repos/{{_trigger.repository.full_name}}/issues/{{check_existing_issue.issue_number}}/comments
         Headers: Authorization: token <github_token>, Content-Type: application/json
         Body: {"body": "## Follow-up review findings\n\nAI PR #{{_trigger.number}} was re-reviewed and {{review_pr.critical}} additional critical issue(s) were found.\n\nReview: {{review_pr.review_url}}\n\nPlease also address these findings."}
      3. Remove the "autopilot ready" label (so re-adding it fires the webhook):
         DELETE https://api.github.com/repos/{{_trigger.repository.full_name}}/issues/{{check_existing_issue.issue_number}}/labels/autopilot%20ready
         Headers: Authorization: token <github_token>
      4. Re-add the label (this fires issues.labeled and re-triggers Autopilot):
         POST https://api.github.com/repos/{{_trigger.repository.full_name}}/issues/{{check_existing_issue.issue_number}}/labels
         Headers: Authorization: token <github_token>, Content-Type: application/json
         Body: {"labels": ["autopilot ready"]}

      Output ONLY the following JSON on the last line:
        {"issue_url": "{{check_existing_issue.issue_url}}", "issue_number": {{check_existing_issue.issue_number}}}
    next: gate_merge

  create_fix_issue:
    type: brain
    mode: agentic
    label: Create fix issue
    description: |
      A PR review found critical issues that need to be fixed before this PR can be approved.

      PR: {{review_pr.review_url}}
      Repo: {{_trigger.repository.full_name}}
      Critical issues: {{review_pr.critical}}

      IMPORTANT: Create the issue WITHOUT labels first, then add the label in a
      separate API call. GitHub only fires the `issues.labeled` webhook when a label
      is added to an existing issue — not when an issue is created with labels attached.

      Steps:
      1. Retrieve the GitHub token from the Delegator credentials vault.
      2. Create the issue (no labels):
         POST https://api.github.com/repos/{{_trigger.repository.full_name}}/issues
         Headers: Authorization: token <github_token>, Content-Type: application/json
         Body:
         {
           "title": "fix: address critical review findings on AI PR #{{_trigger.number}}",
           "body": "## Context\nAI-generated PR #{{_trigger.number}} was reviewed and {{review_pr.critical}} critical issue(s) were found.\n\nReview: {{review_pr.review_url}}\n\n## Task\nRead the review comment on the PR, identify all 🔴 Critical findings, and implement fixes."
         }
         Save the returned issue number.
      3. Add the label in a separate call (this fires the webhook):
         POST https://api.github.com/repos/{{_trigger.repository.full_name}}/issues/<issue_number>/labels
         Headers: Authorization: token <github_token>, Content-Type: application/json
         Body: {"labels": ["autopilot ready"]}

      Output ONLY the following JSON on the last line:
        {"issue_url": "<created issue URL>", "issue_number": <number>}
    next: gate_merge

  gate_merge:
    type: approval
    label: Human approval required
    via: slack          # options: slack | email | both
    channel: "#engineering"
    # approval_email: "team@yourcompany.com"  # uncomment to also send email
    description: >
      AI PR #{{_trigger.number}} has been reviewed.
      Critical issues: {{review_pr.critical}} · Warnings: {{review_pr.warnings}}

      Review: {{review_pr.review_url}}

      Approve to allow merge. Reject to request changes from the AI tool.
    next:
      approved: notify_approved
      rejected: notify_rejected

  notify_approved:
    type: output
    label: Notify — approved to merge
    description: "✅ AI PR #{{_trigger.number}} approved after review. {{review_pr.critical}} critical, {{review_pr.warnings}} warnings. Ready to merge."
    output:
      via: slack
      slack:
        channel: "#engineering"

  notify_rejected:
    type: output
    label: Notify — changes requested
    description: "🚫 AI PR #{{_trigger.number}} rejected. {{review_pr.critical}} critical issues must be fixed before merge."
    output:
      via: slack
      slack:
        channel: "#engineering"
