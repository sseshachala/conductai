name: PR Reviewer
version: 1
description: >
  Every PR gets reviewed for bugs, security issues, and style before a human
  looks at it. Review comment posted automatically.

  Setup: GitHub repo → Settings → Webhooks → Add webhook.
  Payload URL: https://<your-api>/webhooks/inbound/<this-workflow-id>
  Content type: application/json
  Event: Pull requests (pull_request.opened)

inputs:
  model:
    label: AI Model
    default: claude-haiku-4-5-20251001
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7
  slack_channel:
    label: Slack channel
    default: "#engineering"
    type: string

on:
  webhook:
    next: recall_context

blocks:
  recall_context:
    type: memory
    label: Recall prior context
    action: read
    scope: repo
    key: "{{_trigger.repository.full_name}}"
    limit: 5
    next: review_pr

  review_pr:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Review PR
    description: |
      You are an expert code reviewer. A GitHub pull request has been opened.

      PR details from webhook payload:
      - PR number: {{_trigger.number}}
      - Title: {{_trigger.pull_request.title}}
      - Author: {{_trigger.pull_request.user.login}}
      - Repo: {{_trigger.repository.full_name}}
      - Diff URL: {{_trigger.pull_request.diff_url}}
      - PR URL: {{_trigger.pull_request.html_url}}
      - Base branch: {{_trigger.pull_request.base.ref}}
      - Head branch: {{_trigger.pull_request.head.ref}}

      Steps:
      1. Use the github::get_pull_request_diff tool to fetch the diff for PR {{_trigger.number}} in {{_trigger.repository.full_name}}.
      2. Review the diff for:
         - Bugs or logic errors
         - Security issues (hardcoded secrets, SQL injection, XSS, etc.)
         - Missing error handling
         - Style and naming inconsistencies
      3. Use the github::create_review tool to post a review comment:
         - owner: (extract from {{_trigger.repository.full_name}})
         - repo: (extract from {{_trigger.repository.full_name}})
         - pull_number: {{_trigger.number}}
         - body: "<your review summary>"
         - event: "COMMENT"

      Be concise. Group findings by severity (critical / warning / suggestion).
      If the PR looks clean, say so clearly.

      {% if recall_context.entries %}
      Prior reviews on this repo (use to spot recurring issues):
      {% for entry in recall_context.entries %}
      - {{entry.summary}}
      {% endfor %}
      {% endif %}

      Output ONLY the following JSON on the last line:
        {"review_url": "<PR URL>", "findings": <number of issues found>, "critical": <number of critical issues>}
    next: has_critical

  has_critical:
    type: logic
    label: Critical issues found?
    condition: "{{review_pr.critical}} > 0"
    next:
      pass: check_existing_issue
      fail: record_outcome

  check_existing_issue:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Check for existing fix issue
    description: |
      Check if a fix issue already exists for this PR.

      Repo: {{_trigger.repository.full_name}}
      PR number: {{_trigger.number}}

      Steps:
      1. Use the github::search_issues tool:
         - query: "repo:{{_trigger.repository.full_name}} is:issue is:open PR #{{_trigger.number}} in:title"
      2. If any issue has a title containing "PR #{{_trigger.number}}", return its number and URL.

      Output ONLY the following JSON on the last line:
        {"exists": true, "issue_url": "<url>", "issue_number": <number>} if found
        {"exists": false} if not found
    next: issue_exists_gate

  issue_exists_gate:
    type: logic
    label: Issue already exists?
    condition: "{{check_existing_issue.exists}} == true"
    next:
      pass: append_fix_issue
      fail: create_fix_issue

  append_fix_issue:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Append findings to existing issue
    description: |
      A follow-up review found more critical issues on the same PR.
      Append the new findings to the existing issue and re-trigger Autopilot.

      Existing issue: {{check_existing_issue.issue_url}}
      Issue number: {{check_existing_issue.issue_number}}
      Repo: {{_trigger.repository.full_name}}
      Review: {{review_pr.review_url}}
      Critical issues: {{review_pr.critical}}

      Steps:
      1. Use the github::create_issue_comment tool to append a comment:
         - owner: (extract from {{_trigger.repository.full_name}})
         - repo: (extract from {{_trigger.repository.full_name}})
         - issue_number: {{check_existing_issue.issue_number}}
         - body: "## Follow-up review findings\n\nPR #{{_trigger.number}} was re-reviewed and {{review_pr.critical}} additional critical issue(s) were found.\n\nReview: {{review_pr.review_url}}\n\nPlease also address these findings."
      2. Use the github::remove_label tool to remove the "autopilot ready" label.
      3. Use the github::add_label tool to re-add "autopilot ready" (this fires issues.labeled and re-triggers Autopilot).

      Output ONLY the following JSON on the last line:
        {"issue_url": "{{check_existing_issue.issue_url}}", "issue_number": {{check_existing_issue.issue_number}}}
    next: record_outcome

  create_fix_issue:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Create fix issue
    description: |
      A PR review found critical issues that need to be fixed by an automated agent.

      PR: {{review_pr.review_url}}
      Repo: {{_trigger.repository.full_name}}
      Critical issues: {{review_pr.critical}}

      IMPORTANT: Create the issue WITHOUT labels first, then add the label in a
      separate call. GitHub only fires the `issues.labeled` webhook when a label
      is added to an existing issue — not when created with labels attached.

      Steps:
      1. Use the github::create_issue tool (no labels):
         - owner: (extract from {{_trigger.repository.full_name}})
         - repo: (extract from {{_trigger.repository.full_name}})
         - title: "fix: address critical review findings on PR #{{_trigger.number}}"
         - body: "## Context\nPR #{{_trigger.number}} was reviewed and {{review_pr.critical}} critical issue(s) were found.\n\nReview: {{review_pr.review_url}}\n\n## Task\nRead the review comment on the PR, identify all 🔴 Critical findings, and implement fixes.\n\nFiles changed in the PR are the ones to focus on."
         Save the returned issue number.
      2. Use the github::add_label tool to add "autopilot ready" to the new issue (this fires the webhook).

      Output ONLY the following JSON on the last line:
        {"issue_url": "<created issue URL>", "issue_number": <number>}
    next: record_outcome

  record_outcome:
    type: memory
    label: Record outcome
    action: write
    scope: repo
    key: "{{_trigger.repository.full_name}}"
    summary: |
      Repo: {{_trigger.repository.full_name}} PR #{{_trigger.number}}
      Findings: {{review_pr.findings}} ({{review_pr.critical}} critical)
      URL: {{review_pr.review_url}}
    next: notify_review

  notify_review:
    type: output
    label: Notify review posted
    description: "PR #{{_trigger.number}} reviewed: {{review_pr.findings}} findings ({{review_pr.critical}} critical). See {{review_pr.review_url}}"
    output:
      via: slack
      slack:
        channel: "{{inputs.slack_channel}}"

test_trigger:
  payload:
    action: opened
    number: 12
    pull_request:
      number: 12
      title: "[TEST] Add conductai_test.py"
      body: "Test PR opened by Conduct AI test trigger."
      html_url: "https://github.com/sseshachala/conductai/pull/12"
      head:
        ref: test/conductai-test-trigger
        sha: "abc1234def5678"
      base:
        ref: main
      user:
        login: conductai-test-bot
      diff_url: "https://github.com/sseshachala/conductai/pull/12.diff"
    repository:
      full_name: sseshachala/conductai-testbed-node
      name: conductai-testbed-node
      owner:
        login: sseshachala
      clone_url: "https://github.com/sseshachala/conductai-testbed-node.git"
