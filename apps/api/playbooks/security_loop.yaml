# ──────────────────────────────────────────────────────────────────────────────
# security_loop — auto-triage every security finding
#
# Flow:
#   triage (brain) → dismiss_gate (logic: is_real==false?)
#                      pass → auto_dismiss (conduct/update_finding dismissed) → log_false_positive
#                      fail → route_severity
#                               pass → auto_triage (conduct/update_finding triaging) → alert_slack
#                               fail → log_only
# ──────────────────────────────────────────────────────────────────────────────
name: Security Loop
version: 1
description: >
  Auto-triage security findings from any AI tool — Claude Code, Codex, Cursor,
  Windsurf, BugHunter, or any scanner that posts to the findings endpoint.
  Dismisses false positives automatically. Alerts on critical/high findings,
  logs medium/low quietly.

inputs:
  model:
    label: AI Model
    default: claude-haiku-4-5-20251001
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  internal:
    next: triage

blocks:
  triage:
    type: brain
    mode: single
    model: "{{inputs.model}}"
    label: Triage finding
    description: |
      You are a senior application-security engineer performing rapid first-pass
      triage on a security finding reported by an automated scanner.

      Finding details
      ---------------
      Finding ID:     {{_trigger.finding_id}}
      Tool:           {{_trigger.tool}}
      Severity:       {{_trigger.severity}}
      Type:           {{_trigger.type}}
      File:           {{_trigger.file}}
      Line:           {{_trigger.line}}
      Description:    {{_trigger.description}}
      Suggested fix:  {{_trigger.suggested_fix}}
      Repo:           {{_trigger.repo_full_name}}
      Commit:         {{_trigger.commit_sha}}

      Your task
      ---------
      Decide whether this is a real security issue or a false positive.

      False-positive signals (any ONE is sufficient to dismiss):
      - The finding is in a test file, fixture, or example directory
        (paths containing: test/, tests/, spec/, fixtures/, examples/, __mocks__/)
      - The "secret" or "credential" is clearly a placeholder
        (e.g. "YOUR_KEY_HERE", "example.com", "TODO", "changeme", "xxxxxxxx")
      - The vulnerability pattern cannot be triggered by an untrusted caller
        given the code context described
      - The finding type is "other" AND the description is too vague to act on
      - The description says "mentioned in AI output" — this means the scanner
        matched a keyword in an AI response, not actual code. Always dismiss these.

      Real-finding signals:
      - Hardcoded credential that is not a placeholder
      - Injection flaw in a production code path
      - Authentication bypass reachable from an external request
      - Sensitive data returned in an API response without scrubbing

      Severity calibration — accept the reported severity as-is unless it is
      obviously mis-categorised (e.g. a TODO comment reported as "critical").

      Return ONLY valid JSON on a single line — no markdown, no prose:
        {"is_real": true, "confidence": 87, "triage_notes": "Hardcoded Stripe key in production config. Not a test fixture.", "recommended_action": "fix"}

      Fields:
        is_real            — boolean: true if this is a genuine finding
        confidence         — integer 0-100: your confidence in the determination
        triage_notes       — string: one or two sentences explaining the decision
        recommended_action — one of: "fix" | "monitor" | "dismiss"
    next: dismiss_gate

  dismiss_gate:
    type: logic
    label: False positive?
    condition: "{{triage.is_real == false}}"
    next:
      pass: auto_dismiss
      fail: route_severity

  auto_dismiss:
    type: tool
    integration: conduct
    action: update_finding
    label: Auto-dismiss false positive
    params:
      finding_id: "{{_trigger.finding_id}}"
      status: dismissed
    next: slack_gate_dismiss

  route_severity:
    type: logic
    label: Critical or high?
    condition: "{{_trigger.severity == 'critical' or _trigger.severity == 'high'}}"
    next:
      pass: auto_triage
      fail: slack_gate_log

  auto_triage:
    type: tool
    integration: conduct
    action: update_finding
    label: Mark finding as triaging
    params:
      finding_id: "{{_trigger.finding_id}}"
      status: triaging
    next: autopilot_gate

  autopilot_gate:
    type: logic
    label: Autopilot — auto-fix enabled?
    condition: "{{_trigger.autopilot_enabled == true and _trigger.repo_full_name}}"
    next:
      pass: trigger_fix
      fail: slack_gate_alert

  trigger_fix:
    type: tool
    integration: conduct
    action: trigger_fix
    label: Trigger autopilot fix pipeline
    params:
      finding_id: "{{_trigger.finding_id}}"
    next: slack_gate_alert

  slack_gate_alert:
    type: logic
    label: Slack alerts enabled?
    condition: "{{_trigger.slack_alerts_enabled == true}}"
    next:
      pass: alert_slack
      fail: end

  alert_slack:
    type: output
    label: Alert on critical/high finding
    description: |
      Security finding requires immediate attention.

      [{{_trigger.severity | upper}}] {{_trigger.type}} — {{_trigger.repo_full_name}}
      Finding: {{_trigger.finding_id}}
      File: {{_trigger.file}}:{{_trigger.line}}
      Description: {{_trigger.description}}

      Triage ({{triage.confidence}}% confidence): {{triage.triage_notes}}
      Recommended action: {{triage.recommended_action}}

      Suggested fix: {{_trigger.suggested_fix}}
    output:
      via: slack
      slack:
        channel: "{{_trigger.slack_channel}}"

  slack_gate_dismiss:
    type: logic
    label: Slack alerts enabled?
    condition: "{{_trigger.slack_alerts_enabled == true}}"
    next:
      pass: log_false_positive
      fail: end

  log_false_positive:
    type: output
    label: Log dismissed false positive
    description: |
      Finding {{_trigger.finding_id}} auto-dismissed as false positive ({{triage.confidence}}% confidence).
      Reason: {{triage.triage_notes}}
    output:
      via: slack
      slack:
        channel: "{{_trigger.slack_channel}}"

  slack_gate_log:
    type: logic
    label: Slack alerts enabled?
    condition: "{{_trigger.slack_alerts_enabled == true}}"
    next:
      pass: log_only
      fail: end

  log_only:
    type: output
    label: Log medium/low finding
    description: |
      [{{_trigger.severity | upper}}] {{_trigger.type}} logged — {{_trigger.repo_full_name}} · {{_trigger.file}}:{{_trigger.line}}
      Triage: {{triage.triage_notes}}
    output:
      via: slack
      slack:
        channel: "{{_trigger.slack_channel}}"

test_trigger:
  payload:
    event_type: security_finding
    finding_id: "00000000-0000-0000-0000-000000000001"
    tool: "semgrep"
    severity: "high"
    type: "secret-leak"
    file: "config/production.py"
    line: 42
    description: "Hardcoded Stripe secret key detected in production config."
    suggested_fix: "Move the key to an environment variable and rotate the exposed credential."
    repo_full_name: "sseshachala/conductai"
    commit_sha: "abc1234def5678"
    source_run_id: null
