name: CI Notify
version: 1
description: >
  Receives a CI/CD webhook (GitHub Actions, CircleCI, etc.), summarises the
  result, and posts to Slack. On failure, includes a brief AI diagnosis.

on:
  webhook:
    next: summarise_result

blocks:
  summarise_result:
    type: brain
    mode: single
    label: Summarise CI result
    description: |
      A CI/CD pipeline has completed and sent a webhook payload.

      Payload: {{_trigger}}

      1. Extract: repo name, branch, commit SHA, status (success/failure), workflow name, run URL
      2. If status is failure: read the failure reason from the payload and write a one-sentence diagnosis
      3. Format a short Slack message:
         - ✅ or ❌ based on status
         - Repo + branch + workflow name
         - Commit SHA (short, 7 chars)
         - Link to the run
         - If failed: one-sentence diagnosis

      Output ONLY the following JSON on the last line:
        {"status": "success|failure", "message": "<formatted slack message>", "run_url": "<url>"}
    next: notify_result

  notify_result:
    type: output
    label: Post to Slack
    description: "{{summarise_result.message}}"
    output:
      via: slack
      slack:
        channel: "#engineering"
