name: CI Failure Alert
version: 1
description: >
  Fires when a CI/CD build fails. Diagnoses the failure from the webhook payload
  and posts a summary with root cause and suggested fix to Slack.

  Setup: GitHub repo → Settings → Webhooks → Add webhook.
  Payload URL: https://<your-api>/webhooks/inbound/<this-workflow-id>
  Content type: application/json
  Events: choose individual → Workflow runs
  Note: The brain block checks conclusion == failure and skips silently on success.

inputs:
  model:
    label: AI Model
    default: claude-haiku-4-5-20251001
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  webhook:
    next: diagnose_failure

blocks:
  diagnose_failure:
    type: brain
    mode: single
    label: Diagnose CI failure
    description: |
      A CI/CD webhook has fired. Only act if the build failed — skip silently otherwise.

      Payload: {{_trigger}}

      1. Check the conclusion/status field:
         - GitHub Actions: {{_trigger.workflow_run.conclusion}} — only proceed if "failure"
         - CircleCI: {{_trigger.workflow.status}} — only proceed if "failed"
         - Other: look for a status/conclusion field indicating failure
         If the build succeeded, output: {"status": "success", "message": "", "skip": true}

      2. If failed, extract:
         - Repo name and branch
         - Workflow/pipeline name
         - Commit SHA (short, 7 chars) and commit message
         - Author of the failing commit
         - Link to the failed run
         - Failed job/step name if available

      3. Diagnose the failure:
         - Read the failed step name and any error message in the payload
         - Form a one-sentence root cause hypothesis
         - Suggest one concrete fix action

      4. Format a Slack message:
         ❌ *<workflow name>* failed on `<branch>`
         Repo: <repo> | Commit: <sha> by <author>
         Failed step: <step name>
         Likely cause: <hypothesis>
         Fix: <suggested action>
         <link to run>

      Output ONLY the following JSON on the last line:
        {"status": "failure", "skip": false, "message": "<slack message>", "run_url": "<url>"}
    next: notify_failure

  notify_failure:
    type: output
    label: Alert Slack
    description: "{{diagnose_failure.message}}"
    output:
      via: slack
      slack:
        channel: "#engineering"
