# ──────────────────────────────────────────────────────────────────────────────
# ai-incident-drill — Quarterly AI governance incident simulation
#
# Playbook #4 in the AI Governance lifecycle:
#   1. AI Risk Assessment   — pre-deploy
#   2. AI Output Auditor    — weekly
#   3. Drift Detector       — daily
#   4. Incident Drill       — quarterly (this one)
#
# Simulates a realistic AI governance failure scenario, scores your team's
# readiness against the incident response plan generated by ai-risk-assessment,
# and posts a gap analysis + next-drill date to Slack.
# ──────────────────────────────────────────────────────────────────────────────
name: AI Incident Drill
version: 1
description: >
  Quarterly simulation of an AI governance incident. Tests whether the team
  knows what to do when an AI tool causes a problem. Scores readiness against
  the incident response plan from the AI Risk Assessment and posts a readiness
  report to Slack.

inputs:
  model:
    label: AI Model
    default: claude-sonnet-4-6
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7
  slack_channel:
    label: Slack Channel for Report
    type: text
    default: "#ai-governance"
  team:
    label: Team or Department
    type: text
    placeholder: "Engineering"
  tool_name:
    label: AI Tool Being Drilled
    type: text
    placeholder: "e.g. GitHub Copilot, Claude Code"
  scenario:
    label: Incident Scenario
    type: select
    default: "data_leak"
    options:
      - "data_leak"
      - "hallucination_in_prod"
      - "budget_breach"
      - "unauthorized_usage"
      - "model_behaviour_change"

on:
  manual:
    next: plan

blocks:
  plan:
    type: brain
    mode: single
    model: "{{inputs.model}}"
    label: Plan drill complexity
    description: |
      You are a workflow planner. A quarterly AI governance incident drill is
      being run for the following team and tool.

      Team: {{inputs.team}}
      Tool: {{inputs.tool_name}}
      Scenario type: {{inputs.scenario}}

      Drills are always low-complexity — they do not involve live systems.
      Output ONLY the following JSON on the last line:
        {"complexity": "small", "reason": "<one sentence explaining why this drill is straightforward>"}
    next: recall_response_plan

  recall_response_plan:
    type: memory
    label: Recall incident response plan
    action: read
    scope: workspace
    key: "ai-risk-assessment-{{inputs.tool_name}}"
    limit: 1
    next: generate_scenario

  generate_scenario:
    type: brain
    mode: single
    model: "{{inputs.model}}"
    label: Generate drill scenario
    description: |
      You are an AI governance drill facilitator. Generate a realistic,
      time-pressured incident scenario for the drill.

      Tool: {{inputs.tool_name}}
      Team: {{inputs.team}}
      Scenario type: {{inputs.scenario}}

      Scenario templates by type:
      - data_leak: An engineer pasted a customer database export into {{inputs.tool_name}} to ask it to find anomalies. The tool processed it and the session was logged by a third party.
      - hallucination_in_prod: {{inputs.tool_name}} generated a code change that silently introduced an off-by-one error in billing calculations. It passed code review and reached production. Customers are being overcharged.
      - budget_breach: {{inputs.tool_name}} API usage spiked 40x overnight due to a runaway automation loop. The monthly budget was exhausted in 6 hours and costs are still accruing.
      - unauthorized_usage: An employee in {{inputs.team}} has been using an unapproved AI tool to process confidential contract documents. IT flagged anomalous data egress at the DLP boundary.
      - model_behaviour_change: {{inputs.tool_name}} silently received a model update. Outputs that previously passed quality checks are now consistently wrong in a specific domain. The change was not announced.

      Make the scenario specific, realistic, and time-pressured. It is minute 0 of the incident.
      The team has just been paged.

      Output ONLY the following JSON on the last line:
        {
          "scenario_title": "<short title, under 10 words>",
          "scenario_description": "<2-3 sentences describing exactly what happened>",
          "minute_zero": "<1-2 sentences describing the current state at minute 0 — what the on-call engineer is seeing right now>"
        }
    next: score_readiness

  score_readiness:
    type: brain
    mode: single
    model: "{{inputs.model}}"
    label: Score readiness
    description: |
      You are an AI governance auditor scoring a team's incident readiness.

      ## Drill Scenario
      Title: {{generate_scenario.scenario_title}}
      Description: {{generate_scenario.scenario_description}}
      Minute zero: {{generate_scenario.minute_zero}}

      ## Incident Response Plan on File
      {% if recall_response_plan.entries %}
      {% for entry in recall_response_plan.entries %}
      {{entry.summary}}
      {% endfor %}
      {% else %}
      No incident response plan found for {{inputs.tool_name}}. This is a critical gap.
      {% endif %}

      Score the team's readiness against this specific scenario using four dimensions (0-25 each):

      1. Scenario coverage (0-25): Does the response plan explicitly cover this type of incident? Is the trigger condition defined?
      2. Named contacts (0-25): Are the right people named and their contact methods clear? Are there backups?
      3. Rollback clarity (0-25): Is the procedure to disable or suspend {{inputs.tool_name}} written down and executable under pressure?
      4. 15-minute window (0-25): Are the first 15 minutes of steps specific, ordered, and actionable without additional research?

      Be strict. A plan that is vague, uses "TBD", or relies on tribal knowledge scores low.
      If no plan exists, score 0 across all dimensions.

      Total: 0-100.
      Grade: A (90-100), B (75-89), C (60-74), D (40-59), F (0-39).
      Verdict: READY (A or B), NEEDS_WORK (C or D), NOT_READY (F or no plan).

      Output ONLY the following JSON on the last line:
        {
          "score": <number 0-100>,
          "grade": "<A|B|C|D|F>",
          "dimension_scores": {
            "scenario_coverage": <0-25>,
            "named_contacts": <0-25>,
            "rollback_clarity": <0-25>,
            "fifteen_minute_window": <0-25>
          },
          "gaps": ["<specific gap, one per item>"],
          "strengths": ["<specific strength, one per item>"],
          "verdict": "<READY|NEEDS_WORK|NOT_READY>"
        }
    next: compile_drill_report

  compile_drill_report:
    type: brain
    mode: single
    model: "{{inputs.model}}"
    label: Compile drill report
    description: |
      You are writing the post-drill readiness report for a quarterly AI governance drill.

      ## Drill Details
      Team: {{inputs.team}}
      Tool: {{inputs.tool_name}}
      Scenario type: {{inputs.scenario}}

      ## Scenario Presented
      Title: {{generate_scenario.scenario_title}}
      Description: {{generate_scenario.scenario_description}}
      Minute zero: {{generate_scenario.minute_zero}}

      ## Readiness Score
      Score: {{score_readiness.score}}/100
      Grade: {{score_readiness.grade}}
      Verdict: {{score_readiness.verdict}}
      Dimension scores: {{score_readiness.dimension_scores}}
      Gaps: {{score_readiness.gaps}}
      Strengths: {{score_readiness.strengths}}

      Format a clean Slack-ready markdown drill report using this exact structure:

      ## 🚨 AI Incident Drill — {{inputs.tool_name}}
      **Team:** {{inputs.team}} | **Scenario:** {{generate_scenario.scenario_title}}
      **Date:** <today's date> | **Next drill:** <date 90 days from today>

      ### 📋 Scenario Presented
      > {{generate_scenario.scenario_description}}
      >
      > *Minute 0:* {{generate_scenario.minute_zero}}

      ### 📊 Readiness Score
      **{{score_readiness.score}}/100 — Grade {{score_readiness.grade}} — {{score_readiness.verdict}}**

      | Dimension | Score |
      |---|---|
      | Scenario coverage | {{score_readiness.dimension_scores.scenario_coverage}}/25 |
      | Named contacts | {{score_readiness.dimension_scores.named_contacts}}/25 |
      | Rollback clarity | {{score_readiness.dimension_scores.rollback_clarity}}/25 |
      | 15-min window | {{score_readiness.dimension_scores.fifteen_minute_window}}/25 |

      ### ⚠️ What Would Go Wrong
      Based on the current plan, describe concisely (2-4 bullet points) what would actually go wrong
      if this incident happened today. Be specific to the scenario and the gaps found.

      ### 🔧 Top 3 Gaps to Fix Before Next Drill
      List the top 3 most critical gaps from {{score_readiness.gaps}} with a one-line recommended fix for each.

      ### ✅ Strengths
      (list strengths from {{score_readiness.strengths}}, or "No strengths identified — response plan is missing." if empty)

      ---
      *Generated by [Conduct AI](https://conductai.ai) · AI Incident Drill · Quarterly*

      Output ONLY the following JSON on the last line:
        {"report": "<the full formatted report above>", "verdict": "<READY|NEEDS_WORK|NOT_READY>"}
    next: record_outcome

  record_outcome:
    type: memory
    label: Record drill outcome
    action: write
    scope: workspace
    key: "ai-incident-drill-{{inputs.team}}"
    summary: |
      Tool: {{inputs.tool_name}} | Team: {{inputs.team}} | Scenario: {{inputs.scenario}}
      Score: {{score_readiness.score}}/100 | Grade: {{score_readiness.grade}} | Verdict: {{score_readiness.verdict}}
      Top gaps: {{score_readiness.gaps}}
      Drill date: today
    next: notify_report

  notify_report:
    type: output
    label: Post drill report to Slack
    description: |
      {{compile_drill_report.report}}
    output:
      via: slack
      slack:
        channel: "{{inputs.slack_channel}}"

test_trigger:
  payload:
    inputs:
      tool_name: "GitHub Copilot"
      team: "Engineering"
      scenario: "data_leak"
      slack_channel: "#ai-governance"
