name: Incident Responder
version: 1
description: >
  PagerDuty or OpsGenie fires an alert webhook → agent investigates recent
  commits and deploys → posts root cause hypothesis to Slack in under 60 seconds.

  Setup:
  PagerDuty:  Service → Integrations → Add webhook → Payload URL below → trigger on "incident.trigger"
  OpsGenie:   Team → Integrations → Webhook → Payload URL below → Send on "alert created"
  Generic:    Any monitoring tool that supports outbound webhooks (Grafana, Datadog, etc.)
  Payload URL: https://<your-api>/webhooks/inbound/<this-workflow-id>

  The agent reads the alert, fetches the last 10 commits and 5 deploys on the
  affected repo, correlates timing, and posts a structured hypothesis to #incidents.

inputs:
  model:
    label: AI Model
    default: claude-haiku-4-5-20251001
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  webhook:
    next: investigate

blocks:
  investigate:
    type: brain
    mode: agentic
    label: Investigate incident
    description: |
      An incident alert has fired. Investigate and post a root cause hypothesis.

      Alert payload: {{_trigger}}

      Step 1 — Parse the alert (handle all three formats):
        PagerDuty:  title from {{_trigger.messages[0].event.data.title}}
                    service from {{_trigger.messages[0].event.data.service.name}}
                    severity from {{_trigger.messages[0].event.data.priority.name}} (or "unknown")
                    triggered_at from {{_trigger.messages[0].event.occurred_at}}
        OpsGenie:   title from {{_trigger.alert.message}}
                    service/tags from {{_trigger.alert.tags}}
                    severity from {{_trigger.alert.priority}}
                    triggered_at from {{_trigger.alert.createdAt}}
        Generic:    look for fields named: title, message, service, severity, timestamp, created_at

      Step 2 — Identify the GitHub repo:
        Map the service name to a GitHub repo (owner/repo).
        If no mapping is obvious, search for a repo whose name contains the service name:
          GET https://api.github.com/search/repositories?q=<service_name>+in:name
        Use Authorization: token <github_token> on all GitHub API calls.

      Step 3 — Fetch recent activity on that repo:
        Commits (last 10):
          GET https://api.github.com/repos/<owner>/<repo>/commits?per_page=10
        Deployments (last 5):
          GET https://api.github.com/repos/<owner>/<repo>/deployments?per_page=5

      Step 4 — Correlate timing:
        Alert fired at: <triggered_at from Step 1>
        Look for commits or deploys in the 2 hours before the alert fired.
        Flag any commit that:
          - Was merged within 2h before the alert
          - Touched files in directories that match the service name or its typical paths
            (e.g. src/payment, apps/checkout, services/auth)
        If multiple candidates exist, rank by recency.

      Step 5 — Form a hypothesis:
        "Deploy at <time> included commit <sha> by <author> which touched <files>.
         This correlates with the alert firing <N> minutes later."
        If no clear candidate: "No deploy or commit found in 2h window. May be a traffic spike or external dependency."

      Step 6 — Compose Slack message:
        🚨 *<service>* incident — <severity>
        Alert: <title>
        Fired: <triggered_at>

        *Hypothesis:* <one sentence from Step 5>
        *Suspect commit:* `<sha>` — <message> by @<author> (<time ago>)
        *Files touched:* <comma-separated list>

        *Suggested next steps:*
        1. Check error rate on <service> in your monitoring dashboard
        2. If commit is the culprit: revert `<sha>` or roll back the deploy
        3. Page <author> if confirmation needed

      Output ONLY the following JSON on the last line:
        {"hypothesis": "<one sentence>", "suspect_commit": "<sha or null>", "message": "<slack message>"}

      If the payload is not a real alert (e.g. a test ping), output:
        {"hypothesis": null, "suspect_commit": null, "message": null}
      And stop — do not post to Slack.
    next: notify_incident

  notify_incident:
    type: output
    label: Post incident hypothesis
    description: "{{investigate.message}}"
    output:
      via: slack
      slack:
        channel: "#incidents"
