name: Third-Party Autopilot Fix
version: 3
description: >
  Given an issue number on any third-party repo, fork it, apply the fix, push a
  branch, and open a PR back to upstream.
  Works in two modes automatically — sandbox (persistent /workspace) if credentials
  are configured, proxy (single-shell-call) otherwise. No manual config needed.

inputs:
  upstream_owner:
    label: Upstream repo owner
    type: string
    hint: "GitHub username or org that owns the target repo"
  upstream_repo:
    label: Upstream repo name
    type: string
    hint: "Repo name only, e.g. click"
  issue_number:
    label: Issue number
    type: string
    hint: "Issue number describing what needs to be fixed"
  model:
    label: AI model
    default: claude-sonnet-4-6
    type: select
    options:
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  manual:
    next: fetch_issue

blocks:

  fetch_issue:
    type: tool
    integration: github
    action: fetch_issue
    label: Fetch issue
    description: Pull the issue from the upstream repo
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      issue_number: "{{inputs.issue_number}}"
    next: fork_upstream

  fork_upstream:
    type: tool
    integration: github
    action: fork_repo
    label: Fork upstream repo
    description: Fork into the authenticated user's GitHub account (reuses existing fork if already present)
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
    next: implement_fix

  implement_fix:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Implement fix
    description: |
      You are an expert software engineer contributing a fix to an open-source project.

      Upstream:    {{inputs.upstream_owner}}/{{inputs.upstream_repo}}
      Fork:        {{fork_upstream.fork_full_name}}
      Branch:      fix/issue-{{inputs.issue_number}}
      Issue title: {{fetch_issue.title}}
      Issue body:
      {{fetch_issue.body}}

      ── STEP 1: DETECT YOUR EXECUTION MODE ──────────────────────────────────
      Run this FIRST:
        if [ -d /workspace/.git ]; then echo "MODE=sandbox"; else echo "MODE=proxy"; fi

      ── SANDBOX MODE (output was MODE=sandbox) ──────────────────────────────
      The repo is already cloned at /workspace on branch fix/issue-{{inputs.issue_number}}.
      The filesystem persists across tool calls — use multiple calls freely.

      1. Read relevant source files to understand the codebase
      2. Apply the fix — search for exact patterns, never hardcode line numbers
      3. Verify changes parse/compile cleanly
      4. Run repo linter before committing — auto-detect from repo config:
           if [ -f .pre-commit-config.yaml ]; then
             pre-commit run --all-files 2>/dev/null; pre-commit run --all-files 2>/dev/null || true
           elif [ -f pyproject.toml ] || [ -f ruff.toml ]; then
             ruff check --fix . 2>/dev/null || true && ruff format . 2>/dev/null || true
           elif command -v black &>/dev/null; then
             black . 2>/dev/null || true
           fi
      5. cd /workspace && git add -A && git diff --cached --stat
      6. git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
      7. git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}

      ── PROXY MODE (output was MODE=proxy) ──────────────────────────────────
      CRITICAL: Each run_shell call gets a FRESH container — filesystem resets between calls.
      Use search_code/read_file to understand the codebase (no filesystem cost), then
      do ALL git+fix+push operations in ONE single run_shell call:

        git config --global user.email "bot@conductai.ai" && \
        git config --global user.name "Conduct AI" && \
        git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /tmp/repo && \
        cd /tmp/repo && \
        git remote add upstream https://github.com/{{inputs.upstream_owner}}/{{inputs.upstream_repo}}.git && \
        git fetch upstream --depth=50 && \
        git checkout -b fix/issue-{{inputs.issue_number}} && \
        git merge --ff-only upstream/{{fork_upstream.default_branch}} 2>/dev/null || \
          git reset --hard upstream/{{fork_upstream.default_branch}} && \
        <APPLY FIX using sed/awk/python -c or heredoc — all inline> && \
        (if [ -f .pre-commit-config.yaml ]; then pre-commit run --all-files 2>/dev/null; pre-commit run --all-files 2>/dev/null || true; elif [ -f pyproject.toml ] || [ -f ruff.toml ]; then ruff check --fix . 2>/dev/null || true && ruff format . 2>/dev/null || true; elif command -v black &>/dev/null; then black . 2>/dev/null || true; fi) && \
        git add -A && git diff --cached --stat && \
        git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})" && \
        git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}

      ── OUTPUT (both modes) ─────────────────────────────────────────────────
      After pushing, output ONLY this JSON on the last line (use the ACTUAL branch name you created):
        {"branch_pushed": "<actual-branch-name>", "fork_owner": "{{fork_upstream.fork_owner}}", "fork_full_name": "{{fork_upstream.fork_full_name}}"}
    next: open_pr

  open_pr:
    type: tool
    integration: github
    action: open_pull_request
    label: Open pull request
    description: Open PR from fork branch back to upstream
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      title: "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
      head: "{{implement_fix.fork_owner}}:{{implement_fix.branch_pushed}}"
      base: "{{fork_upstream.default_branch}}"
      body: |
        Fixes #{{inputs.issue_number}}

        ---

        This fix was implemented autonomously by **[Conduct AI](https://conductai.ai)** — an open-source platform
        that turns AI agents into reusable team automations via YAML playbooks.

        - 🔗 Platform: [conductai.ai](https://conductai.ai)
        - 📦 Source: [github.com/sseshachala/conductai](https://github.com/sseshachala/conductai)
        - ▶ Playbook: `thirdparty-autopilot-fix` — fork → fix → PR in one automated run

        > Want Conduct AI to fix issues in your repo too? [Get started free →](https://conductai.ai)
    next: notify_slack

  notify_slack:
    type: output
    label: Notify channel
    output:
      via: slack
      slack:
        channel: "#engineering"
        message: |
          *Third-Party Autopilot Fix — PR opened*

          Repo: `{{inputs.upstream_owner}}/{{inputs.upstream_repo}}`
          Issue: #{{inputs.issue_number}} — {{fetch_issue.title}}
          PR: {{open_pr.pr_url}}

          _Generated by Conduct AI · thirdparty-autopilot-fix playbook_

test_trigger:
  payload:
    upstream_owner: "pallets"
    upstream_repo: "click"
    issue_number: "3572"
    model: claude-sonnet-4-6
