extends: base-autopilot
name: Third-Party Autopilot Fix
version: 6
description: >
  Given an issue number on any third-party repo (any language), fork it, apply
  the fix, push a branch, and open a PR back to upstream.
  Works in two modes automatically — sandbox (persistent /workspace) if credentials
  are configured, proxy (single-shell-call) otherwise. No manual config needed.
  Auto-detects the repo's linter (pre-commit, ruff, eslint, cargo, gofmt, rubocop).
  Reads fix history for the repo before starting, writes a summary after success
  so every subsequent run on the same repo gets smarter.

inputs:
  upstream_owner:
    label: Upstream repo owner
    type: string
    hint: "GitHub username or org that owns the target repo"
  upstream_repo:
    label: Upstream repo name
    type: string
    hint: "Repo name only, e.g. click"
  issue_number:
    label: Issue number
    type: string
    hint: "Issue number describing what needs to be fixed"
  model:
    label: AI model
    default: claude-sonnet-4-6
    type: select
    options:
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  manual:
    next: fetch_issue

blocks:

  fetch_issue:
    type: tool
    integration: github
    action: fetch_issue
    label: Fetch issue
    description: Pull the issue from the upstream repo
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      issue_number: "{{inputs.issue_number}}"
    next: fork_upstream

  fork_upstream:
    type: tool
    integration: github
    action: fork_repo
    label: Fork upstream repo
    description: Fork into the authenticated user's GitHub account (reuses existing fork if already present)
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
    next: read_memory

  read_memory:
    $use: base-autopilot.recall_context
    key: "{{inputs.upstream_owner}}/{{inputs.upstream_repo}}"
    next: implement_fix

  implement_fix:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    max_turns: 20
    label: Implement fix
    description: |
      You are an expert software engineer contributing a fix to an open-source project.

      Upstream:    {{inputs.upstream_owner}}/{{inputs.upstream_repo}}
      Fork:        {{fork_upstream.fork_full_name}}
      Branch:      fix/issue-{{inputs.issue_number}}
      Issue title: {{fetch_issue.title}}
      Issue body:
      {{fetch_issue.body}}

      ── PRIOR FIXES ON THIS REPO ────────────────────────────────────────────
      Use this context to avoid repeating mistakes and reuse known-good patterns:
      {{read_memory.entries}}
      (Empty if this is the first fix on this repo — no prior context available.)

      ── STEP 1: DETECT YOUR EXECUTION MODE ──────────────────────────────────
      {{$snippet: detect_mode}}

      ── SANDBOX MODE (output was MODE=sandbox) ──────────────────────────────
      The repo is already cloned at /workspace on branch fix/issue-{{inputs.issue_number}}.
      The filesystem persists across tool calls — use multiple calls freely.
      DO NOT make GitHub API calls to explore — use local grep/find instead (faster, no rate limits).

      STEP A — EXTRACT FILE TARGETS FROM ISSUE (before any tool calls):
        Read the issue title and body. Extract:
        - Any file paths mentioned (e.g. awscli/customizations/login.py)
        - Any function or class names mentioned
        - Any error messages with file references
        If paths are mentioned → go directly to those files.
        If only a function/class name → run: grep -r "function_name" /workspace --include="*.py" -l

      STEP B — FIND AND READ (at most 3 tool calls):
        cd /workspace && grep / find / cat to locate and read the relevant code.
        Do not explore broadly — target only what the issue points to.

      STEP C — APPLY FIX:
      1. Edit the file(s) directly in /workspace using sed/awk/python -c or write_file
      2. Verify changes parse cleanly: python3 -m py_compile <file> 2>&1
      3. Run repo linter:
      {{$snippet: lint}}
      4. cd /workspace && git add -A && git diff --cached --stat
      5. git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
      6. git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}

      ── PROXY MODE (output was MODE=proxy) ──────────────────────────────────
      CRITICAL: Each run_shell call gets a FRESH container — filesystem resets between calls.

      STEP A — EXTRACT FILE TARGETS FROM ISSUE (do this first, before any tool calls):
        Read the issue title and body carefully. Extract:
        - Any file paths mentioned (e.g. awscli/customizations/login.py)
        - Any function or class names mentioned
        - Any error messages that reference a file + line
        Start your search with those exact paths. Do NOT do a broad tree walk first.

      STEP B — EXPLORATION (at most 5 tool calls total):
        Use search_code/read_file targeted at the extracted paths.
        If a file is mentioned in the issue → read it directly.
        If only a function name is given → search_code for that name.
        After 5 exploration calls you MUST proceed to Step C, even if uncertain.
        Make your best inference from what you found — do not keep exploring.

      STEP C — ONE run_shell call with ALL of: clone + fix + push:

        git config --global user.email "bot@conductai.ai" && \
        git config --global user.name "Conduct AI" && \
        git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /tmp/repo && \
        cd /tmp/repo && \
        git remote add upstream https://github.com/{{inputs.upstream_owner}}/{{inputs.upstream_repo}}.git && \
        git fetch upstream --depth=50 && \
        git checkout -b fix/issue-{{inputs.issue_number}} && \
        git merge --ff-only upstream/{{fork_upstream.default_branch}} 2>/dev/null || \
          git reset --hard upstream/{{fork_upstream.default_branch}} && \
        <APPLY FIX using sed/awk/python -c or heredoc — all inline> && \
        (if [ -f .pre-commit-config.yaml ]; then pre-commit run --all-files 2>/dev/null; pre-commit run --all-files 2>/dev/null || true; elif [ -f pyproject.toml ] || [ -f ruff.toml ] || [ -f setup.py ]; then ruff check --fix . 2>/dev/null || true && ruff format . 2>/dev/null || true; elif command -v black &>/dev/null; then black . 2>/dev/null || true; elif [ -f package.json ]; then (npx eslint --fix . 2>/dev/null || true) && (npx prettier --write . 2>/dev/null || true); elif [ -f Cargo.toml ]; then cargo fmt 2>/dev/null || true && cargo clippy --fix --allow-dirty 2>/dev/null || true; elif [ -f go.mod ]; then gofmt -w . 2>/dev/null || true; elif [ -f Gemfile ]; then bundle exec rubocop -a 2>/dev/null || true; fi) && \
        git add -A && git diff --cached --stat && \
        git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})" && \
        git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}

      ── OUTPUT (both modes) ─────────────────────────────────────────────────
      After pushing, output ONLY this JSON on the last line (use the ACTUAL branch name you created).
      Set head_ref based on REPO_TYPE:
        REPO_TYPE=same → head_ref = "<branch-name>"  (no owner prefix)
        REPO_TYPE=fork → head_ref = "{{fork_upstream.fork_owner}}:<branch-name>"
        {"branch_pushed": "<actual-branch-name>", "head_ref": "<head_ref>", "fork_owner": "{{fork_upstream.fork_owner}}", "fork_full_name": "{{fork_upstream.fork_full_name}}", "fix_summary": "<one line: which file(s) changed and what the fix was>"}
    next: open_pr

  open_pr:
    type: tool
    integration: github
    action: open_pull_request
    label: Open pull request
    description: Open PR from fork branch back to upstream
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      title: "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
      head: "{{implement_fix.head_ref}}"
      base: "{{fork_upstream.default_branch}}"
      body: |
        Fixes #{{inputs.issue_number}}

        {{$snippet: pr_attribution}}
    next: write_memory

  write_memory:
    $use: base-autopilot.record_outcome
    key: "{{inputs.upstream_owner}}/{{inputs.upstream_repo}}"
    summary: |
      Issue #{{inputs.issue_number}}: {{fetch_issue.title}}
      PR: {{open_pr.pr_url}}
      Fix: {{implement_fix.fix_summary}}
    next: notify_slack

  notify_slack:
    type: output
    label: Notify channel
    output:
      via: slack
      slack:
        channel: "#engineering"
        message: |
          *Third-Party Autopilot Fix — PR opened*

          Repo: `{{inputs.upstream_owner}}/{{inputs.upstream_repo}}`
          Issue: #{{inputs.issue_number}} — {{fetch_issue.title}}
          PR: {{open_pr.pr_url}}

          _Generated by Conduct AI · thirdparty-autopilot-fix playbook_

test_trigger:
  payload:
    upstream_owner: "pallets"
    upstream_repo: "click"
    issue_number: "3572"
    model: claude-sonnet-4-6
