extends: base-autopilot
name: Third-Party Autopilot Fix
version: 9
description: >
  Given an issue number on any third-party repo (any language), fork it, apply
  the fix, push a branch, and open a PR back to upstream.
  plan_fix classifies complexity; the executor transparently routes to a sandbox
  (E2B or Modal) for medium/large fixes, proxy for small — no canvas routing blocks.
  Auto-detects the repo's linter. Reads fix history before starting, writes
  a summary after success so every subsequent run on the same repo gets smarter.

inputs:
  upstream_owner:
    label: Upstream repo owner
    type: string
    hint: "GitHub username or org that owns the target repo"
  upstream_repo:
    label: Upstream repo name
    type: string
    hint: "Repo name only, e.g. click"
  issue_number:
    label: Issue number
    type: string
    hint: "Issue number describing what needs to be fixed"
  model:
    label: AI model
    default: claude-sonnet-4-6
    type: select
    options:
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  manual:
    next: fetch_issue

blocks:

  fetch_issue:
    type: tool
    integration: github
    action: fetch_issue
    label: Fetch issue
    description: Pull the issue from the upstream repo
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      issue_number: "{{inputs.issue_number}}"
    next: fork_upstream

  fork_upstream:
    type: tool
    integration: github
    action: fork_repo
    label: Fork upstream repo
    description: Fork into the authenticated user's GitHub account (reuses existing fork if already present)
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
    next: read_memory

  read_memory:
    $use: base-autopilot.recall_context
    key: "{{inputs.upstream_owner}}/{{inputs.upstream_repo}}"
    next: plan_fix

  plan_fix:
    $use: base-autopilot.plan_fix
    next: implement_fix

  implement_fix:
    type: brain
    mode: agentic
    sandbox: auto
    model: "{{inputs.model}}"
    max_turns: 12
    label: Implement fix
    description: |
      You are implementing a targeted code fix. The plan is already done.
      Your ONLY job: make ONE run_shell call with a complete script. Nothing else.

      ── THE PLAN (do not re-derive) ──────────────────────────────────────────
      Files:    {{plan_fix.files}}
      Approach: {{plan_fix.approach}}
      Grep:     {{plan_fix.grep_pattern}}
      Prior:    {{read_memory.entries}}

      ── YOUR ONE SHELL CALL ───────────────────────────────────────────────────
      Fill in the FIX SECTION below and run it as a single run_shell call.
      The script auto-detects its mode — do NOT make a separate detection call.

        git config --global user.email "bot@conductai.ai" && \
        git config --global user.name "Conduct AI" && \
        if [ -d /workspace/.git ]; then
          cd /workspace
        elif [ -w /workspace ] || mkdir -p /workspace 2>/dev/null; then
          git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /workspace && \
          cd /workspace && \
          git remote add upstream https://github.com/{{inputs.upstream_owner}}/{{inputs.upstream_repo}}.git && \
          git fetch upstream --depth=50 && \
          git checkout -b fix/issue-{{inputs.issue_number}} && \
          git reset --hard upstream/{{fork_upstream.default_branch}}
        else
          git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /tmp/repo && \
          cd /tmp/repo && \
          git remote add upstream https://github.com/{{inputs.upstream_owner}}/{{inputs.upstream_repo}}.git && \
          git fetch upstream --depth=50 && \
          git checkout -b fix/issue-{{inputs.issue_number}} && \
          git reset --hard upstream/{{fork_upstream.default_branch}}
        fi && \
        \
        # ── LOCATE FILES (grep_pattern fallback) ─────────────────────────────
        # plan_fix.files are hints from the issue text — verify they exist.
        # If none exist, grep for the actual file using grep_pattern.
        PLAN_FILES="{{plan_fix.files}}" && \
        GREP_PAT="{{plan_fix.grep_pattern}}" && \
        FOUND_FILES="" && \
        for f in $PLAN_FILES; do [ -f "$f" ] && FOUND_FILES="$FOUND_FILES $f"; done && \
        if [ -z "$FOUND_FILES" ] && [ -n "$GREP_PAT" ]; then \
          FOUND_FILES=$(grep -rln "$GREP_PAT" . --include="*.py" --include="*.toml" --include="*.cfg" --include="*.txt" --include="*.go" --include="*.js" --include="*.ts" --include="*.rb" --include="*.java" --exclude-dir=".git" 2>/dev/null | head -5); \
          echo "plan_fix files not on disk — grep located: $FOUND_FILES"; \
        fi && \
        \
        # ── FIX SECTION ── fill this in based on the plan above ──────────────
        # Approach: {{plan_fix.approach}}
        # Target files: use $FOUND_FILES (verified on disk) not {{plan_fix.files}} directly
        # Read the file inline if needed: python3 -c "c=open('file.py').read(); open('file.py','w').write(c.replace(...))"
        # Or use sed: sed -i 's/old/new/' file.py
        <YOUR INLINE FIX HERE — operate on $FOUND_FILES, no separate exploration calls> && \
        # ── END FIX SECTION ───────────────────────────────────────────────────
        \
        (if [ -f .pre-commit-config.yaml ]; then pre-commit run --all-files 2>/dev/null || true; \
        elif [ -f pyproject.toml ] || [ -f ruff.toml ]; then ruff check --fix . 2>/dev/null; ruff format . 2>/dev/null || true; \
        elif [ -f package.json ]; then npx eslint --fix . 2>/dev/null || true; fi) && \
        git add -A && git diff --cached --stat && \
        git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})" && \
        git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}

      ── OUTPUT ───────────────────────────────────────────────────────────────
      After pushing, output ONLY this JSON on the last line.
      Set head_ref based on REPO_TYPE:
        REPO_TYPE=same → head_ref = "<branch-name>"
        REPO_TYPE=fork → head_ref = "{{fork_upstream.fork_owner}}:<branch-name>"
        {"branch_pushed": "<actual-branch-name>", "head_ref": "<head_ref>", "fork_owner": "{{fork_upstream.fork_owner}}", "fork_full_name": "{{fork_upstream.fork_full_name}}", "fix_summary": "<one line: which file(s) changed and what the fix was>", "lesson": "<one line: what to know for future fixes in this repo — pitfalls found, patterns that worked, anything surprising>"}
    next: open_pr

  open_pr:
    type: tool
    integration: github
    action: open_pull_request
    label: Open pull request
    description: Open PR from fork branch back to upstream
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      title: "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
      head: "{{implement_fix.head_ref}}"
      base: "{{fork_upstream.default_branch}}"
      body: |
        Fixes #{{inputs.issue_number}}

        {{$snippet: pr_attribution}}
    next: write_memory

  write_memory:
    $use: base-autopilot.record_outcome
    key: "{{inputs.upstream_owner}}/{{inputs.upstream_repo}}"
    summary: |
      Issue #{{inputs.issue_number}}: {{fetch_issue.title}}
      PR: {{open_pr.pr_url}} — status: opened, pending review
      Complexity: {{plan_fix.complexity}} | Prior fixes on this repo: {{read_memory.count}}
      Files: {{plan_fix.files}}
      Approach: {{plan_fix.approach}}
      Fix: {{implement_fix.fix_summary}}
      Lesson: {{implement_fix.lesson}}
    next: notify_slack

  notify_slack:
    type: output
    label: Notify channel
    output:
      via: slack
      slack:
        channel: "#engineering"
        approval: false

test_trigger:
  payload:
    upstream_owner: "pallets"
    upstream_repo: "click"
    issue_number: "3572"
    model: claude-sonnet-4-6
