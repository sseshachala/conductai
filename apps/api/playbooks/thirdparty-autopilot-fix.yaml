extends: base-autopilot
name: Third-Party Autopilot Fix
version: 6
description: >
  Given an issue number on any third-party repo (any language), fork it, apply
  the fix, push a branch, and open a PR back to upstream.
  Works in two modes automatically — sandbox (persistent /workspace) if credentials
  are configured, proxy (single-shell-call) otherwise. No manual config needed.
  Auto-detects the repo's linter (pre-commit, ruff, eslint, cargo, gofmt, rubocop).
  Reads fix history for the repo before starting, writes a summary after success
  so every subsequent run on the same repo gets smarter.

inputs:
  upstream_owner:
    label: Upstream repo owner
    type: string
    hint: "GitHub username or org that owns the target repo"
  upstream_repo:
    label: Upstream repo name
    type: string
    hint: "Repo name only, e.g. click"
  issue_number:
    label: Issue number
    type: string
    hint: "Issue number describing what needs to be fixed"
  model:
    label: AI model
    default: claude-sonnet-4-6
    type: select
    options:
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  manual:
    next: fetch_issue

blocks:

  fetch_issue:
    type: tool
    integration: github
    action: fetch_issue
    label: Fetch issue
    description: Pull the issue from the upstream repo
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      issue_number: "{{inputs.issue_number}}"
    next: fork_upstream

  fork_upstream:
    type: tool
    integration: github
    action: fork_repo
    label: Fork upstream repo
    description: Fork into the authenticated user's GitHub account (reuses existing fork if already present)
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
    next: read_memory

  read_memory:
    $use: base-autopilot.recall_context
    key: "{{inputs.upstream_owner}}/{{inputs.upstream_repo}}"
    next: plan_fix

  plan_fix:
    $use: base-autopilot.plan_fix
    next: implement_fix

  implement_fix:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    max_turns: 25
    label: Implement fix
    description: |
      You are an expert software engineer. The plan is already done — execute it exactly.
      DO NOT re-analyze the issue. DO NOT explore broadly. Start from the plan below.

      Upstream:    {{inputs.upstream_owner}}/{{inputs.upstream_repo}}
      Fork:        {{fork_upstream.fork_full_name}}
      Branch:      fix/issue-{{inputs.issue_number}}
      Issue title: {{fetch_issue.title}}

      ── PRE-COMPUTED PLAN ── use this, do not re-derive ─────────────────────
      Files:       {{plan_fix.files}}
      Functions:   {{plan_fix.functions}}
      Subsystem:   {{plan_fix.subsystem}}
      Approach:    {{plan_fix.approach}}
      Complexity:  {{plan_fix.complexity}}
      Grep:        {{plan_fix.grep_pattern}}

      ── PRIOR FIXES ON THIS REPO ────────────────────────────────────────────
      {{read_memory.entries}}

      ══════════════════════════════════════════════════════════════════════════
      STEP 0 — RUN THIS FIRST (exactly one shell call, nothing else before it):

        if [ -d /workspace/.git ]; then echo "MODE=sandbox"; else echo "MODE=proxy"; fi
        if [ "{{fork_upstream.fork_full_name}}" = "{{inputs.upstream_owner}}/{{inputs.upstream_repo}}" ]; then echo "REPO_TYPE=same"; else echo "REPO_TYPE=fork"; fi

      Read the output. Then follow ONLY the matching section below.
      ══════════════════════════════════════════════════════════════════════════

      ── IF MODE=proxy ────────────────────────────────────────────────────────
      ⚠ PROXY: every shell call is a FRESH container. After Step 0, you have
        EXACTLY ONE more shell call. Pack clone + read + fix + commit + push into it.
        Do NOT make any other calls.

      Your ONE shell call:

        git config --global user.email "bot@conductai.ai" && \
        git config --global user.name "Conduct AI" && \
        git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /tmp/repo && \
        cd /tmp/repo && \
        git remote add upstream https://github.com/{{inputs.upstream_owner}}/{{inputs.upstream_repo}}.git && \
        git fetch upstream --depth=50 && \
        git checkout -b fix/issue-{{inputs.issue_number}} && \
        (git merge --ff-only upstream/{{fork_upstream.default_branch}} 2>/dev/null || git reset --hard upstream/{{fork_upstream.default_branch}}) && \
        echo "=== TARGET FILE ===" && cat {{plan_fix.files[0]}} && \
        <APPLY FIX inline using python3 -c, sed, or heredoc — approach: {{plan_fix.approach}}> && \
        ([ -f pyproject.toml ] || [ -f ruff.toml ]) && (ruff check --fix . 2>/dev/null; ruff format . 2>/dev/null) || true && \
        [ -f .pre-commit-config.yaml ] && (pre-commit run --all-files 2>/dev/null || true) || true && \
        git add -A && git diff --cached --stat && \
        git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})" && \
        git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}

      ── IF MODE=sandbox ──────────────────────────────────────────────────────
      Repo is at /workspace on branch fix/issue-{{inputs.issue_number}}.
      Filesystem persists. NO GitHub API calls. NO broad exploration.

      STEP A — READ (at most 2 calls):
        Files from plan: {{plan_fix.files}}
        → cat /workspace/<file> for each file listed above.
        If files is empty → grep -r "{{plan_fix.grep_pattern}}" /workspace -l | head -5

      STEP B — APPLY FIX (1-2 calls):
        sed/awk/python -c — approach: {{plan_fix.approach}}
        Verify: python3 -m py_compile <file> 2>&1

      STEP C — LINT, COMMIT, PUSH (1 call):
      {{$snippet: lint}}
        cd /workspace && git add -A && git diff --cached --stat && \
        git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})" && \
        git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}

      ── OUTPUT (both modes) ─────────────────────────────────────────────────
      After pushing, output ONLY this JSON on the last line (use the ACTUAL branch name you created).
      Set head_ref based on REPO_TYPE:
        REPO_TYPE=same → head_ref = "<branch-name>"  (no owner prefix)
        REPO_TYPE=fork → head_ref = "{{fork_upstream.fork_owner}}:<branch-name>"
        {"branch_pushed": "<actual-branch-name>", "head_ref": "<head_ref>", "fork_owner": "{{fork_upstream.fork_owner}}", "fork_full_name": "{{fork_upstream.fork_full_name}}", "fix_summary": "<one line: which file(s) changed and what the fix was>"}
    next: open_pr

  open_pr:
    type: tool
    integration: github
    action: open_pull_request
    label: Open pull request
    description: Open PR from fork branch back to upstream
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      title: "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
      head: "{{implement_fix.head_ref}}"
      base: "{{fork_upstream.default_branch}}"
      body: |
        Fixes #{{inputs.issue_number}}

        {{$snippet: pr_attribution}}
    next: write_memory

  write_memory:
    $use: base-autopilot.record_outcome
    key: "{{inputs.upstream_owner}}/{{inputs.upstream_repo}}"
    summary: |
      Issue #{{inputs.issue_number}}: {{fetch_issue.title}}
      PR: {{open_pr.pr_url}}
      Fix: {{implement_fix.fix_summary}}
    next: notify_slack

  notify_slack:
    type: output
    label: Notify channel
    output:
      via: slack
      slack:
        channel: "#engineering"
        message: |
          *Third-Party Autopilot Fix — PR opened*

          Repo: `{{inputs.upstream_owner}}/{{inputs.upstream_repo}}`
          Issue: #{{inputs.issue_number}} — {{fetch_issue.title}}
          PR: {{open_pr.pr_url}}

          _Generated by Conduct AI · thirdparty-autopilot-fix playbook_

test_trigger:
  payload:
    upstream_owner: "pallets"
    upstream_repo: "click"
    issue_number: "3572"
    model: claude-sonnet-4-6
