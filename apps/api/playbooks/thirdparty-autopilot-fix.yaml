name: Third-Party Autopilot Fix
version: 1
description: >
  Given an issue number on any third-party repo, fork it, clone the fork,
  read the issue, apply the fix, push a branch, and open a PR back to upstream.
  Every step is traced in the Conduct run feed.

inputs:
  upstream_owner:
    label: Upstream repo owner
    type: string
    hint: "GitHub username or org that owns the target repo"
  upstream_repo:
    label: Upstream repo name
    type: string
    hint: "Repo name only, e.g. flask"
  issue_number:
    label: Issue number
    type: string
    hint: "Issue number describing what needs to be fixed"
  model:
    label: AI model
    default: claude-sonnet-4-6
    type: select
    options:
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  manual:
    next: fetch_issue

blocks:

  fetch_issue:
    type: tool
    integration: github
    action: fetch_issue
    label: Fetch issue
    description: Pull the issue from the upstream repo
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      issue_number: "{{inputs.issue_number}}"
    next: fork_upstream

  fork_upstream:
    type: tool
    integration: github
    action: fork_repo
    label: Fork upstream repo
    description: Fork into the authenticated user's GitHub account (reuses existing fork if already present)
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
    next: implement_fix

  implement_fix:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Implement fix
    description: |
      You are a software engineer contributing to an open-source repo.
      The issue below describes what needs to be fixed. Read the repo,
      understand the codebase, implement the fix, and push the branch.
      The fork is already created — do NOT re-fork.

      Fork to clone: {{fork_upstream.fork_full_name}}
      Upstream:      {{inputs.upstream_owner}}/{{inputs.upstream_repo}}
      Fix branch:    fix/issue-{{inputs.issue_number}}
      Issue title:   {{fetch_issue.title}}

      Issue description:
      {{fetch_issue.body}}

      Do ALL of the following in ONE run_shell call:

        set -e
        rm -rf /tmp/repo
        git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /tmp/repo
        cd /tmp/repo

        # If the fork is a fresh clone (empty or not yet synced), pull from upstream first
        git remote add upstream https://github.com/{{inputs.upstream_owner}}/{{inputs.upstream_repo}}.git
        git fetch upstream --depth=50
        git merge --ff-only upstream/{{fork_upstream.default_branch}} 2>/dev/null || git reset --hard upstream/{{fork_upstream.default_branch}}

        git config user.email "bot@conductai.ai"
        git config user.name "Conduct AI"
        git checkout -b fix/issue-{{inputs.issue_number}}

        # Read the relevant files, understand the issue, and apply the fix.
        # Use python3 or direct file edits — whichever is most reliable for this repo.
        # Do NOT hardcode line numbers; search for exact patterns to replace.
        # Verify your changes compile / parse cleanly before committing.

        git add -A
        git diff --cached --stat
        git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
        git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}
        echo "PUSH_OK"

      After the shell call succeeds, output ONLY this JSON on the last line:
        {"branch_pushed": "fix/issue-{{inputs.issue_number}}", "fork_owner": "{{fork_upstream.fork_owner}}", "fork_full_name": "{{fork_upstream.fork_full_name}}"}
    next: open_pr

  open_pr:
    type: tool
    integration: github
    action: open_pull_request
    label: Open pull request
    description: Open PR from fork branch back to upstream
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      title: "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
      head: "{{implement_fix.fork_owner}}:fix/issue-{{inputs.issue_number}}"
      base: "{{fork_upstream.default_branch}}"
      body: |
        Fixes #{{inputs.issue_number}}

        This PR was generated by [Conduct AI](https://conductai.ai)'s `thirdparty-autopilot-fix` playbook.
        The full run trace is captured in the Conduct dashboard.

        ---
        *Generated by Conduct AI · thirdparty-autopilot-fix playbook · issue #{{inputs.issue_number}}*
    next: notify_slack

  notify_slack:
    type: output
    label: Notify channel
    output:
      via: slack
      slack:
        channel: "#engineering"
        message: |
          *Third-Party Autopilot Fix — PR opened*

          Repo: `{{inputs.upstream_owner}}/{{inputs.upstream_repo}}`
          Issue: #{{inputs.issue_number}} — {{fetch_issue.title}}
          PR: {{open_pr.pr_url}}

          _Generated by Conduct AI thirdparty-autopilot-fix playbook_

test_trigger:
  payload:
    upstream_owner: "elementalsouls"
    upstream_repo: "sample-app"
    issue_number: 42
    model: claude-sonnet-4-6
