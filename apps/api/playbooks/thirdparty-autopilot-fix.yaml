name: Third-Party Autopilot Fix
version: 2
description: >
  Given an issue number on any third-party repo, fork it, provision a sandbox,
  clone the fork once, apply the fix, push a branch, and open a PR back to upstream.
  Every step is traced in the Conduct run feed.

inputs:
  upstream_owner:
    label: Upstream repo owner
    type: string
    hint: "GitHub username or org that owns the target repo"
  upstream_repo:
    label: Upstream repo name
    type: string
    hint: "Repo name only, e.g. flask"
  issue_number:
    label: Issue number
    type: string
    hint: "Issue number describing what needs to be fixed"
  sandbox_provider:
    label: Sandbox provider
    type: select
    default: e2b
    options:
      - e2b
      - modal
      - local
    hint: "Compute environment for the fix. Requires matching credentials in Settings → Environments."
  model:
    label: AI model
    default: claude-sonnet-4-6
    type: select
    options:
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  manual:
    next: fetch_issue

blocks:

  fetch_issue:
    type: tool
    integration: github
    action: fetch_issue
    label: Fetch issue
    description: Pull the issue from the upstream repo
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      issue_number: "{{inputs.issue_number}}"
    next: fork_upstream

  fork_upstream:
    type: tool
    integration: github
    action: fork_repo
    label: Fork upstream repo
    description: Fork into the authenticated user's GitHub account (reuses existing fork if already present)
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
    next: provision_sandbox

  provision_sandbox:
    type: sandbox
    label: Provision sandbox
    sandbox_config:
      provider: "{{inputs.sandbox_provider}}"
      setup:
        - git config --global user.email "bot@conductai.ai"
        - git config --global user.name "Conduct AI"
        - git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /workspace
        - cd /workspace && git remote add upstream https://github.com/{{inputs.upstream_owner}}/{{inputs.upstream_repo}}.git
        - cd /workspace && git fetch upstream --depth=50
        - cd /workspace && git merge --ff-only upstream/{{fork_upstream.default_branch}} 2>/dev/null || git reset --hard upstream/{{fork_upstream.default_branch}}
        - cd /workspace && git checkout -b fix/issue-{{inputs.issue_number}}
    next: implement_fix

  implement_fix:
    type: brain
    runs_in: provision_sandbox
    mode: agentic
    model: "{{inputs.model}}"
    label: Implement fix
    description: |
      You are a software engineer contributing to an open-source project.
      The repo is already cloned at /workspace on the fix branch.
      Do NOT clone, fork, or create branches — that is already done.

      Your only job: read the issue, understand the codebase, and apply the fix.

      Upstream:    {{inputs.upstream_owner}}/{{inputs.upstream_repo}}
      Fix branch:  fix/issue-{{inputs.issue_number}}
      Issue title: {{fetch_issue.title}}

      Issue description:
      {{fetch_issue.body}}

      Instructions:
      - Work in /workspace
      - Read relevant files first, understand the code before editing
      - Do NOT hardcode line numbers — search for exact patterns to replace
      - Verify your changes parse/compile cleanly after editing
      - When done: cd /workspace && git add -A && git diff --cached --stat
      - Then commit: git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
      - Then push: git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}

      After pushing, output ONLY this JSON on the last line:
        {"branch_pushed": "fix/issue-{{inputs.issue_number}}", "fork_owner": "{{fork_upstream.fork_owner}}", "fork_full_name": "{{fork_upstream.fork_full_name}}"}
    next: open_pr

  open_pr:
    type: tool
    integration: github
    action: open_pull_request
    label: Open pull request
    description: Open PR from fork branch back to upstream
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      title: "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})"
      head: "{{implement_fix.fork_owner}}:fix/issue-{{inputs.issue_number}}"
      base: "{{fork_upstream.default_branch}}"
      body: |
        Fixes #{{inputs.issue_number}}

        This PR was generated by [Conduct AI](https://conductai.ai)'s `thirdparty-autopilot-fix` playbook.
        The full run trace is captured in the Conduct dashboard.

        ---
        *Generated by Conduct AI · thirdparty-autopilot-fix playbook · issue #{{inputs.issue_number}}*
    next: notify_slack

  notify_slack:
    type: output
    label: Notify channel
    output:
      via: slack
      slack:
        channel: "#engineering"
        message: |
          *Third-Party Autopilot Fix — PR opened*

          Repo: `{{inputs.upstream_owner}}/{{inputs.upstream_repo}}`
          Issue: #{{inputs.issue_number}} — {{fetch_issue.title}}
          Sandbox: {{inputs.sandbox_provider}}
          PR: {{open_pr.pr_url}}

          _Generated by Conduct AI thirdparty-autopilot-fix playbook_

test_trigger:
  payload:
    upstream_owner: "elementalsouls"
    upstream_repo: "sample-app"
    issue_number: 42
    sandbox_provider: e2b
    model: claude-sonnet-4-6
