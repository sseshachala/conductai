extends: base-autopilot
name: Third-Party Autopilot Fix
version: 12
description: >
  Given an issue number on any third-party repo (any language), fork it, apply
  the fix, push a branch, and open a PR back to upstream.
  plan_fix classifies complexity; the executor transparently routes to a sandbox
  (E2B or Modal) for medium/large fixes, proxy for small — no canvas routing blocks.
  Auto-detects the repo's linter. Reads fix history before starting, writes
  a summary after success so every subsequent run on the same repo gets smarter.

inputs:
  upstream_owner:
    label: Upstream repo owner
    type: string
    hint: "GitHub username or org that owns the target repo"
  upstream_repo:
    label: Upstream repo name
    type: string
    hint: "Repo name only, e.g. click"
  issue_number:
    label: Issue number
    type: string
    hint: "Issue number describing what needs to be fixed"
  model:
    label: AI model
    default: claude-sonnet-4-6
    type: select
    options:
      - claude-sonnet-4-6
      - claude-opus-4-7

on:
  manual:
    next: fetch_issue

blocks:

  fetch_issue:
    type: tool
    integration: github
    action: fetch_issue
    label: Fetch issue
    description: Pull the issue from the upstream repo
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
      issue_number: "{{inputs.issue_number}}"
    next: fork_upstream

  fork_upstream:
    type: tool
    integration: github
    action: fork_repo
    label: Fork upstream repo
    description: Fork into the authenticated user's GitHub account (reuses existing fork if already present)
    params:
      owner: "{{inputs.upstream_owner}}"
      repo: "{{inputs.upstream_repo}}"
    next: read_memory

  read_memory:
    $use: base-autopilot.recall_context
    key: "{{fetch_issue.owner}}/{{fetch_issue.repo}}"
    next: plan_fix

  plan_fix:
    $use: base-autopilot.plan_fix
    next: search_code

  search_code:
    $use: base-autopilot.search_code
    next: implement_fix

  implement_fix:
    type: brain
    mode: agentic
    sandbox: auto
    model: "{{inputs.model}}"
    max_turns: 25  # floor — executor overrides with agent_config.yaml turn_budgets[plan_fix.complexity]
    label: Implement fix
    description: |
      You are implementing a targeted code fix. The plan is already done.
      Your ONLY job: make ONE run_shell call with a complete script. Nothing else.

      ── THE PLAN (do not re-derive) ──────────────────────────────────────────
      Files:    {{plan_fix.files}}
      Approach: {{plan_fix.approach}}
      Grep:     {{plan_fix.grep_pattern}}
      Base branch: {{plan_fix.base_branch}} (use this branch as the fix base; if "default", use {{fork_upstream.default_branch}})

      ── PRIOR CONTEXT (read carefully and adjust your approach) ─────────────
      {{read_memory.entries}}

      Rules from prior context:
      1. If a prior entry shows OUTCOME: failed for this issue/area, do NOT repeat the same approach — try a different file or strategy.
      2. If a prior entry succeeded with a known pattern (test runner, file layout, lint setup), reuse it instead of re-discovering.
      3. If a prior entry mentions a specific gotcha (token scope, branch protection, flaky test), preempt it.

      ── YOUR ONE SHELL CALL ───────────────────────────────────────────────────
      Fill in the FIX SECTION below and run it as a single run_shell call.
      The script auto-detects its mode — do NOT make a separate detection call.

      {{$snippet: token_check_fork}}
      If git push returns 403 at any point, output the failure JSON immediately and stop — do NOT retry.

        git config --global user.email "bot@conductai.ai" && \
        git config --global user.name "Conduct AI" && \
        BASE_BRANCH="{{plan_fix.base_branch}}" && \
        if [ "$BASE_BRANCH" = "default" ] || [ -z "$BASE_BRANCH" ]; then BASE_BRANCH="{{fork_upstream.default_branch}}"; fi && \
        if [ -d /workspace/.git ]; then
          cd /workspace
        elif [ -w /workspace ] || mkdir -p /workspace 2>/dev/null; then
          git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /workspace && \
          cd /workspace && \
          git remote add upstream https://github.com/{{fetch_issue.owner}}/{{fetch_issue.repo}}.git && \
          git fetch upstream "$BASE_BRANCH" --depth=50 && \
          git checkout -b fix/issue-{{inputs.issue_number}} && \
          git reset --hard upstream/"$BASE_BRANCH"
        else
          git clone https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git /tmp/repo && \
          cd /tmp/repo && \
          git remote add upstream https://github.com/{{fetch_issue.owner}}/{{fetch_issue.repo}}.git && \
          git fetch upstream "$BASE_BRANCH" --depth=50 && \
          git checkout -b fix/issue-{{inputs.issue_number}} && \
          git reset --hard upstream/"$BASE_BRANCH"
        fi && \
        \
        # ── LOCATE TARGET FILES (any codebase, any branch) ───────────────────
        # search_code covers default branch only — fall back to in-repo grep
        TARGETS="{{search_code.paths}}" && \
        if [ -z "$TARGETS" ]; then \
          TARGETS=$(grep -rln "{{plan_fix.grep_pattern}}" . \
            --include="*.py" --include="*.toml" --include="*.cfg" \
            --include="*.txt" --include="*.go" --include="*.js" \
            --include="*.ts" --include="*.tsx" --include="*.jsx" \
            --include="*.rb" --include="*.java" --include="*.cs" \
            --include="*.cpp" --include="*.c" --include="*.h" \
            --include="*.rs" --include="*.swift" --include="*.kt" \
            --include="*.html" --include="*.json" --include="*.yaml" --include="*.yml" \
            --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir="vendor" \
            2>/dev/null | head -5); \
          echo "search_code empty — in-repo grep found: $TARGETS"; \
        fi && \
        echo "Target files: $TARGETS" && \
        \
        # ── FIX SECTION ── fill this in based on the plan above ──────────────
        # Approach: {{plan_fix.approach}}
        # Target files are in $TARGETS — verified to exist in this repo and branch.
        # Read the file inline if needed: python3 -c "c=open('file.py').read(); open('file.py','w').write(c.replace(...))"
        # Or use sed: sed -i 's/old/new/' $TARGETS
        <YOUR INLINE FIX HERE — operate on $TARGETS, no separate exploration calls> && \
        # ── END FIX SECTION ───────────────────────────────────────────────────
        \
        (if [ -f .pre-commit-config.yaml ]; then pre-commit run --all-files 2>/dev/null || true; \
        elif [ -f pyproject.toml ] || [ -f ruff.toml ]; then ruff check --fix . 2>/dev/null; ruff format . 2>/dev/null || true; \
        elif [ -f package.json ]; then npx eslint --fix . 2>/dev/null || true; fi) && \
        git add -A && git diff --cached --stat && \
        git commit -m "fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})" && \
        git push https://$GIT_TOKEN@github.com/{{fork_upstream.fork_full_name}}.git fix/issue-{{inputs.issue_number}}

      ── OUTPUT ───────────────────────────────────────────────────────────────
      After pushing, output ONLY this JSON on the last line.
      Set head_ref based on REPO_TYPE:
        REPO_TYPE=same → head_ref = "<branch-name>"
        REPO_TYPE=fork → head_ref = "{{fork_upstream.fork_owner}}:<branch-name>"

      ON SUCCESS:
        {"branch_pushed": "<actual-branch-name>", "head_ref": "<head_ref>", "base_branch": "<the resolved BASE_BRANCH value>", "fork_owner": "{{fork_upstream.fork_owner}}", "fork_full_name": "{{fork_upstream.fork_full_name}}", "fix_summary": "<one line: which file(s) changed and what the fix was>", "lesson": "<one line: what to know for future fixes in this repo>"}

      ON FAILURE (token/push/build error — anything that prevents a clean push):
        {"branch_pushed": null, "error": "<one line: what failed and why>", "fix_summary": "attempted: <approach>", "lesson": "<one line: what to avoid next time>"}
    next: implement_succeeded

  implement_succeeded:
    type: logic
    label: Did implement_fix succeed?
    condition: "{{implement_fix.branch_pushed}} != null"
    next:
      pass: open_pr
      fail: write_memory_failure

  open_pr:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Open pull request
    description: |
      Open a PR from the pushed branch to the upstream repo via the GitHub API.
      Capture both success and failure cleanly — do not let HTTP errors raise.

      Repo:  {{fetch_issue.owner}}/{{fetch_issue.repo}}
      Head:  {{implement_fix.head_ref}}
      Base:  {{implement_fix.base_branch}}
      Title: fix: {{fetch_issue.title}} (closes #{{inputs.issue_number}})

      In ONE run_shell call, POST to:
        https://api.github.com/repos/{{fetch_issue.owner}}/{{fetch_issue.repo}}/pulls
      Headers: Authorization: token $GIT_TOKEN, Content-Type: application/json
      Body: {"title": "<above>", "head": "{{implement_fix.head_ref}}",
             "base": "{{implement_fix.base_branch}}",
             "body": "Fixes #{{inputs.issue_number}}\n\n{{$snippet: pr_attribution}}"}

      Output ONLY one of these JSON lines:
      ON SUCCESS (HTTP 201): {"pr_url": "<html_url from response>"}
      ON FAILURE (any non-2xx): {"pr_url": null, "error": "<HTTP status + brief reason from response.message>"}
    next: pr_opened

  pr_opened:
    type: logic
    label: PR opened?
    condition: "{{open_pr.pr_url}} != null"
    next:
      pass: write_memory
      fail: write_memory_failure

  write_memory:
    $use: base-autopilot.record_outcome
    key: "{{fetch_issue.owner}}/{{fetch_issue.repo}}"
    summary: |
      Issue #{{inputs.issue_number}}: {{fetch_issue.title}}
      OUTCOME: success — PR opened, pending review
      PR: {{open_pr.pr_url}}
      Complexity: {{plan_fix.complexity}} | Prior fixes on this repo: {{read_memory.count}}
      Files: {{plan_fix.files}}
      Approach: {{plan_fix.approach}}
      Fix: {{implement_fix.fix_summary}}
      Lesson: {{implement_fix.lesson}}
    next: notify_slack

  write_memory_failure:
    $use: base-autopilot.record_outcome
    key: "{{fetch_issue.owner}}/{{fetch_issue.repo}}"
    summary: |
      Issue #{{inputs.issue_number}}: {{fetch_issue.title}}
      OUTCOME: failed — implement_fix or open_pr did not complete
      Complexity: {{plan_fix.complexity}} | Prior fixes on this repo: {{read_memory.count}}
      Files: {{plan_fix.files}}
      Approach: {{plan_fix.approach}}
      Error (implement_fix): {{implement_fix.error}}
      Error (open_pr): {{open_pr.error}}
      Lesson: {{implement_fix.lesson}}
    next: notify_failure

  notify_failure:
    type: output
    label: Notify failure
    output:
      via: slack
      slack:
        channel: "#engineering"
        message: |
          ❌ Conduct AI could not fix issue #{{inputs.issue_number}} in {{fetch_issue.owner}}/{{fetch_issue.repo}}
          Error: {{implement_fix.error}}
          Lesson recorded for future runs.

  notify_slack:
    type: output
    label: Notify channel
    output:
      via: slack
      slack:
        channel: "#engineering"
        approval: false

test_trigger:
  payload:
    upstream_owner: "pallets"
    upstream_repo: "click"
    issue_number: "3572"
    model: claude-sonnet-4-6
