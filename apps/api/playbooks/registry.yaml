# Marketplace registry — one entry per playbook.
# Adding a new playbook to the marketplace only requires editing this file.
#
# Fields per entry:
#   file:         YAML filename in this directory
#   icon:         emoji shown in the marketplace card
#   category:     grouping header in the UI
#   tags:         filter chips
#   featured:     true = shown in Featured section
#   description:  one-line card copy
#   bundled_with: (optional) module slug this playbook ships with
#   github_events:(optional) list of GitHub webhook events that trigger this playbook

playbooks:
  autopilot_full:
    file: autopilot.yaml
    icon: "🤖"
    category: Issue to PR
    tags: [github, code]
    featured: true
    description: "GitHub issue labeled → implement fix → run tests with retry → open PR."
    github_events: [issues]

  autopilot_approved:
    file: autopilot-approved.yaml
    icon: "✋"
    category: Issue to PR
    tags: [github, code, approval]
    featured: true
    description: "Implement fix → run tests → human approves in Slack → open PR. Nothing ships without a gate."
    github_events: [issues]

  thirdparty_autopilot_fix:
    file: thirdparty-autopilot-fix.yaml
    icon: "🔀"
    category: Issue to PR
    tags: [github, code, oss]
    featured: true
    description: "Issue on any third-party repo → AI forks it, clones the fork, reads the issue, applies the fix, and opens a PR back to upstream. Works on any public repo."

  codebase_guard_monitor:
    file: codebase-guard-monitor.yaml
    icon: "🛡️"
    category: Code Review
    tags: [github, security, governance, code-review]
    featured: true
    description: "Every PR scanned for security violations by ConductGuard. Blocks high-risk PRs, creates fix issues, triggers Autopilot to remediate. Dogfoods Guard on the codebase itself."
    github_events: [pull_request]

  ai_risk_assessment:
    file: ai-risk-assessment.yaml
    icon: "🛡️"
    category: AI Governance
    tags: [governance, compliance, security, manual]
    featured: true
    description: "Pre-deploy AI governance checklist. Surfaces risks, sets data boundaries, defines human controls, and generates a one-page incident response plan before you roll out any AI tool."

  ai_output_auditor:
    file: ai-output-auditor.yaml
    icon: "📊"
    category: AI Governance
    tags: [governance, compliance, scheduled, slack]
    featured: true
    description: "Weekly AI output audit — samples team usage, scores quality and bias signals, posts governance scorecard to Slack."

  ai_drift_detector:
    file: ai-drift-detector.yaml
    icon: "📡"
    category: AI Governance
    tags: [governance, compliance, scheduled, monitoring]
    featured: true
    description: "Daily drift detection — monitors AI usage patterns, flags policy violation spikes, budget anomalies, and shadow usage. Silent on healthy days, alerts only when thresholds are breached."

  ai_incident_drill:
    file: ai-incident-drill.yaml
    icon: "🚨"
    category: AI Governance
    tags: [governance, compliance, manual, incident-response]
    featured: true
    description: "Quarterly AI incident drill — simulates a realistic governance failure scenario, scores your team's readiness against the response plan, and posts a gap analysis to Slack."

  release_gating:
    file: release-gating.yaml
    icon: "🚦"
    category: Release Management
    tags: [github, release, approval]
    featured: true
    description: "Run the full readiness check, pause for human go/no-go in Slack, then create the git tag and publish release notes — only on explicit approval."

  incident_responder:
    file: incident-responder.yaml
    icon: "🔥"
    category: Incidents & Ops
    tags: [ops, notifications]
    featured: false
    description: "Alert fires → AI correlates recent commits and deploys → posts root cause hypothesis to #incidents."

  postmortem_drafter:
    file: postmortem-drafter.yaml
    icon: "📋"
    category: Incidents & Ops
    tags: [ops, docs]
    featured: true
    description: "Incident resolved → AI reads the timeline, alerts, and commits → drafts a structured postmortem with root cause and action items."

  terraform_reviewer:
    file: terraform-reviewer.yaml
    icon: "🏗️"
    category: Platform & Infra
    tags: [github, infra, security]
    featured: true
    description: "Terraform plan PR opened → AI reviews for security misconfigs, cost anomalies, and drift from approved patterns → posts structured findings."
    github_events: [pull_request]

  multi_env_smoke_test:
    file: multi-env-smoke-test.yaml
    icon: "🌐"
    category: Testing
    tags: [ci, ops, fleet]
    featured: true
    description: "Smoke-test staging, prod, and canary in one run. Diffs results to distinguish env-specific failures from universal ones."

  network_diagnosis_agent:
    file: network-diagnosis-agent.yaml
    icon: "🛰️"
    category: Network Ops
    tags: [network, autonomy, governance, demo]
    featured: true
    description: "Autonomous NetOps agent diagnoses a synthetic Branch-42 incident (Aruba/Juniper). Executes reversible remediations; policy-modifying attempts (ACL/firewall) are blocked by Guard and routed to human approval. Bounded autonomy in action."

  compromised_support_agent:
    file: compromised-support-agent.yaml
    icon: "🎫"
    category: Support Ops
    tags: [support, prompt-injection, autonomy, governance, demo]
    featured: true
    description: "Autonomous support agent picks up a customer ticket containing a prompt-injection payload. Attempts credential harvest, HTTP exfil, and DNS tunneling — all blocked by Guard's hook-surface rules. Falls back to a legit L2 escalation. Bounded autonomy under adversarial input."

  self_driving_network_approval_demo:
    file: self-driving-network-approval-demo.yaml
    icon: "🛰️"
    category: Network Ops
    tags: [approval, governance, demo, network, aruba, juniper, hitl]
    featured: true
    description: "Self-driving network agent (Aruba Central + Juniper Mist) detects a BGP flap + DFS radar event, drafts a synchronized multi-fabric config push. Guard's approve-prod-deploy rule intercepts the shell command, pauses the run, fires a Slack Approve/Reject post. Approved → both fabrics converge; rejected → run halts. One rule, one click, hash-chained audit."

  nemo_guardrails_demo:
    file: nemo-guardrails-demo.yaml
    icon: "🛡️"
    category: AI Governance
    tags: [governance, demo, nemo, guardrails, trism, prompt-injection]
    featured: true
    description: "5-beat live demo of Conduct as the DETECT & ENFORCE layer at L4 AI RUNTIME TRUST. NeMo-style input rail → guard_check → real block on a prompt-injection payload → hash-chained audit row. ~90 seconds."

# GitHub events Conduct listens for globally (union of all playbook github_events above).
# Used when registering a repo webhook so GitHub sends everything and we filter in the handler.
all_github_events:
  - issues
  - pull_request
  - push
  - issue_comment
  - create
  - workflow_run
  - repository_vulnerability_alert
  - dependabot_alert
  - pull_request_review
  - pull_request_review_comment
