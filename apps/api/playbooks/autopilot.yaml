# ──────────────────────────────────────────────────────────────────────────────
# autopilot — GitHub issues
#
# Original Python seed (apps/api/seed_autopilot.py) lifted into the YAML DSL
# without behaviour changes. The Brain blocks still operate on the worker host
# (no `runs_on:` declared), matching the original. To run the work on an
# ephemeral droplet instead, mirror the pattern in ai_ready.yaml — same nodes,
# add create_droplet/wait_droplet, set runs_on on each brain block, and put a
# destroy_droplet under `cleanup:`.
# ──────────────────────────────────────────────────────────────────────────────
name: Autopilot — GitHub Issues
version: 1
description: >
  Watch for GitHub issues labeled `autopilot ready`, implement the fix, run
  tests (with inline retry), open a PR. Same flow as the original seed.

inputs:
  trigger_label:
    label: Trigger label
    default: autopilot ready
    type: select
    options:
      - autopilot ready
      - ai_pilot_ready
      - ai_ready
  model:
    label: AI Model
    default: claude-haiku-4-5-20251001
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6
      - claude-opus-4-7
  clone_depth:
    label: Clone depth
    default: "1"
    type: select
    options:
      - "1"
      - "0"
    hint: "1 = fast (recommended), 0 = full history"

on:
  github.issue_labeled:
    integration: github
    labels:
      - "{{inputs.trigger_label}}"
    label_mode: one_of
    next: fetch_issue

blocks:
  fetch_issue:
    type: tool
    integration: github
    action: fetch_issue
    label: Fetch issue
    description: Get full issue title, body, and metadata
    params:
      owner: "{{_trigger.repo_owner}}"
      repo: "{{_trigger.repo_name}}"
      issue_number: "{{_trigger.issue_number}}"
    next: implement_fix

  implement_fix:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Implement fix
    description: |
      You are an expert software engineer.
      A GitHub issue has been labeled 'autopilot ready'.

      Issue title: {{fetch_issue.title}}
      Issue body: {{fetch_issue.body}}
      Repo: {{_trigger.repo_full_name}}
      Clone URL: {{_trigger.clone_url}}

      CRITICAL: Each run_shell call gets a FRESH container — do ALL git work in a
      SINGLE run_shell call. Do NOT split across multiple calls — /tmp is gone after each call.
      You MUST push the branch to the remote before this block finishes.

      Do ALL of the following in ONE run_shell call:
      - rm -rf /tmp/repo
      - git clone --depth {{inputs.clone_depth}} https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git /tmp/repo
      - cd /tmp/repo && git config user.email "bot@conductai.ai" && git config user.name "Conduct AI"
      - git checkout -b autopilot/issue-{{fetch_issue.issue_number}}
      - Read relevant files to understand the codebase (use read_file tool if needed, then come back to one final run_shell)
      - Apply the fix with python3/sed inline in the script
      - git add -A && git commit -m "fix: <short description> (closes #{{fetch_issue.issue_number}})"
      - git push https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git autopilot/issue-{{fetch_issue.issue_number}}

      Output ONLY the following JSON on the last line of your response:
        {"branch_name": "autopilot/issue-{{fetch_issue.issue_number}}", "summary": "<brief description of changes>"}
    next: run_tests

  run_tests:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Run tests & fix
    description: |
      IMPORTANT: This is a fresh sandbox — there is no pre-existing repo directory.
      You must clone the branch that was pushed by the previous step.

      Repo: {{_trigger.repo_full_name}}
      Branch to test: {{implement_fix.branch_name}}

      CRITICAL: Each run_shell call gets a FRESH container — do ALL of the following
      in a SINGLE run_shell call (clone → test → fix → push):

      - git clone --branch {{implement_fix.branch_name}} https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git /tmp/repo
      - cd /tmp/repo && git config user.email "bot@conductai.ai" && git config user.name "Conduct AI"
      - Detect test runner (check package.json / requirements.txt / go.mod)
      - Run tests; if they fail: patch code inline, re-run (up to 3 attempts total)
      - If any fixes were committed:
          git add -A && git commit -m "fix: address test failures"
          git push https://$GIT_TOKEN@github.com/{{_trigger.repo_full_name}}.git {{implement_fix.branch_name}}
      - After up to 3 fix attempts, stop regardless of outcome

      Output as JSON on the final line:
        {"passed": true/false, "attempts": <number>,
         "output": "<brief summary of test results>"}
    next: tests_pass

  tests_pass:
    type: logic
    label: Tests pass?
    condition: "{{run_tests.passed}} == true"
    next:
      pass: push_pr
      fail: notify_failure

  push_pr:
    type: brain
    mode: agentic
    model: "{{inputs.model}}"
    label: Push & open PR
    description: |
      IMPORTANT: This is a fresh sandbox. The branch is already pushed to the remote —
      do NOT clone the repo. Open the PR directly via the GitHub API.

      Repo: {{_trigger.repo_full_name}}
      Branch: {{implement_fix.branch_name}}
      Base: {{_trigger.default_branch}}

      1. Retrieve the GitHub token from the Conduct AI credentials vault
      2. Open a PR via the GitHub API:
         POST https://api.github.com/repos/{{_trigger.repo_full_name}}/pulls
         Headers: Authorization: token $GIT_TOKEN, Content-Type: application/json
         Body: {"title": "fix: {{fetch_issue.title}} (closes #{{fetch_issue.issue_number}})",
                "head":  "{{implement_fix.branch_name}}",
                "base":  "{{_trigger.default_branch}}",
                "body":  "Automated fix by Conduct AI.\n\nCloses #{{fetch_issue.issue_number}}"}

      Output ONLY the following JSON on the last line of your response:
        {"pr_url": "<full PR URL>"}
    next: notify_success

  notify_success:
    type: output
    label: Notify PR ready
    output:
      via: slack
      slack:
        channel: "#engineering"
        approval: true

  notify_failure:
    type: output
    label: Notify failure
    output:
      via: slack
      slack:
        channel: "#engineering"

test_trigger:
  payload:
    action: labeled
    label:
      name: "[TEST] autopilot ready"
    issue:
      number: 9999
      title: "[TEST] Create conductai_test.py"
      body: |
        Create a file `conductai_test.py` in the repo root that prints:
        ```
        print("Hello, Conduct AI!")
        ```
        This is a test run — prefix the branch and PR with [TEST].
      html_url: "https://github.com/sseshachala/conductai/issues/9999"
      user:
        login: conductai-test-bot
      labels:
        - name: "[TEST] autopilot ready"
    repository:
      full_name: sseshachala/conductai
      name: conductai
      owner:
        login: sseshachala
      default_branch: main
      clone_url: "https://github.com/sseshachala/conductai.git"
    sender:
      login: conductai-test-bot
