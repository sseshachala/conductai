name: Smoke Test — Pipeline Ping
version: 1
description: >
  Minimal 1-step playbook for CI gating and queue health checks.
  Fires a single brain block that returns {"ok": true} — proves the
  full pipeline (trigger → queue → worker → LLM → done) in under 30s.
  Use this with `conduct test --all --project <name> --parallel` as a
  fast pre-deploy smoke suite instead of running heavy playbooks.

inputs:
  model:
    label: AI Model
    default: claude-haiku-4-5-20251001
    type: select
    options:
      - claude-haiku-4-5-20251001
      - claude-sonnet-4-6

on:
  manual:
    next: ping

blocks:
  ping:
    type: brain
    mode: single
    model: "{{inputs.model}}"
    label: Ping
    description: |
      You are a smoke test agent. Reply with exactly this JSON and nothing else:
      {"ok": true, "message": "pipeline ok", "repo": "{{_trigger.repo_full_name}}"}
    next: done

  done:
    type: output
    label: Done
    description: "Smoke test passed: {{ping.message}}"
    output:
      via: slack
      slack:
        channel: "#ops"

test_trigger:
  payload:
    repo_full_name: "sseshachala/conductai-testbed-node"
    repo_owner: "sseshachala"
    repo_name: "conductai-testbed-node"
    clone_url: "https://github.com/sseshachala/conductai-testbed-node.git"
    repository:
      full_name: "sseshachala/conductai-testbed-node"
      name: "conductai-testbed-node"
      owner:
        login: "sseshachala"
      default_branch: "main"
      clone_url: "https://github.com/sseshachala/conductai-testbed-node.git"
