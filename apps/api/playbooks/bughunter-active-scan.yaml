# ──────────────────────────────────────────────────────────────────────────────
# bughunter-active-scan — dynamic vulnerability hunt via Claude-BugHunter
#
# Discovers hunt-* skills from a configurable skills repo at runtime — no YAML
# update needed when new skills are added. Works with public or private repos.
# ──────────────────────────────────────────────────────────────────────────────
name: BugHunter Active Scan
version: 4
description: >
  Dynamically discovers and runs skills from a configurable GitHub repo
  (default: elementalsouls/Claude-BugHunter). skill_scope selects hunt-* only,
  all skills (enterprise chains, redteam, mobile, reporting), or a custom
  list. New skills are picked up automatically — no playbook update required.

inputs:
  target_repo:
    label: Target GitHub Repo
    type: string
    placeholder: "owner/repo"
    description: GitHub repository to scan (owner/repo format).

  target_url:
    label: Target URL (optional)
    type: string
    placeholder: "https://api.example.com"
    description: Optional web-facing surface to scan alongside the repo.
    required: false

  skills_repo:
    label: BugHunter Skills Repo
    type: string
    default: "elementalsouls/Claude-BugHunter"
    description: >
      GitHub repo containing hunt-* skill definitions. Use the default for the
      public Claude-BugHunter skills, or point to your own fork / private repo.

  severity_threshold:
    label: Min Severity to Emit
    type: select
    default: high
    options:
      - critical
      - high
      - medium
      - low
    description: Only emit findings at or above this severity into the pipeline.

  skill_scope:
    label: Skill scope
    type: select
    default: hunt-only
    options:
      - hunt-only
      - all
      - custom
    description: >
      hunt-only = classic hunt-* web/app vuln skills. all = every skill in the
      bundle (adds enterprise chains, redteam, mobile pipelines, reporting).
      custom = use skill_filter list below.

  skill_filter:
    label: Skill filter (custom scope only)
    type: string
    placeholder: "hunt-llm-ai, okta-attack, m365-entra-attack"
    description: >
      Comma-separated skill names. Only applied when skill_scope = custom.
    required: false

  label_filter:
    label: Label to apply to GitHub issues for autopilot pickup
    default: "autopilot-ready"
    type: string

  model:
    label: AI Model
    type: select
    default: claude-sonnet-4-6
    options:
      - claude-sonnet-4-6
      - claude-opus-4-7
    description: Sonnet is recommended — hunts require multi-step reasoning.

on:
  manual:
    next: read_memory

blocks:
  read_memory:
    type: memory
    label: Recall prior scan context
    action: read
    scope: repo
    limit: 5
    key: "{{inputs.target_repo}}"
    next: discover_skills

  # ── 1. Discover skills from upstream repo ───────────────────────────────────
  # ponytail: single GitHub REST call for a deterministic skill list. If the
  # repo layout ever changes (skills/ moves), swap the URL below.
  discover_skills:
    type: brain
    model: claude-haiku-4-5-20251001
    next: recon
    credentials:
      github: github
    system: |
      You are turning a GitHub directory listing into a skill catalog.
      Do not invent skills — only report what the API returns.
      Use the GitHub credential if the repo is private.
    prompt: |
      Fetch: https://api.github.com/repos/{{ inputs.skills_repo }}/contents/skills

      Every entry with "type": "dir" is a skill. For each skill dir:
        - name = entry.name
        - description = ""       (recon will prioritize by name)
        - key_patterns = []

      Apply scope filter ({{ inputs.skill_scope }}):
      {% if inputs.skill_scope == 'hunt-only' %}
      Keep only skills whose name starts with "hunt-".
      {% elif inputs.skill_scope == 'custom' %}
      Keep only these skill names: {{ inputs.skill_filter | default('') }}
      If skill_filter is empty, return [].
      {% else %}
      Keep every skill dir (all scope).
      {% endif %}

      Return ONLY a JSON array on the last line:
      [{"name":"hunt-llm-ai","description":"","key_patterns":[]}]

  # ── 2. Recon ─────────────────────────────────────────────────────────────────
  recon:
    type: brain
    mode: agentic
    model: "{{ inputs.model }}"
    next: run_hunts
    system: |
      You are a security researcher preparing a targeted vulnerability hunt.
      Examine the target repository and produce a recon brief that will be
      used to focus each hunt skill on the most relevant attack surfaces.
    prompt: |
      Target repo: {{ inputs.target_repo }}
      {% if inputs.target_url %}Target URL: {{ inputs.target_url }}{% endif %}
      Skills to run: {{ discover_skills.output }}

      Examine the repository and produce a recon brief covering:
      1. Tech stack (check package.json, requirements.txt, go.mod, Cargo.toml, pyproject.toml)
      2. Authentication mechanism(s) — JWT, OAuth, session, API key
      3. AI/LLM surface — openai, anthropic, langchain, mcp keywords
      4. Cloud provider signals — AWS, GCP, Azure in config files
      5. GraphQL or WebSocket presence
      6. CI/CD setup — .github/workflows/ contents
      7. Which discovered skills are most likely to yield findings and why

      Output the recon brief as plain text. Be specific — name actual files
      and code paths where relevant attack surfaces exist.

      On the very last line, output a JSON summary:
      {"tech_stack": ["python", "fastapi"], "auth": "jwt", "ai_surface": true, "top_skills": ["hunt-llm-injection"]}

  # ── 3. Run all hunt skills dynamically ──────────────────────────────────────
  run_hunts:
    type: brain
    mode: agentic
    model: "{{ inputs.model }}"
    next: collect_findings
    credentials:
      github: github
    system: |
      You are a security researcher executing a structured vulnerability hunt.
      You have a list of hunt skills and a recon brief. For each skill, fetch
      its full definition from the skills repo (may be private — use the GitHub
      credential), then apply it to the target.

      Rules:
      - Run every skill in the discovered list sequentially
      - For each skill, read its definition from the skills repo before running —
        do not rely on prior knowledge of the skill content
      - Use the GitHub credential to access private repos for both the skills
        repo and the target repo
      - Only report findings you are >80% confident are real vulnerabilities
      - Skip a skill if the recon brief shows no relevant attack surface
      - Output a single JSON array across all skills — do not split by skill

      Recon brief:
      {{ recon.output }}
    prompt: |
      Target repo: {{ inputs.target_repo }}
      {% if inputs.target_url %}Target URL: {{ inputs.target_url }}{% endif %}
      Skills repo: {{ inputs.skills_repo }}

      Skills to execute:
      {{ discover_skills.output }}

      For each skill:
      1. Fetch its full definition from https://github.com/{{ inputs.skills_repo }}
      2. Apply it to the target repo/URL using the recon brief as context
      3. Record confirmed findings

      Return ALL findings as a single JSON array on the last line:
      [{"skill":"hunt-llm-injection","severity":"high","type":"injection","endpoint_or_file":"api/chat.py","description":"...","suggested_fix":"...","evidence":"...","cwe":"CWE-77"}]

      If no findings, return: []

  # ── 4. Deduplicate and filter ────────────────────────────────────────────────
  collect_findings:
    type: brain
    model: claude-haiku-4-5-20251001
    next: emit_to_security_loop
    system: |
      You are aggregating security findings from a multi-skill vulnerability hunt.
      Deduplicate findings that refer to the same vulnerability in the same file.
      Filter to only include findings at or above the severity threshold.
    prompt: |
      Raw findings from all hunt skills:
      {{ run_hunts.output }}

      Severity threshold: {{ inputs.severity_threshold }}
      Skills run: {{ discover_skills.output | length }} skills discovered

      1. Remove exact duplicates (same type + same endpoint_or_file)
      2. Merge near-duplicates (same vulnerability, different evidence — keep the richer one)
      3. Drop findings below severity threshold
      4. Add field "skill" if missing

      Return deduplicated JSON array on the last line:
      [{"skill":"hunt-llm-injection","severity":"high","type":"injection","endpoint_or_file":"api/chat.py","description":"...","suggested_fix":"...","evidence":"...","cwe":"CWE-77"}]
      If nothing passes, return: []

  # ── 5. Emit to Security Loop ─────────────────────────────────────────────────
  emit_to_security_loop:
    type: tool
    action: conduct/emit_finding
    for_each: "{{ collect_findings.output }}"
    next: create_github_issue
    input:
      tool: bughunter
      severity: "{{ item.severity }}"
      type: "{{ item.type }}"
      description: "{{ item.description }}"
      file: "{{ item.endpoint_or_file }}"
      suggested_fix: "{{ item.suggested_fix | default('') }}"
      repo_full_name: "{{ inputs.target_repo }}"
      source_run_id: "{{ _run.id | default('bughunter') }}"

  # ── 6. Create GitHub issue for team visibility ───────────────────────────────
  create_github_issue:
    type: mcp
    for_each: "{{ collect_findings.output }}"
    next: write_memory
    config:
      server_name: github
      tool_name: create_issue
      inputs:
        owner: "{{ inputs.target_repo.split('/')[0] }}"
        repo: "{{ inputs.target_repo.split('/')[1] }}"
        title: "[{{ item.severity | upper }}] {{ item.type }} in {{ item.endpoint_or_file }}"
        body: |
          ## Security Finding — {{ item.type }}

          **Severity:** {{ item.severity }}
          **Skill:** {{ item.skill }}
          **CWE:** {{ item.cwe | default('N/A') }}
          **Location:** `{{ item.endpoint_or_file }}`

          ### Description
          {{ item.description }}

          ### Suggested Fix
          {{ item.suggested_fix }}

          ### Evidence
          {{ item.evidence }}

          ---
          *Found by BugHunter Active Scan via [Conduct](https://conductai.ai)*
        labels:
          - security
          - "severity-{{ item.severity }}"
          - bughunter
          - "{{inputs.label_filter}}"

  write_memory:
    type: memory
    label: Record scan outcome
    action: write
    scope: repo
    key: "{{inputs.target_repo}}"
    summary: |
      BugHunter scan of {{inputs.target_repo}}
      Skills discovered: {{discover_skills.output | length}}
      Findings: {{collect_findings.output | length}}
      {% for f in collect_findings.output %}
      [{{f.severity | upper}}] {{f.type}} — {{f.endpoint_or_file}}
      {% endfor %}
    next: notify_complete

  # ── 7. Summary notification ───────────────────────────────────────────────────
  notify_complete:
    type: output
    channels:
      - slack
    template: |
      🔍 *BugHunter Active Scan complete* — `{{ inputs.target_repo }}`

      *Skills discovered:* {{ discover_skills.output | length }}
      *Findings emitted:* {{ collect_findings.output | length }}
      {% for f in collect_findings.output %}
      • [{{ f.severity | upper }}] {{ f.type }} — `{{ f.endpoint_or_file }}` ({{ f.skill }})
      {% endfor %}

      View in Security Loop → https://app.conductai.ai/secure/activity
      View GitHub issues → https://github.com/{{ inputs.target_repo }}/issues?q=label%3Abughunter

test_trigger:
  payload:
    target_repo: "elementalsouls/sample-vulnerable-app"
    target_url: ""
    skills_repo: "elementalsouls/Claude-BugHunter"
    severity_threshold: high
    skill_scope: hunt-only
    skill_filter: ""
    model: claude-sonnet-4-6
