# GLens Action Catalog
# Governing rule: GLens may interpret, compose, explain and navigate —
# but must never redefine data, metrics, policies or authorization already owned by Conduct.
# Every action maps to an existing service function. Nothing happens outside this catalog.

actions:

  # ── Guard Activity ────────────────────────────────────────────────────────

  get_governance_kpis:
    endpoint: internal/governance/kpis
    component: GovernanceKpiCards
    tier1: true
    parameters:
      period:
        type: enum
        values: [today, week, month, quarter]
        default: today
    phrases:
      - "governance overview"
      - "governance summary"
      - "governance kpis"
      - "how many blocks this month"
      - "blocks mtd"
      - "risk avoided"
      - "events today"
      - "governance dashboard"

  view_guard_activity:
    endpoint: GET /guard/events
    component: ActivityTable
    tier1: true
    parameters:
      decision:
        type: enum
        values: [allowed, warned, blocked]
      ai_tool:
        type: string
      user_email:
        type: string
      since:
        type: datetime
      until:
        type: datetime
      limit:
        type: integer
        default: 20
    phrases:
      - "show guard activity"
      - "today's activity"
      - "recent events"
      - "what happened today"
      - "show events"

  view_blocked_events:
    endpoint: GET /guard/events?decision=blocked
    component: ActivityTable
    tier1: true
    parameters:
      ai_tool:
        type: string
      user_email:
        type: string
      since:
        type: datetime
      until:
        type: datetime
    phrases:
      - "who was blocked"
      - "show blocks"
      - "blocked today"
      - "blocked events"
      - "show me all blocks"

  view_warned_events:
    endpoint: GET /guard/events?decision=warned
    component: ActivityTable
    tier1: true
    parameters:
      ai_tool:
        type: string
      user_email:
        type: string
      since:
        type: datetime
    phrases:
      - "who was warned"
      - "show warnings"
      - "warned today"
      - "warning events"

  view_workflow_blocks:
    endpoint: GET /guard/events  # grouped in formatter by conductai_workflow_id → conductai_run_id
    component: WorkflowBlocksView  # inline chat only — no dedicated UI page
    tier1: false
    parameters:
      since:
        type: datetime
      until:
        type: datetime
      decision:
        type: enum
        values: [blocked, warned]
        default: blocked
      workflow_id:
        type: string
      run_id:
        type: string
    phrases:
      - "which workflow caused blocks"
      - "relate blocks to workflows"
      - "which automation triggered this"
      - "what workflow was running when blocked"
      - "show blocks by workflow"
      - "blocks from workflows"

  # ── Spend ─────────────────────────────────────────────────────────────────

  get_spend_summary:
    endpoint: GET /guard/spend
    component: SpendDashboard
    tier1: false
    parameters:
      period:
        type: string
        description: calendar month as YYYY-MM, defaults to current month
      group_by:
        type: enum
        values: [tool, developer, model]
    phrases:
      - "what is our spend"
      - "ai cost this month"
      - "how much are we spending"
      - "token cost"
      - "spend summary"
      - "cost by tool"
      - "cost by developer"

  view_spend_sessions:
    endpoint: GET /guard/spend/sessions
    component: SessionsTable
    tier1: false
    parameters:
      limit:
        type: integer
        default: 20
      offset:
        type: integer
        default: 0
    phrases:
      - "show spend sessions"
      - "session costs"
      - "which sessions cost the most"
      - "session breakdown"

  view_budgets:
    endpoint: GET /guard/spend/budgets
    component: BudgetsTable
    tier1: false
    parameters: {}
    phrases:
      - "show budgets"
      - "what are our spend limits"
      - "budget usage"
      - "who has a budget"
      - "spending limits"

  get_savings_summary:
    endpoint: GET /guard/savings/summary
    component: SavingsKpiCards
    tier1: false
    parameters:
      by_member:
        type: boolean
        default: false
    phrases:
      - "how much have we saved"
      - "token savings"
      - "rtk savings"
      - "booster savings"
      - "savings summary"
      - "tokens saved"

  # ── Discovery ─────────────────────────────────────────────────────────────

  view_discovery_agents:
    endpoint: GET /guard/discover/agents
    component: AgentsTable
    tier1: false
    parameters:
      under_guard:
        type: boolean
      limit:
        type: integer
        default: 20
    phrases:
      - "show discovered agents"
      - "which agents are running"
      - "list agents"
      - "agents not under guard"
      - "unprotected agents"

  get_discovery_coverage:
    endpoint: GET /guard/discover/summary
    component: CoverageKpiCards
    tier1: false
    parameters: {}
    phrases:
      - "agent coverage"
      - "how many agents under guard"
      - "coverage summary"
      - "coverage percentage"
      - "discovery summary"

  # ── Policies ──────────────────────────────────────────────────────────────

  list_policies:
    endpoint: GET /guard/policies
    component: PoliciesTable
    tier1: false
    parameters: {}
    phrases:
      - "list guard rules"
      - "show policies"
      - "what rules are active"
      - "which rules fired"
      - "guard policies"
      - "active rules"

  create_guard_rule:
    endpoint: POST /guard/policies
    component: PolicyConfirmBubble
    write: true
    tier1: false
    parameters:
      description:
        type: string
        required: true
      action:
        type: enum
        values: [block, warn, audit]
        default: block
      match_tool:
        type: string
        description: AI tool to target (e.g. "cursor", "claude", "*" for all)
      match_pattern:
        type: string
        description: Regex pattern to match prompt/content
      severity:
        type: enum
        values: [low, medium, high, critical]
        default: medium
    phrases:
      - "create a rule"
      - "add a guard rule"
      - "new rule to block"
      - "block rule for"
      - "create guard rule"
      - "add rule that"

  edit_guard_rule:
    endpoint: PATCH /guard/policies/{rule_id}
    component: PolicyConfirmBubble
    write: true
    tier1: false
    parameters:
      rule_id:
        type: string
        required: true
      description:
        type: string
      action:
        type: enum
        values: [block, warn, audit]
      enabled:
        type: boolean
      severity:
        type: enum
        values: [low, medium, high, critical]
    phrases:
      - "edit rule"
      - "update rule"
      - "change rule"
      - "disable rule"
      - "enable rule"
      - "modify guard rule"

  delete_guard_rule:
    endpoint: DELETE /guard/policies/{rule_id}
    component: PolicyConfirmBubble
    write: true
    destructive: true
    tier1: false
    parameters:
      rule_id:
        type: string
        required: true
    phrases:
      - "delete rule"
      - "remove rule"
      - "delete guard rule"
      - "remove guard rule"

  # ── Compliance ────────────────────────────────────────────────────────────

  view_compliance_packs:
    endpoint: GET /compliance/packs/installed
    component: CompliancePacksTable
    tier1: false
    parameters: {}
    phrases:
      - "which compliance packs are installed"
      - "show compliance packs"
      - "what frameworks do we have"
      - "installed packs"

  get_compliance_pack_detail:
    endpoint: GET /compliance/packs/{pack_id}
    component: CompliancePackDetail
    tier1: false
    parameters:
      pack_id:
        type: string
        required: true
    phrases:
      - "show owasp pack"
      - "soc2 pack detail"
      - "hipaa rules"
      - "pci dss coverage"
      - "what rules are in"

  # ── Governance ────────────────────────────────────────────────────────────

  get_governance_frameworks:
    endpoint: GET /governance/frameworks
    component: FrameworkCoverageChart
    tier1: false
    parameters: {}
    phrases:
      - "framework coverage"
      - "which frameworks are we compliant with"
      - "compliance matrix"
      - "governance frameworks"
      - "show compliance frameworks"
      - "owasp coverage"
      - "soc2 status"

  get_governance_narrative:
    endpoint: GET /governance/narrative
    component: GovernanceNarrative
    tier1: false
    parameters: {}
    phrases:
      - "governance summary in plain english"
      - "explain our governance posture"
      - "governance narrative"
      - "how are we doing on governance"
      - "governance health"

  # ── Correlated (new — needs build) ────────────────────────────────────────

  view_correlated_activity:
    endpoint: GET /guard/activity/correlated
    component: inline_chat
    tier1: false
    status: needs_build
    parameters:
      since:
        type: datetime
      until:
        type: datetime
      decision:
        type: enum
        values: [blocked, warned, allowed]
      user_email:
        type: string
      ai_tool:
        type: string
    phrases:
      - "relate blocks to user actions"
      - "what caused these blocks"
      - "show blocks in context"
      - "what was the user doing when blocked"
      - "correlate blocks to sessions"
