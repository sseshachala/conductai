[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
markers =
    matrix: full endpoint×role RBAC probe (slow, nightly-only — opt in with `-m matrix`)
    attack: OWASP attack surface probes (Group D — inject/IDOR/webhook signatures)
filterwarnings =
    ignore::DeprecationWarning
