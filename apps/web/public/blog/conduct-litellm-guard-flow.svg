<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b14"/><stop offset="1" stop-color="#11182b"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#67e8f9"/></marker>
    <marker id="back" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#a78bfa"/></marker>
    <style>
      .title{font:800 50px Inter,Arial,sans-serif;fill:#fff}.sub{font:500 23px Inter,Arial,sans-serif;fill:#aeb8cf}
      .eyebrow{font:700 17px Inter,Arial,sans-serif;letter-spacing:2px}.h{font:750 25px Inter,Arial,sans-serif;fill:#fff}.p{font:500 18px Inter,Arial,sans-serif;fill:#c4cce0}
      .code{font:500 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}.small{font:600 15px Inter,Arial,sans-serif;fill:#b8c2d8}
      .box{fill:#131b2f;stroke:#364461;stroke-width:2}.pill{fill:#0e2230;stroke:#22d3ee;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="50" r="300" fill="#22d3ee" opacity=".04"/><circle cx="120" cy="850" r="300" fill="#8b5cf6" opacity=".05"/>
  <text x="80" y="92" class="title">Conduct AI Guard × LiteLLM</text>
  <text x="80" y="132" class="sub">A thin enforcement adapter connected to a centralized runtime policy platform</text>

  <rect x="70" y="205" width="410" height="530" rx="28" fill="#17152b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="105" y="250" class="eyebrow" fill="#c4b5fd">CUSTOMER RUNTIME</text>
  <rect x="105" y="285" width="340" height="105" rx="18" class="box"/>
  <text x="135" y="326" class="h">AI app or agent</text>
  <text x="135" y="359" class="p">Sends a model request through LiteLLM</text>
  <path d="M275 390v45" stroke="#a78bfa" stroke-width="4" marker-end="url(#back)"/>
  <rect x="105" y="445" width="340" height="105" rx="18" class="box"/>
  <text x="135" y="486" class="h">LiteLLM runtime</text>
  <text x="135" y="519" class="p">Invokes the configured guard plugin</text>
  <path d="M275 550v45" stroke="#a78bfa" stroke-width="4" marker-end="url(#back)"/>
  <rect x="105" y="605" width="340" height="92" rx="18" fill="#201b3b" stroke="#a78bfa" stroke-width="2"/>
  <text x="135" y="644" class="h">Model provider</text>
  <text x="135" y="674" class="p">Called only after an allow verdict</text>

  <rect x="565" y="250" width="400" height="435" rx="28" fill="#101d2d" stroke="#22d3ee" stroke-width="2"/>
  <text x="600" y="295" class="eyebrow" fill="#67e8f9">THIN LITELLM PLUGIN</text>
  <text x="600" y="334" class="h">conduct-litellm-guard</text>
  <rect x="600" y="365" width="330" height="54" rx="14" fill="#281826" stroke="#fb7185"/>
  <text x="630" y="399" class="eyebrow" fill="#fda4af" style="letter-spacing:1px">NO POLICY LOGIC INSIDE</text>
  <rect x="600" y="450" width="330" height="80" rx="16" class="box"/>
  <text x="625" y="480" class="small">1 · Send prompt context</text>
  <text x="625" y="508" class="code">guard_check_prompt(...)</text>
  <rect x="600" y="550" width="330" height="100" rx="16" class="box"/>
  <text x="625" y="582" class="small">2 · Enforce returned verdict</text>
  <text x="625" y="611" class="code" fill="#fda4af">block → raise 400 / 403</text>
  <text x="625" y="638" class="code" fill="#86efac">allow → continue / annotate</text>

  <rect x="1070" y="205" width="460" height="530" rx="28" fill="#0e1e2c" stroke="url(#brand)" stroke-width="3" filter="url(#glow)"/>
  <text x="1110" y="250" class="eyebrow" fill="#93c5fd">CONDUCT AI PLATFORM</text>
  <text x="1110" y="292" class="h">api.conductai.ai</text>
  <path d="M1300 330l67 27v54c0 58-37 92-67 108-30-16-67-50-67-108v-54z" fill="none" stroke="url(#brand)" stroke-width="8"/>
  <path d="M1267 413l24 24 45-53" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1110" y="548" width="380" height="65" rx="15" class="box"/>
  <text x="1135" y="588" class="h">Policies live here</text>
  <rect x="1110" y="630" width="380" height="65" rx="15" class="box"/>
  <text x="1135" y="670" class="h">Policies are evaluated here</text>

  <path d="M445 498C500 498 505 470 555 470" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="468" y="456" class="small">plugin hook</text>
  <path d="M930 490C990 490 1000 425 1060 425" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="955" y="402" class="small">HTTPS request</text>
  <text x="955" y="430" class="code">api_url → api.conductai.ai</text>
  <path d="M1060 520C1000 520 990 585 940 585" fill="none" stroke="#a78bfa" stroke-width="5" marker-end="url(#back)"/>
  <text x="975" y="574" class="small">verdict + metadata</text>

  <rect x="130" y="770" width="1340" height="76" rx="20" fill="#111a2a" stroke="#475569"/>
  <text x="175" y="817" class="h">One remote policy plane</text>
  <text x="545" y="817" class="p">LiteLLM transports context and enforces the decision; Conduct owns policy, evaluation, and audit.</text>
</svg>
