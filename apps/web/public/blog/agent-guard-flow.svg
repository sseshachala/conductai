<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" role="img" aria-label="Five agent frameworks, one Conduct decision, one audit trail" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <rect width="760" height="456" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a29e"/></marker>
  </defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1917">Five agent frameworks, one Conduct decision, one audit trail</text>
  <g fill="none" stroke="#a8a29e" stroke-width="1.25">
    <path d="M250 100L330 172" marker-end="url(#a)"/><path d="M250 160L330 196" marker-end="url(#a)"/>
    <path d="M250 220L330 220" marker-end="url(#a)"/><path d="M250 280L330 244" marker-end="url(#a)"/>
    <path d="M250 340L330 268" marker-end="url(#a)"/><path d="M520 196L564 160" marker-end="url(#a)"/>
    <path d="M520 244L564 280" marker-end="url(#a)"/><path d="M425 280V384" marker-end="url(#a)"/>
  </g>
  <text x="24" y="64" font-size="11.5" fill="#78716c">Adapter per framework (translates)</text>
  <g fill="none" stroke="#a8a29e" stroke-width="1.25">
    <rect x="24" y="76" width="226" height="48" rx="8"/><rect x="24" y="136" width="226" height="48" rx="8"/>
    <rect x="24" y="196" width="226" height="48" rx="8"/><rect x="24" y="256" width="226" height="48" rx="8"/>
    <rect x="24" y="316" width="226" height="48" rx="8"/>
  </g>
  <g font-weight="600" fill="#1c1917">
    <text x="40" y="96">Claude Agent SDK</text><text x="40" y="156">OpenAI Agents SDK</text>
    <text x="40" y="216">LangChain / LangGraph</text><text x="40" y="276">Google ADK</text><text x="40" y="336">CrewAI</text>
  </g>
  <g font-size="11.5" fill="#78716c">
    <text x="40" y="114">PreToolUse hook</text><text x="40" y="174">tool input guardrail</text>
    <text x="40" y="234">middleware: wrap_tool_call</text><text x="40" y="294">before_tool_callback</text>
    <text x="40" y="354">before_tool_call hook</text>
  </g>
  <text x="425" y="148" text-anchor="middle" font-size="11.5" fill="#78716c">Conduct (decides)</text>
  <rect x="330" y="160" width="190" height="120" rx="8" fill="#4f46e5" fill-opacity="0.08" stroke="#4f46e5" stroke-width="2"/>
  <text x="425" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1917">Conduct policy</text>
  <g text-anchor="middle" font-size="11.5" fill="#1c1917">
    <text x="425" y="218">guard_check, action gate</text><text x="425" y="238">tool name + arguments</text>
    <text x="425" y="258">one rule, written once</text>
  </g>
  <rect x="564" y="136" width="172" height="48" rx="8" fill="none" stroke="#16a34a" stroke-width="1.25"/>
  <text x="580" y="156" font-weight="600" fill="#1c1917">Allowed</text>
  <text x="580" y="174" font-size="11.5" fill="#78716c">the tool runs</text>
  <rect x="564" y="256" width="172" height="48" rx="8" fill="none" stroke="#dc2626" stroke-width="1.25"/>
  <text x="580" y="276" font-weight="600" fill="#1c1917">Blocked or approval</text>
  <text x="580" y="294" font-size="11.5" fill="#78716c">model gets the reason</text>
  <rect x="330" y="384" width="406" height="48" rx="8" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.25"/>
  <text x="346" y="404" font-weight="600" fill="#1c1917">Guard Activity</text>
  <text x="346" y="422" font-size="11.5" fill="#78716c">every decision, one trail, labelled by framework</text>
</svg>
