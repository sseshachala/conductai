apiVersion: v1
kind: Service
metadata:
  name: {{ include "conduct.fullname" . }}-api
  labels:
    {{- include "conduct.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8000
  selector:
    {{- include "conduct.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conduct.fullname" . }}-api
  labels:
    {{- include "conduct.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "conduct.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "conduct.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "conduct.serviceAccountName" . }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "conduct.fullname" . }}-postgres 5432; do
                echo "waiting for postgres…"; sleep 2;
              done
      containers:
        - name: api
          image: {{ include "conduct.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          # Same CMD as the Dockerfile prod stage — runs alembic then uvicorn.
          # See ponytail: note in values.yaml for the replicas>1 ceiling.
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "conduct.fullname" . }}
            - secretRef:
                name: {{ include "conduct.secretName" . }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
