{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conduct.fullname" . }}
  labels: {{- include "conduct.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.config.postgresUser }}:{{ required "secrets.values.postgresPassword is required" .Values.secrets.values.postgresPassword }}@{{ include "conduct.fullname" . }}-postgres:5432/{{ .Values.config.postgresDb }}"
  POSTGRES_PASSWORD: {{ required "secrets.values.postgresPassword is required" .Values.secrets.values.postgresPassword | quote }}
  ANTHROPIC_API_KEY: {{ required "secrets.values.anthropicApiKey is required (or set secrets.existingSecret)" .Values.secrets.values.anthropicApiKey | quote }}
  ENCRYPTION_KEY: {{ required "secrets.values.encryptionKey is required (or set secrets.existingSecret) — supply a 32-char random string" .Values.secrets.values.encryptionKey | quote }}
  CLERK_SECRET_KEY: {{ .Values.secrets.values.clerkSecretKey | quote }}
  CLERK_FRONTEND_API: {{ .Values.secrets.values.clerkFrontendApi | quote }}
  MODAL_TOKEN_ID: {{ .Values.secrets.values.modalTokenId | quote }}
  MODAL_TOKEN_SECRET: {{ .Values.secrets.values.modalTokenSecret | quote }}
  GUARD_TRIAL_ANTHROPIC_KEY: {{ .Values.secrets.values.guardTrialAnthropicKey | quote }}
{{- end }}
