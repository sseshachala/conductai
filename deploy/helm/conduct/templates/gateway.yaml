apiVersion: v1
kind: Service
metadata:
  name: {{ include "conduct.fullname" . }}-gateway
  labels:
    {{- include "conduct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: 8000
  selector:
    {{- include "conduct.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conduct.fullname" . }}-gateway
  labels:
    {{- include "conduct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "conduct.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "conduct.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ include "conduct.serviceAccountName" . }}
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "conduct.fullname" . }}-api {{ .Values.api.service.port }}; do
                echo "waiting for api…"; sleep 2;
              done
      containers:
        - name: gateway
          image: {{ include "conduct.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          # Uvicorn directly — no alembic on start, API pod owns migrations.
          command:
            - sh
            - -c
            - "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2 --proxy-headers --forwarded-allow-ips=*"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ADMISSION_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: {{ include "conduct.fullname" . }}
            - secretRef:
                name: {{ include "conduct.secretName" . }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
