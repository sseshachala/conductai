apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conduct.fullname" . }}
  labels: {{- include "conduct.labels" . | nindent 4 }}
data:
  REDIS_URL: "redis://{{ include "conduct.fullname" . }}-redis:6379"
  API_BASE_URL: "http://{{ include "conduct.fullname" . }}-api:{{ .Values.api.service.port }}"
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  SQLALCHEMY_POOL_SIZE: {{ .Values.config.sqlalchemyPoolSize | quote }}
  SQLALCHEMY_MAX_OVERFLOW: {{ .Values.config.sqlalchemyMaxOverflow | quote }}
  GUARD_GATEWAY_PROFILE_V2: {{ .Values.config.guardGatewayProfileV2 | quote }}
  GUARD_GATEWAY_PROFILE_V2_ROLLOUT_PCT: {{ .Values.config.guardGatewayProfileV2RolloutPct | quote }}
  GUARD_GATEWAY_PROFILE_V2_ALLOWLIST: {{ .Values.config.guardGatewayProfileV2Allowlist | quote }}
  GUARD_USE_DURABLE_AUDIT: {{ .Values.config.guardUseDurableAudit | quote }}
  GUARD_DURABLE_AUDIT_ROLLOUT_PCT: {{ .Values.config.guardDurableAuditRolloutPct | quote }}
  GUARD_DURABLE_AUDIT_ALLOWLIST: {{ .Values.config.guardDurableAuditAllowlist | quote }}
  GUARD_DURABLE_AUDIT_FAIL_CLOSED: {{ .Values.config.guardDurableAuditFailClosed | quote }}
  GATEWAY_ADMISSION_MAX_INFLIGHT: {{ .Values.config.gatewayAdmissionMaxInflight | quote }}
  GATEWAY_ADMISSION_WORKSPACE_MAX: {{ .Values.config.gatewayAdmissionWorkspaceMax | quote }}
  MCP_ADMISSION_MAX_INFLIGHT: {{ .Values.config.mcpAdmissionMaxInflight | quote }}
  MCP_ADMISSION_WORKSPACE_MAX: {{ .Values.config.mcpAdmissionWorkspaceMax | quote }}
