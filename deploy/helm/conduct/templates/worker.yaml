apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conduct.fullname" . }}-worker
  labels:
    {{- include "conduct.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "conduct.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "conduct.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "conduct.serviceAccountName" . }}
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "conduct.fullname" . }}-api {{ .Values.api.service.port }}; do
                echo "waiting for api…"; sleep 2;
              done
      containers:
        - name: worker
          image: {{ include "conduct.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: {{ include "conduct.fullname" . }}
            - secretRef:
                name: {{ include "conduct.secretName" . }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
