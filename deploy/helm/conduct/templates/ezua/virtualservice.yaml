# PCAI ingress: Istio VirtualService bound to the shared ezaf-gateway.
# Two routes on one hostname (same-origin so the web pod doesn't need to
# know a public API URL at build time):
#   /api/* → API service (path rewrites strip the /api prefix)
#   /*     → Web service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "conduct.fullname" . }}
  labels: {{- include "conduct.labels" . | nindent 4 }}
spec:
  gateways:
    - {{ .Values.ezua.istioGateway | quote }}
  hosts:
    - {{ .Values.ezua.endpoint | quote }}
  http:
    - match:
        - uri:
            prefix: /api/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "conduct.fullname" . }}-api
            port:
              number: {{ .Values.api.service.port }}
    - route:
        - destination:
            host: {{ include "conduct.fullname" . }}-web
            port:
              number: {{ .Values.web.service.port }}
