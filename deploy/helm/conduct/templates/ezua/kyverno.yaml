{{- if .Values.kyvernoLabelPolicy.enabled -}}
# PCAI expects hpe-ezua/* labels on pods it manages. This ClusterPolicy stamps
# them on every pod created in the release namespace. If your PCAI cluster
# already has a blanket policy, set kyvernoLabelPolicy.enabled=false.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ include "conduct.fullname" . }}-ezua-labels
  labels: {{- include "conduct.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: "Ezua labels for {{ include "conduct.fullname" . }}"
spec:
  background: false
  rules:
    - name: add-ezua-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Release.Namespace }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              hpe-ezua/app: {{ include "conduct.fullname" . | quote }}
              hpe-ezua/type: framework
{{- end }}
