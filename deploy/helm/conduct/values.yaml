# Set customer-specific values in your own values.yaml.
image:
  api:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  pullSecrets: []

hosts:
  console: ""
  api: ""
  gateway: ""

ingress:
  enabled: true
  className: ""
  annotations: {}
  tlsSecretName: ""

oidc:
  issuer: ""
  clientId: ""
  jwksUrl: ""
  emailDomains: ["*"]
  # Optional ConfigMap containing a complete PEM trust bundle under ca.crt.
  caConfigMap: ""

# Existing Kubernetes Secrets only. No credentials go in Helm values.
secrets:
  existingSecret: ""
  proxySecret: ""

bootstrap:
  enabled: true
  workspaceId: ""
  workspaceName: ""
  adminSubject: ""
  adminName: "Administrator"

config:
  postgresUser: conduct
  postgresDb: conduct
  # Additional non-secret API/Gateway/worker environment variables.
  # Rollout order: migrate -> worker deployed -> dry-run -> queue enable -> cleanup enable.
  extraEnv:
    GUARD_PROJECTION_QUEUE_ENABLED: false
    GUARD_PROJECTION_PAUSED: false
    GUARD_PROJECTION_RETENTION_DAYS: 30
    GUARD_PROJECTION_RETENTION_CLEANUP_ENABLED: false
    GUARD_PROJECTION_RETENTION_DRY_RUN: true
    GUARD_PROJECTION_RETENTION_INTERVAL_SECONDS: 3600
    GUARD_PROJECTION_CONSUMER_CONCURRENCY: 1
    GUARD_PROJECTION_RECONCILIATION_INTERVAL_SECONDS: 60
    GUARD_PROJECTION_RECONCILIATION_BATCH_SIZE: 100
    GUARD_PROJECTION_PRUNE_BATCH_SIZE: 500
    GUARD_AUDIT_RETENTION_ENABLED: false
    GUARD_AUDIT_RETENTION_DRY_RUN: true
    GUARD_AUDIT_RETENTION_INTERVAL_SECONDS: 3600
    GUARD_AUDIT_RETENTION_BATCH_SIZE: 100
    # Set a compliance period, bucket and HTTPS endpoint before enabling.
    # Keys belong in secrets.existingSecret, not in this values file.
    GUARD_AUDIT_ARCHIVE_REGION: us-east-1
    GUARD_AUDIT_ARCHIVE_PREFIX: conduct/audit
    GUARD_AUDIT_ARCHIVE_PATH_STYLE: false

api:
  replicas: 1
  service: {port: 8000}
  extraEnv: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1Gi}
gateway:
  replicas: 1
  service: {port: 8000}
  extraEnv: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1Gi}
worker:
  replicas: 1
  extraEnv: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1Gi}
web:
  replicas: 1
  service: {port: 3000}
  extraEnv: []
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

oauth2Proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.0
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
router:
  image: caddy:2.10.2-alpine
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  storage: {size: 20Gi, storageClass: ""}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}
redis:
  enabled: true
  image: redis:7-alpine
  storage: {size: 5Gi, storageClass: ""}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}

serviceAccount:
  create: true
  name: ""

# Restricts direct access to web/proxy/data services. Requires CNI support.
networkPolicy:
  enabled: true
