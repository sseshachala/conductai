# Set customer-specific values in your own values.yaml.
image:
  api:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  pullSecrets: []

hosts:
  console: ""
  api: ""
  gateway: ""

ingress:
  enabled: true
  className: ""
  annotations: {}
  tlsSecretName: ""

oidc:
  issuer: ""
  clientId: ""
  jwksUrl: ""
  emailDomains: ["*"]
  # Optional ConfigMap containing a complete PEM trust bundle under ca.crt.
  caConfigMap: ""

# Existing Kubernetes Secrets only. No credentials go in Helm values.
secrets:
  existingSecret: ""
  proxySecret: ""

bootstrap:
  enabled: true
  workspaceId: ""
  workspaceName: ""
  adminSubject: ""
  adminName: "Administrator"

config:
  postgresUser: conduct
  postgresDb: conduct
  # Additional non-secret API/Gateway/worker environment variables.
  extraEnv: {}

api:
  replicas: 1
  service: {port: 8000}
  extraEnv: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1Gi}
gateway:
  replicas: 1
  service: {port: 8000}
  extraEnv: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1Gi}
worker:
  replicas: 1
  extraEnv: []
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1Gi}
web:
  replicas: 1
  service: {port: 3000}
  extraEnv: []
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

oauth2Proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.0
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
router:
  image: caddy:2.10.2-alpine
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  storage: {size: 20Gi, storageClass: ""}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}
redis:
  enabled: true
  image: redis:7-alpine
  storage: {size: 5Gi, storageClass: ""}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}

serviceAccount:
  create: true
  name: ""

# Restricts direct access to web/proxy/data services. Requires CNI support.
networkPolicy:
  enabled: true
