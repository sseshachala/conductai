# ─── Ezmeral (HPE PCAI) integration ────────────────────────────────────────
# The two knobs the PCAI Import Framework asks for when uploading the chart.
# `endpoint` is the hostname the app is reachable at (rendered into the Istio
# VirtualService). `istioGateway` is the shared ingress gateway PCAI runs.
# Set `virtualService.enabled=false` on clusters without Istio (kind, plain
# EKS, etc.); use your own Ingress in that case.
ezua:
  endpoint: "conduct.${DOMAIN_NAME}"
  istioGateway: "istio-system/ezaf-gateway"
  virtualService:
    enabled: true

# ─── Images ────────────────────────────────────────────────────────────────
# API/Gateway/Worker share one image (apps/api/Dockerfile). Web is separate.
# In air-gapped PCAI, push these to Harbor and update repository fields.
image:
  api:
    repository: ghcr.io/conductai/conduct-api
    tag: ""            # empty ⇒ Chart.appVersion
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/conductai/conduct-web
    tag: ""
    pullPolicy: IfNotPresent
  pullSecrets: []      # e.g. [{name: harbor-creds}]

# ─── Secrets ───────────────────────────────────────────────────────────────
# Two ways to supply secrets:
#  1. Inline (dev / trial): fill secrets.values.*.
#  2. External (recommended): create your own Secret with the same keys and
#     set secrets.existingSecret; the chart will not create its own Secret.
secrets:
  existingSecret: ""
  values:
    anthropicApiKey: ""              # required (unless existingSecret)
    encryptionKey: ""                # required, 32-char random — supply your own
    postgresPassword: "changeme"     # used for the in-cluster Postgres StatefulSet
    clerkSecretKey: ""               # optional
    clerkFrontendApi: ""             # optional
    modalTokenId: ""                 # optional (Modal sandbox)
    modalTokenSecret: ""             # optional
    guardTrialAnthropicKey: ""       # optional (funded trial flow)

# ─── Non-secret configuration ──────────────────────────────────────────────
config:
  postgresUser: conduct
  postgresDb: conduct
  sqlalchemyPoolSize: "5"
  sqlalchemyMaxOverflow: "10"
  # Gateway V2 profile execution.
  guardGatewayProfileV2: "true"
  guardGatewayProfileV2RolloutPct: "100"
  guardGatewayProfileV2Allowlist: ""
  # Durable audit (opt-in).
  guardUseDurableAudit: "false"
  guardDurableAuditRolloutPct: "0"
  guardDurableAuditAllowlist: ""
  guardDurableAuditFailClosed: "false"
  # Admission caps (enforced only on the gateway pod).
  gatewayAdmissionMaxInflight: "40"
  gatewayAdmissionWorkspaceMax: "10"
  mcpAdmissionMaxInflight: "40"
  mcpAdmissionWorkspaceMax: "10"

# ─── Components ────────────────────────────────────────────────────────────
api:
  # ponytail: replicas=1 keeps the alembic-on-start CMD safe. Above 1, two
  # ponytail: pods can race the same migration on `helm upgrade`. Fix path:
  # ponytail: override command to `uvicorn …` and add a pre-upgrade Job.
  replicas: 1
  service:
    port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

gateway:
  replicas: 1
  service:
    port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

worker:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

web:
  replicas: 1
  service:
    port: 3000
  # NEXT_PUBLIC_API_URL is baked at build time — leave "" and rely on the
  # Istio VirtualService rewriting `/api/*` to the api Service (same-origin).
  publicApiUrl: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

postgres:
  image: pgvector/pgvector:pg16
  storage:
    size: 20Gi
    storageClass: ""    # empty ⇒ cluster default (set for PCAI's Ezmeral CSI)
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 2Gi }

redis:
  image: redis:7-alpine
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

serviceAccount:
  create: true
  name: ""

# PCAI expects hpe-ezua/* labels on managed pods. The Kyverno ClusterPolicy
# below stamps them automatically. Disable if your PCAI cluster already has
# a blanket policy that covers this namespace.
kyvernoLabelPolicy:
  enabled: true
