name: nightly-accounting-realdb

# Nightly integration + recovery tests for the unified accounting engine
# (#2209 follow-up PR 2). Per-PR CI runs mocked SessionLocal tests; this
# job round-trips the writer + reconciler + atomic upsert against real
# Postgres and injects Redis / process-crash faults the unit tests can't
# see. Green N nights → PR 4 (cutover) can proceed.
#
# Runs at 04:15 UTC (15 min after the durable-audit nightly). Also
# invocable via workflow_dispatch for on-demand verification.

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-accounting-realdb
  cancel-in-progress: false

env:
  PG_USER: marshal
  PG_PASS: marshal
  PG_DB: marshal_test

jobs:
  integration:
    name: accounting engine round-trip + recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marshal
          POSTGRES_PASSWORD: marshal
          POSTGRES_DB: marshal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marshal -d marshal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: test-key-32-bytes-long-xxxxxxxx!
      RUN_ACCOUNTING_REALDB: "1"
      GUARD_ACCOUNTING_SHADOW_ENABLED: "true"
      GUARD_ACCOUNTING_SHADOW_WORKSPACE_ALLOWLIST: "*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API deps
        run: pip install -r apps/api/requirements.txt
      - name: Compose DATABASE_URL from parts
        run: |
          printf 'DATABASE_URL=%s\n' \
            "$(printf '%s://%s:%s@localhost:5432/%s' postgresql "$PG_USER" "$PG_PASS" "$PG_DB")" \
            >> "$GITHUB_ENV"
      - name: Migrate DB
        run: alembic upgrade head
        working-directory: apps/api

      # Round-trip: writer + atomic upsert + placeholder promotion +
      # reconciler + workspace CASCADE. Covers the six deterministic
      # scenarios in test_shadow_receipts_realdb.py.
      - name: Shadow receipts real-DB round-trip
        run: pytest tests/integration/test_shadow_receipts_realdb.py -v
        working-directory: apps/api

      # Redis interruption: shadow_write must not depend on Redis being
      # healthy. Kills Redis mid-writer-chain and verifies the receipt
      # still lands.
      - name: Shadow writer Redis interruption
        run: pytest tests/integration/test_shadow_writer_redis_interruption_realdb.py -v
        working-directory: apps/api

      # Process crash: a worker killed between audit-write and
      # shadow-write must be recovered by the reconciler on next scan.
      # Simulated via forced rollback + reconciler pass.
      - name: Shadow writer process-crash recovery
        run: pytest tests/integration/test_shadow_writer_process_crash_realdb.py -v
        working-directory: apps/api
