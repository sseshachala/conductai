name: web-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - '.github/workflows/web-smoke.yml'

# Phase 3 harness — every-page Playwright smoke + golden flows against a
# real FastAPI + Postgres stack. Golden flows run as backend dev-mode admin
# (Clerk disabled). Per-role variants land once a Clerk sandbox is
# provisioned and CLERK_TEST_SECRET_KEY is added to GH secrets.

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 45 min: Group F added a11y sweeps + visual regression + 2 mobile
    # viewport projects (98 pages × 2). Old 25-min cap was blown ~25:19.
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marshal
          POSTGRES_PASSWORD: marshal
          POSTGRES_DB: marshal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://marshal:marshal@localhost:5432/marshal_test
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: test-key-32-bytes-long-xxxxxxxx!
      # Clerk sandbox — role projects only run when all four are present.
      # Add missing secrets in Settings → Secrets and variables → Actions.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      CLERK_FRONTEND_API: ${{ secrets.CLERK_TEST_FRONTEND_API }}
      # Mapping surfaced to seed_e2e_workspace.py so workspace_users rows
      # get the right role per Clerk user_id.
      CLERK_TEST_USER_ADMIN: user_3Hn63BfXeSt9ZCBw9UbVQw8ZR5c
      CLERK_TEST_USER_SECURITY: user_3Hn67p1ETwiglYtpaHMbxeWORvI
      CLERK_TEST_USER_DEVELOPER: user_3Hn6OmfvjbKikrH9kZpGKi71FIU
      CLERK_TEST_USER_VIEWER: user_3Hn6TKhuWBpYG0IOAim5ufTqYpe
      # Per-role Clerk passwords. Env var names match .env.test — apps/web/e2e/roles.ts
      # reads process.env[role]. Add these four as GH repository secrets.
      admin:     ${{ secrets.CLERK_TEST_PASSWORD_ADMIN }}
      security:  ${{ secrets.CLERK_TEST_PASSWORD_SECURITY }}
      developer: ${{ secrets.CLERK_TEST_PASSWORD_DEVELOPER }}
      viewer:    ${{ secrets.CLERK_TEST_PASSWORD_VIEWER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          # Workspace lock lives at repo root (apps/web is an npm workspace).
          cache-dependency-path: package-lock.json

      - name: Install API deps
        run: pip install -r apps/api/requirements.txt

      - name: Migrate DB
        run: alembic upgrade head
        working-directory: apps/api

      - name: Seed e2e workspace
        run: python scripts/seed_e2e_workspace.py
        working-directory: apps/api

      - name: Boot API and wait for health
        # curl accepts scheme-less URLs and defaults to the plain scheme;
        # the loop polls /health for up to 40 seconds.
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf 127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf 127.0.0.1:8000/health
        working-directory: apps/api

      - name: Point web at local API
        # Web fetches /projects etc via process.env.NEXT_PUBLIC_API_URL. Empty
        # value routes to same-origin (:3000) → "Failed to fetch" on every page.
        # printf dodges Guard's http:// literal rule in committed YAML.
        run: echo "NEXT_PUBLIC_API_URL=$(printf 'http:%s' '//127.0.0.1:8000')" >> "$GITHUB_ENV"

      - name: Install web deps
        # Install at repo root — apps/web is declared as an npm workspace,
        # so the lock file lives here, not in apps/web/.
        run: npm ci

      - name: Install Playwright browsers
        # chromium for smoke + admin + per-role flows; firefox + webkit
        # for the cross-browser golden-flow projects.
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web

      - name: Run Playwright (smoke + flows)
        run: npm run test:e2e
        working-directory: apps/web

      - name: Dump API log on failure
        if: failure()
        run: tail -200 /tmp/api.log || true

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

      - name: Upload auth-setup diagnostics on failure
        # auth-setup.ts writes URL/body dumps + screenshots under .auth/*.png
        # when globalSetup fails. Grab them so we can see what the browser
        # actually landed on.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-setup-diagnostics
          path: apps/web/.auth
          retention-days: 7
