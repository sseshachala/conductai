name: CLI cross-platform tests

on:
  pull_request:
    paths:
      - 'packages/conduct-cli/**'
      - '.github/workflows/cli-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'packages/conduct-cli/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e packages/conduct-cli[dev] pytest
      - run: conduct --version
      - run: pytest packages/conduct-cli/tests -q
