name: CLI cross-platform tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/conduct-cli/**'
      - '.github/workflows/cli-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'packages/conduct-cli/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e packages/conduct-cli pytest
      - run: conduct -h
      # `-m 'not matrix'` skips the auth-boundary probe (nightly-only —
      # see .github/workflows/nightly.yml). --help matrix still runs.
      - run: pytest packages/conduct-cli/tests -q -m 'not matrix'
