name: Publish Agent Booster to PyPI

on:
  push:
    tags:
      - "booster-v*"
      - "booster/v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          pip install build
          python -m build tools/booster

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: tools/booster/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Agent Booster ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            tools/booster/dist/*.whl
            tools/booster/dist/*.tar.gz
