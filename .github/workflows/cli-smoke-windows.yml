name: Windows CLI live smoke

on:
  schedule:
    - cron: '30 6 * * *'   # nightly, 30 min after linux smoke
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8   # windows console defaults to cp1252, garbles CLI checkmarks
      PYTHONUTF8: '1'           # forces python-wide utf-8 for file i/o (also cp1252 by default on windows)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install conduct CLI
        run: pip install -e packages/conduct-cli --quiet

      - name: Write config
        shell: pwsh
        env:
          CONDUCT_SERVER:       ${{ secrets.CONDUCT_SERVER }}
          CONDUCT_WORKSPACE_ID: ${{ secrets.CONDUCT_WORKSPACE_ID }}
          CONDUCT_API_KEY:      ${{ secrets.CONDUCT_API_KEY }}
        run: |
          $dir = Join-Path $HOME ".conduct"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $cfg = @{
            api_url      = $env:CONDUCT_SERVER
            workspace_id = $env:CONDUCT_WORKSPACE_ID
            agent_token  = $env:CONDUCT_API_KEY
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $dir "config.json") -Value $cfg

      - name: whoami
        run: conduct whoami

      - name: guard status
        run: conduct guard status

      - name: guard sync
        run: conduct guard sync

      - name: verify PowerShell env.ps1 was written
        shell: pwsh
        run: |
          $ps1 = Join-Path $HOME ".conduct\env.ps1"
          if (-not (Test-Path $ps1)) { throw "env.ps1 not written" }
          $text = Get-Content $ps1 -Raw
          if ($text -notmatch 'ANTHROPIC_BASE_URL') { throw "ANTHROPIC_BASE_URL missing" }
          if ($text -notmatch 'OPENAI_BASE_URL')    { throw "OPENAI_BASE_URL missing" }
          Write-Host "env.ps1 OK"
      - name: verify config.json ACL is owner-only
        shell: pwsh
        run: |
          python -c "from conduct_cli.hooks.base import restrict_to_owner; from pathlib import Path; restrict_to_owner(Path.home() / '.conduct' / 'config.json')"
          $cfg = Join-Path $HOME ".conduct\config.json"
          $acl = (icacls $cfg) -join "`n"
          Write-Host $acl
          if ($acl -notmatch "runneradmin") { throw "ACL does not mention current user (runneradmin)" }
          if ($acl -match "Everyone|BUILTIN\\Users") { throw "ACL still grants broad access" }
          Write-Host "ACL OK — restricted to runneradmin"

      - name: verify drain daemon round-trip (mock POST server)
        run: python .github/scripts/windows_drain_roundtrip.py

      - name: verify hook.py runs on windows (fake PreToolUse payload)
        shell: pwsh
        run: |
          $hook = Join-Path $HOME ".conduct\hook.py"
          if (-not (Test-Path $hook)) { throw "hook.py not written by guard sync" }
          $payload = @{
            hook_event_name = "PreToolUse"
            tool_name       = "Read"
            tool_input      = @{ file_path = "C:\Windows\System32\drivers\etc\hosts" }
          } | ConvertTo-Json -Compress
          $out = $payload | python $hook 2>&1
          Write-Host "hook stdout:"
          Write-Host $out
          # Hook must exit 0 (allow) or 2 (block); anything else is a crash.
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) {
            throw "hook.py crashed with exit code $LASTEXITCODE"
          }
          Write-Host "hook.py OK (exit $LASTEXITCODE)"

