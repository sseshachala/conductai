name: Windows CLI live smoke

on:
  schedule:
    - cron: '30 6 * * *'   # nightly, 30 min after linux smoke
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8   # windows console defaults to cp1252, garbles CLI checkmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conduct CLI
        run: pip install -e packages/conduct-cli --quiet

      - name: Write config
        shell: pwsh
        env:
          CONDUCT_SERVER:       ${{ secrets.CONDUCT_SERVER }}
          CONDUCT_WORKSPACE_ID: ${{ secrets.CONDUCT_WORKSPACE_ID }}
          CONDUCT_API_KEY:      ${{ secrets.CONDUCT_API_KEY }}
        run: |
          $dir = Join-Path $HOME ".conduct"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $cfg = @{
            api_url      = $env:CONDUCT_SERVER
            workspace_id = $env:CONDUCT_WORKSPACE_ID
            agent_token  = $env:CONDUCT_API_KEY
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $dir "config.json") -Value $cfg

      - name: diagnose token/workspace binding
        shell: pwsh
        env:
          CONDUCT_SERVER:       ${{ secrets.CONDUCT_SERVER }}
          CONDUCT_WORKSPACE_ID: ${{ secrets.CONDUCT_WORKSPACE_ID }}
          CONDUCT_API_KEY:      ${{ secrets.CONDUCT_API_KEY }}
        run: |
          Write-Host "Secret shapes (values masked by GH):"
          Write-Host ("  CONDUCT_SERVER len       = {0}" -f $env:CONDUCT_SERVER.Length)
          Write-Host ("  CONDUCT_WORKSPACE_ID len = {0}" -f $env:CONDUCT_WORKSPACE_ID.Length)
          Write-Host ("  CONDUCT_API_KEY len      = {0}" -f $env:CONDUCT_API_KEY.Length)
          Write-Host ("  CONDUCT_API_KEY starts   = {0}..." -f $env:CONDUCT_API_KEY.Substring(0, [Math]::Min(9, $env:CONDUCT_API_KEY.Length)))
          Write-Host ""
          Write-Host "Projects visible to this token:"
          $hdrs = @{ Authorization = "Bearer $env:CONDUCT_API_KEY" }
          $resp = Invoke-RestMethod -Uri "$env:CONDUCT_SERVER/projects" -Headers $hdrs
          $resp | ForEach-Object { Write-Host ("  - {0}  ({1})" -f $_.name, $_.id) }
          Write-Host ""
          $match = $resp | Where-Object { $_.id -eq $env:CONDUCT_WORKSPACE_ID }
          if ($match) {
            Write-Host "MATCH: token can access $env:CONDUCT_WORKSPACE_ID ($($match.name))"
          } else {
            Write-Host "NO MATCH: token cannot access requested workspace_id"
          }

      - name: whoami
        run: conduct whoami

      - name: guard status
        run: conduct guard status

      - name: guard sync
        run: conduct guard sync

      - name: verify PowerShell env.ps1 was written
        shell: pwsh
        run: |
          $ps1 = Join-Path $HOME ".conduct\env.ps1"
          if (-not (Test-Path $ps1)) { throw "env.ps1 not written" }
          $text = Get-Content $ps1 -Raw
          if ($text -notmatch 'ANTHROPIC_BASE_URL') { throw "ANTHROPIC_BASE_URL missing" }
          if ($text -notmatch 'OPENAI_BASE_URL')    { throw "OPENAI_BASE_URL missing" }
          Write-Host "env.ps1 OK"
