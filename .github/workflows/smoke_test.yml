name: Nightly Smoke Test

on:
  schedule:
    - cron: '0 6 * * *'   # 1 AM CDT (UTC-5) every night
  workflow_dispatch:       # allow manual trigger from GitHub UI
    inputs:
      project:
        description: 'Conduct project name'
        default: 'DevOps'
      repo:
        description: 'Target GitHub repo (owner/repo)'
        default: 'sseshachala/conductai'
      pr:
        description: 'PR number (optional)'
        default: ''
      tier3:
        description: 'Enable Tier 3 (mutating scratch project/env/creds — TESTING workspace only)'
        type: boolean
        default: true

jobs:
  smoke:
    name: Install & Test All Agents
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PROJECT:  ${{ github.event.inputs.project || 'DevOps' }}
      REPO:     ${{ github.event.inputs.repo    || 'sseshachala/conductai' }}
      PR:       ${{ github.event.inputs.pr      || '' }}
      TIER3:    ${{ github.event.inputs.tier3   || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install conduct CLI
        run: pip install -e packages/conduct-cli --quiet

      - name: Write conduct config from secrets
        run: |
          mkdir -p ~/.conduct
          cat > ~/.conduct/config.json <<EOF
          {
            "api_url":      "${{ secrets.CONDUCT_SERVER }}",
            "workspace_id": "${{ secrets.CONDUCT_WORKSPACE_ID }}",
            "agent_token":  "${{ secrets.CONDUCT_API_KEY }}"
          }
          EOF

      - name: Run smoke test
        id: smoke
        run: |
          PR_FLAG=""
          [[ -n "$PR" ]] && PR_FLAG="--pr $PR"
          TIER3_FLAG=""
          [[ "$TIER3" == "true" ]] && TIER3_FLAG="--tier3"
          bash scripts/smoke_test.sh \
            --project "$PROJECT" \
            --repo    "$REPO" \
            $PR_FLAG $TIER3_FLAG
        continue-on-error: true  # upload report even on failure

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: reports/smoke_*.txt
          retention-days: 30

      - name: Fail if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
