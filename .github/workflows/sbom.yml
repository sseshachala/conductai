name: SBOM

# Generates Software Bill of Materials (SBOM) artifacts for every release.
# Uses Syft under the hood (via anchore/sbom-action) to produce CycloneDX
# and SPDX manifests attached to the GitHub Release.
#
# Why: enterprise procurement asks for SBOM. When a Log4Shell-shaped CVE
# drops, an SBOM lets us grep for affected releases in seconds instead
# of forensic reconstruction.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to generate SBOM for (default: main)"
        required: false
        default: "main"

concurrency:
  group: sbom-${{ github.event.release.tag_name || github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate ${{ matrix.target.name }} SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # attach SBOM to the release
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "api",     path: "apps/api" }
          - { name: "web",     path: "apps/web" }
          - { name: "cli",     path: "cli" }
          - { name: "booster", path: "packages/agent-booster" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Skip if target path is missing
        id: check
        run: |
          if [ -d "${{ matrix.target.path }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "path ${{ matrix.target.path }} not present in this ref; skipping"
          fi

      - name: Generate CycloneDX SBOM
        if: steps.check.outputs.exists == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ matrix.target.path }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.target.name }}.cyclonedx.json
          upload-artifact: true
          upload-release-assets: ${{ github.event_name == 'release' }}

      - name: Generate SPDX SBOM
        if: steps.check.outputs.exists == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ matrix.target.path }}
          format: spdx-json
          output-file: sbom-${{ matrix.target.name }}.spdx.json
          upload-artifact: true
          upload-release-assets: ${{ github.event_name == 'release' }}
