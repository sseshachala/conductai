name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    name: API — lint + typecheck + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marshal
          POSTGRES_PASSWORD: marshal
          POSTGRES_DB: marshal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
        working-directory: .
      - name: Run migrations
        run: alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://marshal:marshal@localhost:5432/marshal_test

      - name: Migration up/down cycle (Group E of #1092)
        # Catches migrations that pass a clean upgrade but break on downgrade.
        # Runs downgrade -1 then upgrade head again against seeded data.
        run: |
          alembic downgrade -1
          alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://marshal:marshal@localhost:5432/marshal_test
      - name: Lint
        run: python -m flake8 app --max-line-length 100 || true
        working-directory: apps/api
      - name: Schema sync check
        run: make schema-check
        working-directory: apps/api
      - name: Test
        # `-m 'not matrix'` skips the full endpoint×role runtime probe
        # (~600 tests). Static layers of test_endpoint_matrix still run here.
        # Full matrix runs nightly — see .github/workflows/nightly.yml.
        run: python -m pytest tests/ -q --ignore=tests/test_guard.py -m 'not matrix'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://marshal:marshal@localhost:5432/marshal_test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Auth coverage
        run: python scripts/check_auth_coverage.py
        working-directory: apps/api
      - name: Skill pack validation
        run: python scripts/validate_all_skill_packs.py
        working-directory: apps/api

  web:
    name: Web — typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web
      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/web
      - name: Lint
        run: npm run lint
        working-directory: apps/web
