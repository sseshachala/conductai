name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — lint + typecheck + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marshal
          POSTGRES_PASSWORD: marshal
          POSTGRES_DB: marshal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
        working-directory: .
      - name: Run migrations
        run: alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://marshal:marshal@localhost:5432/marshal_test
      - name: Lint
        run: python -m flake8 app --max-line-length 100 || true
        working-directory: apps/api
      - name: Schema sync check
        run: make schema-check
        working-directory: apps/api
      - name: Test
        run: python -m pytest tests/ -v --tb=short || true
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://marshal:marshal@localhost:5432/marshal_test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  web:
    name: Web — typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web
      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/web
      - name: Lint
        run: npm run lint
        working-directory: apps/web
