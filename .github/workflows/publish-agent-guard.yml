name: Publish conduct-agent-guard to PyPI

on:
  push:
    tags:
      - "agent-guard/v*"   # trigger on tags like agent-guard/v0.1.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install package + test deps
        working-directory: packages/conduct-agent-guard
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: packages/conduct-agent-guard
        run: pytest tests/ -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing via PyPI OIDC — no API token stored in the repo.
      # PyPI project settings must list this workflow as a trusted publisher:
      #   Owner: sseshachala
      #   Repo:  conductai
      #   Workflow: publish-agent-guard.yml
      #   Environment: pypi
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        working-directory: packages/conduct-agent-guard
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages/conduct-agent-guard/dist/
