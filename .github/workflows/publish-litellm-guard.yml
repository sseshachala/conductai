name: Publish conduct-litellm-guard to PyPI

on:
  push:
    tags:
      - "litellm-guard/v*"   # trigger on tags like litellm-guard/v0.1.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package + test deps
        working-directory: packages/conduct-litellm-guard
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: packages/conduct-litellm-guard
        run: pytest tests/ -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing via PyPI OIDC — no API token stored in the repo.
      # PyPI project settings must list this workflow as a trusted publisher:
      #   Owner: sseshachala
      #   Repo:  conductai
      #   Workflow: publish-litellm-guard.yml
      #   Environment: pypi
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        working-directory: packages/conduct-litellm-guard
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/conduct-litellm-guard/dist/
