name: License Scan

# Fails if any production dependency ships under a copyleft or
# non-permissive license. Generates a plaintext third-party notices
# artifact on every PR — attached to releases via sbom.yml.
#
# Denied: GPL-*, AGPL-*, SSPL, Commons Clause, Business Source License,
# CC-BY-SA (viral clause), Elastic License v2 (non-permissive for redistribution).
# Warned but allowed: LGPL (dynamic linking OK for enterprise adopters).
#
# Allowlist real edge cases inline with a link to the upstream license page.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "37 9 * * 1"   # Monday 09:37 UTC

concurrency:
  group: license-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python license scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-licenses + project deps
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses==5.0.0
          pip install --requirement apps/api/requirements.txt

      - name: Generate license inventory
        run: |
          pip-licenses \
            --format=csv \
            --with-authors \
            --with-urls \
            --with-license-file \
            --no-license-path \
            --output-file py-licenses.csv
          pip-licenses --format=plain-vertical --with-license-file --no-license-path > THIRD_PARTY_NOTICES-python.txt

      - name: Fail on disallowed licenses
        run: |
          # Deny list — exact match against the License column.
          pip-licenses --fail-on "GPL v2;GPL v3;GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3;AGPL v3;GNU Affero General Public License v3 or later (AGPLv3+);Server Side Public License;SSPL;Business Source License;BUSL-1.1;Commons Clause;CC-BY-SA-4.0;Elastic License 2.0"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-licenses
          path: |
            py-licenses.csv
            THIRD_PARTY_NOTICES-python.txt

  node:
    name: Node license scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install web deps
        working-directory: apps/web
        run: npm ci --omit=dev

      - name: Generate license inventory
        working-directory: apps/web
        run: |
          npx --yes license-checker@25.0.1 \
            --production \
            --csv \
            --out ../../node-licenses.csv || true
          npx --yes license-checker@25.0.1 \
            --production \
            --markdown \
            --out ../../THIRD_PARTY_NOTICES-node.md || true

      - name: Fail on disallowed licenses
        working-directory: apps/web
        run: |
          npx --yes license-checker@25.0.1 \
            --production \
            --failOn 'GPL-1.0;GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0;BUSL-1.1;CC-BY-SA-4.0;Elastic-2.0'

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: node-licenses
          path: |
            node-licenses.csv
            THIRD_PARTY_NOTICES-node.md
