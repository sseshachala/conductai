name: Dependency Security

# Runs three scanners on every PR + weekly cron:
#   Bandit    — Python SAST (source-level bug patterns)
#   pip-audit — Python dependency CVE scanning (OSV.dev feed)
#   npm audit — JS/TS dependency CVE scanning
#
# During adoption: findings are surfaced but do NOT fail the build.
# Once baseline debt is triaged (issue #1152 F), flip continue-on-error
# to false so new findings block PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/package*.json"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "23 9 * * 1"   # Monday 09:23 UTC

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # warn-only during baseline period; flip after #1152 F

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit==1.7.9

      - name: Run Bandit on apps/api
        run: |
          bandit \
            --recursive apps/api/app \
            --severity-level medium \
            --confidence-level medium \
            --skip B101,B404,B603,B607 \
            --format txt

  pip-audit:
    name: pip-audit (Python CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit apps/api requirements.txt
        run: pip-audit --requirement apps/api/requirements.txt --vulnerability-service osv --strict

  npm-audit:
    name: npm audit (JS CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Audit apps/web
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=moderate
