name: CodeQL

# Static analysis for Python + JavaScript/TypeScript.
# Runs on push to main, on every PR touching source, and weekly on
# a schedule so newly-published queries still hit dormant branches.
#
# Findings appear in the repo's Security tab under "Code scanning alerts".

on:
  # Repo setting "Code scanning" must be enabled in Settings -> Code security
  # before CodeQL can upload SARIF results. Until that toggle is on, running
  # CodeQL on every PR pollutes the checks list with unavoidable failures.
  #
  # To re-enable automatic runs:
  #   1. Repo Settings -> Code security -> enable "Code scanning"
  #   2. Replace this workflow_dispatch trigger with the push/pull_request/schedule
  #      block preserved in this file's git history.
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write   # publish alerts
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with:
          languages: ${{ matrix.language }}
          # security-extended pulls in more queries than the default suite
          # without the noise of security-and-quality (which flags style bugs).
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: /language:${{ matrix.language }}
