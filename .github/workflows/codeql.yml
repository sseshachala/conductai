name: CodeQL

# Static analysis for Python + JavaScript/TypeScript.
# Runs on push to main, on every PR touching source, and weekly on
# a schedule so newly-published queries still hit dormant branches.
#
# Findings appear in the repo's Security tab under "Code scanning alerts".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "cli/**"
      - "packages/**"
      - ".github/workflows/codeql.yml"
  schedule:
    # 09:17 UTC every Wednesday — off-hour cron to avoid runner contention.
    - cron: "17 9 * * 3"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write   # publish alerts
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with:
          languages: ${{ matrix.language }}
          # security-extended pulls in more queries than the default suite
          # without the noise of security-and-quality (which flags style bugs).
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: /language:${{ matrix.language }}
