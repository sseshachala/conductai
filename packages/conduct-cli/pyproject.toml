[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conduct-cli"
version = "0.4.93"
description = "CLI for Conduct AI — install agents, manage projects, run tests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Conduct AI", email = "hello@conductai.ai" }]
keywords = ["ai", "agents", "automation", "devops", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyyaml>=6.0", "rich>=13.0"]

[project.optional-dependencies]
booster = ["agent-booster[watch]>=0.2.23"]

[project.urls]
Homepage    = "https://conductai.ai"
Repository  = "https://github.com/sseshachala/conductai"
"Bug Tracker" = "https://github.com/sseshachala/conductai/issues"

[project.scripts]
conduct           = "conduct_cli.main:main"
conduct-mcp       = "conduct_cli.mcp_server:main"
conductguard-mcp  = "conduct_cli.guardmcp:main"
conductguard-post = "conduct_cli.guard:post_usage_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conduct_cli = ["hook_template.py", "hook_precompact_template.py", "hook_session_start_template.py", "hook_stop_template.py", "paxel.py"]
