[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conduct-cli"
version = "0.1.0"
description = "Conduct workflow CLI"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
conduct = "conduct_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
