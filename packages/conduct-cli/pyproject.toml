[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conduct-cli"
version = "0.9.16"
description = "CLI for Conduct AI — secure, govern, install agents, manage projects, run tests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Conduct AI", email = "hello@conductai.ai" }]
keywords = ["ai", "agents", "automation", "devops", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyyaml>=6.0", "rich>=13.0", "psutil>=5.9"]

[project.optional-dependencies]
booster = ["agent-booster[watch]>=0.6.6"]

[project.urls]
Homepage    = "https://conductai.ai"
Repository  = "https://github.com/sseshachala/conductai"
"Bug Tracker" = "https://github.com/sseshachala/conductai/issues"

[project.scripts]
conduct           = "conduct_cli.main:main"
conductguard-post = "conduct_cli.hooks.posttooluse:main"
# conduct-mcp / conductguard-mcp entry points retired in #1219 Phase 3 M3
# (Option A). AI-tool configs now spawn `npx -y mcp-remote https://.../mcp`
# instead — one server, one endpoint, no local policy eval, no dual binaries.
# Native Python bridge tracked in #1229 for enterprise SBOM ask.

[tool.setuptools.packages.find]
where = ["src"]
include = ["conduct_cli*"]

[tool.setuptools.package-data]
conduct_cli = ["paxel.py", "guard_policy.md"]
